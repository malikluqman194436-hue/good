function playCoinPickupSound(coinType = 'bronze') {
  if (!soundEnabled || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    coinCombo = Math.min(8, coinCombo + 1);
    coinComboTimer = 0.8;

    const pitchFactor = Math.pow(2, coinCombo / 14);
    const outNode = masterGain || audioCtx.destination;

    if (coinType === 'gem' || coinType === 'coin_100') {
      // Shimmering triple chime for rare 100 laurel coin
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor],
        [2637.0 * pitchFactor, 3135.96 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.055;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.24, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          osc.start(t);
          osc.stop(t + 0.26);
        });
      });
      return;
    }

    if (coinType === 'gold' || coinType === 'coin_50') {
      // Fuller double chime for gold coin
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.06;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.26, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          osc.start(t);
          osc.stop(t + 0.22);
        });
      });
      return;
    }

    if (coinType === 'silver') {
      // Higher ting for silver coin
      const f1 = 1760 * pitchFactor;
      const f2 = 2637 * pitchFactor;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.25, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      g.connect(outNode);
      [f1, f2].forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        osc.connect(g);
        osc.start(now);
        osc.stop(now + 0.16);
      });
      return;
    }

    // Normal ting for bronze coin
    const f1 = 1318 * pitchFactor;
    const f2 = 1976 * pitchFactor;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    g.connect(outNode);
    [f1, f2].forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(g);
      osc.start(now);
      osc.stop(now + 0.14);
    });
  } catch (e) {}
}

function getCorridorSafeBounds(x, segsList) {
  for (let i = 0; i < segsList.length; i++) {
    const s = segsList[i];
    if (x >= s.x && x <= s.x + s.w) {
      if (s.isOpen) {
        if (s.obstacles && s.obstacles.length > 0) {
          for (const obs of s.obstacles) {
            if (Math.abs(x - (obs.x + obs.w / 2)) < obs.w + 30) {
              if (obs.type === 'gate') {
                const sTop = obs.gapTop + 16;
                const sBot = obs.gapBot - 16;
                return { top: obs.gapTop, bot: obs.gapBot, safeTop: sTop, safeBot: sBot, safeCenter: obs.gateCenter, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'stalactite') {
                const sTop = obs.tipY + 18;
                const sBot = H - 90;
                return { top: obs.tipY, bot: H - 70, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'stalagmite') {
                const sTop = 90;
                const sBot = obs.tipY - 18;
                return { top: 70, bot: obs.tipY, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              } else if (obs.type === 'floating_block') {
                const sTop = 80;
                const sBot = obs.y - 18;
                return { top: 60, bot: obs.y, safeTop: sTop, safeBot: sBot, safeCenter: (sTop + sBot) / 2, halfH: Math.max(12, (sBot - sTop) / 2) };
              }
            }
          }
        }
        const sCenter = s.safeCenter || (CAR_REST_Y - 40);
        return {
          top: -300,
          bot: H + 300,
          safeTop: sCenter - 80,
          safeBot: sCenter + 80,
          safeCenter: sCenter,
          halfH: 80
        };
      }
      let curTop = (s.curTop !== undefined) ? s.curTop : s.top;
      let curBot = (s.curBot !== undefined) ? s.curBot : s.bot;

      if (s.isSlanted && s.top2 !== undefined) {
        const t = Math.max(0, Math.min(1, (x - s.x) / s.w));
        curTop = curTop + (s.top2 - curTop) * t;
        curBot = curBot + (s.bot2 - curBot) * t;
      } else if (i < segsList.length - 1) {
        // Smooth step interpolation near segment boundary
        const sNext = segsList[i + 1];
        if (!sNext.isOpen) {
          const seamX = s.x + s.w;
          const blendDist = 48 * 1.2;
          if (x > seamX - blendDist) {
            const t = (x - (seamX - blendDist)) / blendDist;
            const ease = t * t * (3 - 2 * t);
            const nextTop = (sNext.curTop !== undefined) ? sNext.curTop : sNext.top;
            const nextBot = (sNext.curBot !== undefined) ? sNext.curBot : sNext.bot;
            curTop = curTop + (nextTop - curTop) * ease;
            curBot = curBot + (nextBot - curBot) * ease;
          }
        }
      }

      const safeTop = curTop + 1.2 * 48;
      const safeBot = curBot - 1.2 * 48;
      const safeCenter = (safeTop + safeBot) / 2;
      const halfH = Math.max(12, (safeBot - safeTop) / 2 - COIN_RADIUS);
      return { top: curTop, bot: curBot, safeTop, safeBot, safeCenter, halfH };
    }
  }
  return {
    top: -300,
    bot: H + 300,
    safeTop: 120,
    safeBot: H - 120,
    safeCenter: CAR_REST_Y,
    halfH: 100
  };
}

function generateLevelCoins(lvl, segsList) {
  coins.length = 0;
  coinSparkles.length = 0;
  flyingCoins.length = 0;
  coinFloatTexts.length = 0;
  levelCoinsCollected = 0;
  earnedStars = 1;
  isPerfect = false;
  perfectBonusGiven = false;
  starSoundsPlayed = [false, false, false];
  bronzeCoinsPicked = 0;

  const prng = mulberry32(hashInt(lvl * 77777 + 98765));
  const coinSpacing = 1.1 * 48; // ~52.8 px
  const sp = scrollSpeed();

  function pushCoin(cx, cy, type, phase) {
    const isHigher = (type !== 'bronze');
    const b = getCorridorSafeBounds(cx, segsList);
    let finalY = cy;
    if (isHigher) {
      // 1.4 * carH distance from spike tips for higher value coins
      const minSafeY = b.top + 1.4 * 48;
      const maxSafeY = b.bot - 1.4 * 48;
      if (minSafeY < maxSafeY) {
        finalY = Math.max(minSafeY, Math.min(maxSafeY, cy));
      } else {
        finalY = b.safeCenter;
      }
    } else {
      finalY = Math.max(b.safeTop + BRONZE_RADIUS, Math.min(b.safeBot - BRONZE_RADIUS, cy));
    }
    const val = (type === 'gem') ? GEM_VALUE : ((type === 'gold') ? GOLD_VALUE : ((type === 'silver') ? SILVER_VALUE : BRONZE_VALUE));
    const r = (type === 'gem') ? GEM_RADIUS : ((type === 'gold') ? GOLD_RADIUS : ((type === 'silver') ? SILVER_RADIUS : BRONZE_RADIUS));
    coins.push({
      x: cx,
      y: finalY,
      type,
      val,
      radius: r,
      collected: false,
      phase,
      popTimer: 0
    });
  }

  // 1. START GUIDE: 5 bronze coins in gentle arc leading into tunnel
  const startX = START_ROAD_START + (START_ROAD_END - START_ROAD_START) * 0.60;
  const firstSegBounds = getCorridorSafeBounds(TUNNEL_START_X + 60, segsList);
  const targetEntryY = firstSegBounds.safeCenter;
  for (let k = 0; k < 5; k++) {
    const t = k / 4;
    const x = startX + k * coinSpacing;
    const y = CAR_REST_Y - (CAR_REST_Y - targetEntryY) * Math.sin(t * Math.PI * 0.5);
    pushCoin(x, y, 'bronze', prng() * 6.28);
  }

  // 2. TUNNEL COIN PATTERNS (Subway Surfers style: straight, wave, arc, staircase, double row, risk line)
  let curX = TUNNEL_START_X + 180;
  const tunnelMaxX = TUNNEL_END_X - 180;
  const patternTypes = ['straight', 'wave', 'arc_up', 'arc_down', 'staircase', 'double_row', 'risk_high', 'risk_low'];
  const totalApproxPatterns = Math.max(1, Math.floor((tunnelMaxX - curX) / (sp * 1.35)));

  // Rare blue gem appears at most once per level (value 25)
  const hasGem = (prng() < 0.50);
  const gemPatternIndex = hasGem ? Math.floor(totalApproxPatterns * (0.35 + prng() * 0.35)) : -1;

  // Gold coins: at most 3 per level (value 10)
  const maxGold = hasGem ? 1 : Math.min(3, Math.floor(prng() * 2 + 1));
  const maxSilver = hasGem ? Math.min(4, Math.floor(prng() * 2 + 2)) : Math.min(6, Math.floor(prng() * 2 + 4));
  let goldPlaced = 0;
  let silverPlaced = 0;
  let gemPlaced = false;
  let patternCount = 0;

  while (curX < tunnelMaxX) {
    const pType = patternTypes[Math.floor(prng() * patternTypes.length)];
    const count = (pType === 'double_row') ? Math.floor(prng() * 3 + 4) : Math.floor(prng() * 4 + 5);
    const isGemPattern = (patternCount === gemPatternIndex && !gemPlaced);

    // Higher-value coin placement: end of pattern or top of arc
    let rewardIdx = -1;
    let rewardType = 'bronze';

    if (isGemPattern) {
      rewardType = 'gem';
      gemPlaced = true;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (goldPlaced < maxGold && (patternCount % 4 === 1 || pType === 'risk_high' || pType === 'risk_low') && prng() < 0.50) {
      rewardType = 'gold';
      goldPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (silverPlaced < maxSilver && (patternCount % 2 === 0 || prng() < 0.40)) {
      rewardType = 'silver';
      silverPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    }

    if (pType === 'straight') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, b.safeCenter, type, prng() * 6.28);
      }
    } else if (pType === 'wave') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const amp = Math.min(b.halfH * 0.65, 36);
        const y = b.safeCenter + Math.sin((k / count) * Math.PI * 2) * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'arc_up' || pType === 'arc_down') {
      const sign = (pType === 'arc_up') ? -1 : 1;
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const t = k / (count - 1);
        const arc = 4 * t * (1 - t);
        const amp = Math.min(b.halfH * 0.70, 38);
        const y = b.safeCenter + sign * arc * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'staircase') {
      const bStart = getCorridorSafeBounds(curX, segsList);
      const bEnd = getCorridorSafeBounds(curX + count * coinSpacing, segsList);
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const t = k / (count - 1);
        const ease = t * t * (3 - 2 * t);
        const y = bStart.safeCenter + (bEnd.safeCenter - bStart.safeCenter) * ease;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'double_row') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(18, b.halfH * 0.45);
        const type = (k === count - 1 && rewardType === 'silver') ? 'silver' : 'bronze';
        pushCoin(cx, b.safeCenter - offset, type, prng() * 6.28);
        pushCoin(cx, b.safeCenter + offset, 'bronze', (prng() * 6.28) + 1.5);
      }
    } else {
      // risk line slightly toward one edge of safe band (still safe)
      const isHigh = (pType === 'risk_high');
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(30, b.halfH * 0.65);
        const y = isHigh ? (b.safeCenter - offset) : (b.safeCenter + offset);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    }

    patternCount++;
    const patternLen = count * coinSpacing;
    const gapSec = 0.8 + prng() * 0.8;
    curX += patternLen + (gapSec * sp);
  }

  // 3. FINISH ROAD: 10 straight coins along asphalt (9 bronze, final coin at finish line is silver)
  const finishCoinY = CAR_REST_Y - BRONZE_RADIUS - 2;
  const finishCoinsStart = FINISH_ROAD_X + 50;
  const finishCoinsEnd = finishLineWorldX - 50;
  const finishCoinStep = (finishCoinsEnd - finishCoinsStart) / 9;
  for (let k = 0; k < 10; k++) {
    const isLast = (k === 9);
    pushCoin(finishCoinsStart + k * finishCoinStep, finishCoinY, isLast ? 'silver' : 'bronze', prng() * 6.28);
  }

  levelCoinsTotal = coins.reduce((acc, c) => acc + c.val, 0);
}

// ==========================================
// GLOSSY UI COMPONENTS (White text with dark outline)
// ==========================================
const BUTTON_THEMES = {
  green: { top: '#6ee7b7', mid: '#22c55e', bot: '#16a34a', lip: '#14532d', border: '#052e16' },
  blue: { top: '#93c5fd', mid: '#3b82f6', bot: '#2563eb', lip: '#1e3a8a', border: '#0f172a' },
  purple: { top: '#d8b4fe', mid: '#a855f7', bot: '#9333ea', lip: '#581c87', border: '#3b0764' },
  orange: { top: '#fed7aa', mid: '#f97316', bot: '#ea580c', lip: '#7c2d12', border: '#431407' },
  red: { top: '#fca5a5', mid: '#ef4444', bot: '#dc2626', lip: '#7f1d1d', border: '#450a0a' },
  gray: { top: '#e2e8f0', mid: '#94a3b8', bot: '#64748b', lip: '#334155', border: '#1e293b' }
};

function drawGlossyText(text, x, y, size, align = 'center', color = '#ffffff', strokeColor = '#0f172a', strokeWidth) {
  ctx.save();
  ctx.font = `800 ${size}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';

  const sw = strokeWidth !== undefined ? strokeWidth : Math.max(3.5, Math.round(size * 0.18));
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = sw;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeText(text, x, y);

  ctx.shadowColor = 'transparent';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGlossyButton(x, y, w, h, theme, label, iconType, isPressed, radius = 18) {
  const py = isPressed ? y + 3 : y;
  const lipH = isPressed ? 2 : 5;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = isPressed ? 4 : 8;
  ctx.shadowOffsetY = isPressed ? 2 : 5;

  ctx.fillStyle = theme.lip;
  roundRect(ctx, x, py + lipH, w, h, radius);
  ctx.fill();

  ctx.shadowColor = 'transparent';

  const grad = ctx.createLinearGradient(0, py, 0, py + h);
  grad.addColorStop(0, theme.top);
  grad.addColorStop(0.48, theme.mid);
  grad.addColorStop(1, theme.bot);
  ctx.fillStyle = grad;
  roundRect(ctx, x, py, w, h, radius);
  ctx.fill();

  // White gloss band on top half
  ctx.save();
  roundRect(ctx, x, py, w, h, radius);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, py, 0, py + h * 0.54);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
  ctx.fillStyle = glossGrad;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, py + 2, w * 0.6, h * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Inner highlight outline
  ctx.save();
  roundRect(ctx, x + 1.5, py + 1.5, w - 3, h - 3, Math.max(2, radius - 1));
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.restore();

  // Dark outer outline
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, x, py, w, h + (isPressed ? 1 : 2), radius);
  ctx.stroke();

  if (iconType) {
    drawButtonIcon(iconType, x + w / 2, py + h / 2, Math.min(w, h) * 0.48);
  }
  if (label) {
    const textY = py + h / 2 + 1;
    drawGlossyText(label, x + w / 2, textY, Math.min(22, Math.round(h * 0.42)), 'center', '#ffffff', theme.border, 4.2);
  }
  ctx.restore();
}

function drawRoundGlossyButton(cx, cy, r, theme, iconType, isPressed) {
  drawGlossyButton(cx - r, cy - r, r * 2, r * 2, theme, null, iconType, isPressed, r);
}

function drawButtonIcon(type, cx, cy, sz) {
  ctx.save();
  ctx.translate(cx, cy);

  if (type === 'gear') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
      ctx.strokeRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
    }
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.38, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.18, 0, 6.28); ctx.fill(); ctx.stroke();

  } else if (type === 'car') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.45, sz * 0.15);
    ctx.lineTo(-sz * 0.35, -sz * 0.1);
    ctx.lineTo(-sz * 0.1, -sz * 0.28);
    ctx.lineTo(sz * 0.2, -sz * 0.28);
    ctx.lineTo(sz * 0.4, -sz * 0.05);
    ctx.lineTo(sz * 0.45, sz * 0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-sz * 0.25, sz * 0.18, sz * 0.14, 0, 6.28); ctx.fill();
  } else if (type === 'wheel') {
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.44, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Inner dark rotor
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // 5 Spokes
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2.2;
    for (let a = 0; a < 5; a++) {
      const ang = a * (Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * sz * 0.36, Math.sin(ang) * sz * 0.36);
      ctx.stroke();
    }
    // Red sport center cap
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.12, 0, Math.PI * 2);
    ctx.fill();

  } else if (type === 'close') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = sz * 0.22;
    ctx.lineCap = 'round';
    const s = sz * 0.32;
    ctx.beginPath();
    ctx.moveTo(-s, -s); ctx.lineTo(s, s);
    ctx.moveTo(s, -s); ctx.lineTo(-s, s);
    ctx.stroke();

  } else if (type === 'sound_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.24, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.4, -0.7, 0.7); ctx.stroke();

  } else if (type === 'sound_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();

  } else if (type === 'vibrate_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(-sz * 0.25, 0, sz * 0.25, Math.PI * 0.75, Math.PI * 1.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.25, 0, sz * 0.25, -Math.PI * 0.25, Math.PI * 0.25); ctx.stroke();

  } else if (type === 'vibrate_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();
  }

  ctx.restore();
}

function drawGoldStar(cx, cy, r, scale = 1.0) {
  if (scale <= 0.01) return;
  ctx.save();
  ctx.translate(cx, cy);
  if (scale !== 1.0) {
    ctx.scale(scale, scale);
  }

  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const starGrad = ctx.createLinearGradient(0, -r, 0, r);
  starGrad.addColorStop(0, '#fef08a');
  starGrad.addColorStop(0.4, '#facc15');
  starGrad.addColorStop(1, '#ca8a04');
  ctx.fillStyle = starGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#713f12';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-r * 0.2, -r * 0.25, r * 0.2, 0, 6.28);
  ctx.fill();

  ctx.restore();
}

function drawEmptyStar(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  ctx.fillStyle = '#cbd5e1';
  ctx.fill();

  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.restore();
}

function drawGoldenPerfectRibbon(cx, cy, w, h) {
  ctx.save();
  const halfW = w / 2;
  const tailW = 20;

  // Tail ribbons
  ctx.fillStyle = '#b45309';
  ctx.beginPath();
  ctx.moveTo(cx - halfW, cy);
  ctx.lineTo(cx - halfW - tailW, cy + 8);
  ctx.lineTo(cx - halfW - tailW + 6, cy + h + 4);
  ctx.lineTo(cx - halfW, cy + h);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && typeof data === 'object') {
        if (Number.isFinite(data.currentLevel) && data.currentLevel >= 1) {
          curLevel = Math.floor(data.currentLevel);
        }
        if (Number.isFinite(data.highestLevel) && data.highestLevel >= 1) {
          highestLevel = Math.max(curLevel, Math.floor(data.highestLevel));
        } else {
          highestLevel = curLevel;
        }
        if (Number.isFinite(data.bestScore) && data.bestScore >= 0) {
          best = Math.floor(data.bestScore);
        }
      }
    }
  } catch (e) {
    console.warn('Failed to load progress from localStorage:', e);
  }
  try {
    const legacyBest = +localStorage.getItem('skycarBest') || 0;
    if (legacyBest > best) best = legacyBest;
  } catch (e) {}
}

function saveProgress(cLvl, hLvl, bScore) {
  try {
    if (cLvl !== undefined && cLvl !== null) {
      curLevel = Math.max(1, Math.floor(cLvl));
    }
    if (hLvl !== undefined && hLvl !== null) {
      highestLevel = Math.max(curLevel, Math.floor(hLvl));
    } else {
      highestLevel = Math.max(highestLevel, curLevel);
    }
    if (bScore !== undefined && bScore !== null) {
      best = Math.max(best, Math.floor(bScore));
    }
    const payload = JSON.stringify({
      currentLevel: curLevel,
      highestLevel: highestLevel,
      bestScore: best
    });
    localStorage.setItem(PROGRESS_STORAGE_KEY, payload);
    localStorage.setItem('skycarBest', best);
  } catch (e) {
    console.warn('Failed to save progress to localStorage:', e);
  }
}

// Synchronized progress calculation: exactly 100% when finish road reaches car
function getLevelProgress() {
  const dist = Math.max(0, cam);
  return Math.max(0, Math.min(1, dist / LEVEL_LENGTH));
}

function getDifficultyDistance() {
  const distInLevel = Math.max(0, Math.min(LEVEL_LENGTH, cam));
  return (curLevel - 1) * LEVEL_LENGTH + distInLevel;
}

// 1. Difficulty Growth:
// 1. Difficulty Growth & Stage Steps (Requirement 2):
// - Balanced progressive curve: fBase grows across levels and never resets.
// - At the start of a new stage it steps back by about 10% so the player can get used to the new look, then grows again.
function getLevelDifficulty(lvl, p = 0) {
  const L = lvl || curLevel;
  const stage = getStageNumber(L);
  const levelInStage = getLevelInStage(L);

  const rawF = 1 - Math.exp(-(L - 1) / LEVEL_GROWTH_TAU);

  // 10% step-back at the start of a new stage (stage > 1), easing back across the stage
  let stageDiscount = 0;
  if (stage > 1) {
    stageDiscount = 0.10 * (5 - levelInStage) / 4;
  }
  const fBase = rawF * (1 - stageDiscount);

  let intra = 1.0;
  if (p < INTRA_LEVEL_EASY_FRACTION) {
    const ramp = p / INTRA_LEVEL_EASY_FRACTION;
    intra = (1.0 - INTRA_LEVEL_GROWTH) + (INTRA_LEVEL_GROWTH * ramp);
  } else {
    const normP = (p - INTRA_LEVEL_EASY_FRACTION) / (1.0 - INTRA_LEVEL_EASY_FRACTION);
    intra = 1.0 + INTRA_LEVEL_GROWTH * normP;
  }

  const f = Math.max(0, Math.min(1.0, fBase * intra));
  return { f, fBase, intra };
}

// Scroll speed: canvasWidth * 0.31 * multiplier at level 1, growing with difficulty up to 1.4 * starting speed
function scrollSpeed(difficultyDistance = getDifficultyDistance()) {
  const p = getLevelProgress();
  const { f } = getLevelDifficulty(curLevel, p);
  const mult = getSpeedMultiplier();
  const startingSpeed = W * BASE_SCROLL_SPEED_RATIO * mult;
  const diffMultiplier = Math.min(1.4, 1 + SCROLL_SPEED_GROWTH * f);
  const boostMult = (typeof boostTimer !== 'undefined' && boostTimer > 0) ? 1.25 : 1.0;
  return startingSpeed * diffMultiplier * SPEED_MULTIPLIER * boostMult;
}
const speed = scrollSpeed;

// Gap height = lerp(GAP_LEVEL_1_RATIO, GAP_MAX_DIFFICULTY_RATIO, f) * carVis
function getGapHeight(lvl, p = 0) {
  const { f } = getLevelDifficulty(lvl, p);
  const gapRatio = lerp(GAP_LEVEL_1_RATIO, GAP_MAX_DIFFICULTY_RATIO, f);
  return Math.max(GAP_MAX_DIFFICULTY_RATIO * carVis, gapRatio * carVis);
}

function showToast(msg) {

// 3. SPIKE SIZES (Requirement 1):
// - Stage 1: only small spikes (12px)
// - Stage 2: small and medium spikes (normal stepped corridors)
// - Stage 3+: medium and big spikes appear gradually
function pickClusterSize(lvl, levelRng) {
  const L = lvl || curLevel;
  const stage = getStageNumber(L);
  if (stage === 1) return 'small';
  if (stage === 2) return (levelRng() < 0.35) ? 'medium' : 'small';

  const t = Math.max(0, Math.min(1, (L - 10) / (30 - 10)));
  const pBig = 0.08 + (0.24 - 0.08) * t;
  const pMed = 0.44;
  const r = levelRng();
  if (r < pBig) return 'big';
  if (r < pBig + pMed) return 'medium';
  return 'small';
}

// 4. SPIKE GENERATION (Requirement 1):
// - Stage 1 & 2: no mixed spike heights on one rail
// - Stage 3: mixed spike heights on one rail introduced in small amounts first (20%)
// - Stage 4+: mixed spike heights kept (35%)
function makeSpikes(len, lvl, top, bot, noSpikes = false, levelRng) {
  const count = Math.ceil(len / 12);
  const heights = { small: SPIKE_H_SMALL, medium: SPIKE_H_MEDIUM, big: SPIKE_H_BIG };
  const L = lvl || curLevel;
  const cfg = (typeof getLevelConfig === 'function') ? getLevelConfig(L) : null;
  const stage = getStageNumber(L);
  const allowMixed = (stage >= 3);
  const mixedProbability = (stage === 3) ? 0.20 : 0.35;
  const families = (cfg && cfg.families && cfg.families.length > 0) ? cfg.families : ['classic'];
  const isTwoColor = cfg ? cfg.isTwoColor : false;
  const groupSize = (cfg && cfg.groupSize) ? cfg.groupSize : 4;

  function gen(isTop) {
    const list = [];
    let i = 0;
    while (i < count) {
      const cLen = Math.min(count - i, Math.floor(2 + levelRng() * 4));
      const baseSize = pickClusterSize(L, levelRng);
      const isMixed = allowMixed && (levelRng() < mixedProbability);
      const fam = families[Math.floor(levelRng() * families.length)];

      for (let k = 0; k < cLen; k++) {
        let size = baseSize;
        if (isMixed && k % 2 === 1) {
          size = (baseSize === 'big') ? 'medium' : 'small';
        }
        const h = noSpikes ? 0 : heights[size];
        const spikeFam = fam;
        const colorIdx = isTwoColor ? (Math.floor((i + k) / groupSize) % 2) : 0;
        list.push({ h, size, family: spikeFam, colorIdx });
      }
      i += cLen;
    }
    return list;
  }
  const topSpikes = gen(true);
  const botSpikes = gen(false);
  const maxSpikeSum = Math.max(0, (bot - top) - (CAR_HITBOX_H + 18));
  for (let i = 0; i < count; i++) {
    if (topSpikes[i].h + botSpikes[i].h > maxSpikeSum) {
      if (topSpikes[i].h >= botSpikes[i].h) {
        if (SPIKE_H_MEDIUM + botSpikes[i].h <= maxSpikeSum) { topSpikes[i].h = SPIKE_H_MEDIUM; topSpikes[i].size = 'medium'; }
        else { topSpikes[i].h = SPIKE_H_SMALL; topSpikes[i].size = 'small'; }
      } else {
        if (topSpikes[i].h + SPIKE_H_MEDIUM <= maxSpikeSum) { botSpikes[i].h = SPIKE_H_MEDIUM; botSpikes[i].size = 'medium'; }
        else { botSpikes[i].h = SPIKE_H_SMALL; botSpikes[i].size = 'small'; }
      }
    }
  }
  return { topSpikes, botSpikes };
}

let levelPRNG = mulberry32(1);
let tunnelSegCount = 0;
let levelSeedTwist = 'smooth_corridor';
let gameTime = 0;
let lastGap = 380;

function addSeg(isOpen = false, forceLen) {
  const isTunnel = !isOpen && nextX >= TUNNEL_START_X && nextX < TUNNEL_END_X;
  const segIndex = isTunnel ? tunnelSegCount++ : 0;

  const segDistInLevel = isTunnel ? Math.max(0, Math.min(LEVEL_LENGTH, nextX - CAR_X)) : 0;
  const p = isTunnel ? (segDistInLevel / LEVEL_LENGTH) : 0;
  const { f } = getLevelDifficulty(curLevel, p);

  const currentScrollSpeed = scrollSpeed();
  const mult = getSpeedMultiplier();

  // 1. Segment Length >= 1.3 * scrollSpeed
  const minSegLen = Math.round(1.3 * currentScrollSpeed);
  const baseLen = lerp(SEG_LEN_LEVEL_1_RATIO, SEG_LEN_MAX_RATIO, f) * BASE_SEGMENT_LEN * mult;
  let len = forceLen || Math.max(minSegLen, Math.round(baseLen));

  if (!isOpen && nextX + len > TUNNEL_END_X) {
    len = Math.max(minSegLen, TUNNEL_END_X - nextX);
  }

  // 2. Base Gap Height = lerp(4.4, 3.0, f) * carH (never below 3.0 * carH)
  let gap = isOpen ? 380 : getGapHeight(curLevel, p);

  // 3. Squeeze sections (Requirement 1):
  // - Stages 1 to 4: none
  // - Stage 5: short squeeze section (gap about 3.4 * carH or more) in small amounts first (1 section)
  // - Stage 6: two squeeze sections in a row
  // - Stage 7: squeeze sections kept
  // - Stage 8+: all twists mixed
  const stageNum = getStageNumber(curLevel);
  let isSqueeze = false;
  if (!isOpen && isTunnel) {
    if (stageNum === 5) {
      if (segIndex === 5) isSqueeze = true;
    } else if (stageNum === 6) {
      if (segIndex === 5 || segIndex === 6) isSqueeze = true;
    } else if (stageNum === 7) {
      if (segIndex === 6) isSqueeze = true;
    } else if (stageNum >= 8) {
      if (segIndex === 5 || segIndex === 6 || segIndex === 12) isSqueeze = true;
    }
  }
  if (isSqueeze) {
    gap = Math.max(GAP_MAX_DIFFICULTY_RATIO * CAR_HITBOX_H, SQUEEZE_GAP_RATIO * CAR_HITBOX_H);
    len = Math.max(minSegLen, Math.round(baseLen * 0.75));
  }

  // Seed twists for this level:
  if (!isOpen) {
    if (levelSeedTwist === 'tight_corridor' && (segIndex === 2 || segIndex === 5) && !isSqueeze) {
      gap = Math.max(GAP_MAX_DIFFICULTY_RATIO * CAR_HITBOX_H, gap * 0.96);
    }
  }

  // 4. Moving rails (Requirement 1):
  // - Stages 1 to 3: none
  // - Stage 4: slow small moving rails (amplitude at most 0.5 * carH), appears in small amounts first (1 section)
  // - Stage 5 & 6: slow moving rails kept (1 section away from squeeze)
  // - Stage 7: faster moving rails
  // - Stage 8+: all twists mixed (both slow and fast moving rails)
  let moving = false;
  let moveAmp = 0;
  let moveSpeed = 0;
  let movePhase = 0;

  if (!isOpen && isTunnel && !isSqueeze) {
    if (stageNum === 4) {
      if (segIndex === 6) {
        moving = true;
        moveAmp = Math.min(0.5 * CAR_HITBOX_H, 10 + levelPRNG() * 6);
        moveSpeed = MOVE_RAIL_SPEED_SLOW;
        movePhase = levelPRNG() * Math.PI * 2;
      }
    } else if (stageNum === 5) {
      if (segIndex === 9) {
        moving = true;
        moveAmp = Math.min(0.5 * CAR_HITBOX_H, 10 + levelPRNG() * 6);
        moveSpeed = MOVE_RAIL_SPEED_SLOW;
        movePhase = levelPRNG() * Math.PI * 2;
      }
    } else if (stageNum === 6) {
      if (segIndex === 10) {
        moving = true;
        moveAmp = Math.min(0.5 * CAR_HITBOX_H, 10 + levelPRNG() * 7);
        moveSpeed = MOVE_RAIL_SPEED_SLOW;
        movePhase = levelPRNG() * Math.PI * 2;
      }
    } else if (stageNum === 7) {
      if (segIndex === 3 || segIndex === 9) {
        moving = true;
        moveAmp = Math.min(0.5 * CAR_HITBOX_H, 10 + levelPRNG() * 7);
        moveSpeed = (segIndex === 3) ? MOVE_RAIL_SPEED_FAST : MOVE_RAIL_SPEED_SLOW;
        movePhase = levelPRNG() * Math.PI * 2;
      }
    } else if (stageNum >= 8) {
      if (segIndex === 3 || segIndex === 9 || segIndex === 14) {
        moving = true;
        moveAmp = Math.min(0.5 * CAR_HITBOX_H, 10 + levelPRNG() * 8);
        moveSpeed = (segIndex === 3 || segIndex === 14) ? MOVE_RAIL_SPEED_FAST : MOVE_RAIL_SPEED_SLOW;
        movePhase = levelPRNG() * Math.PI * 2;
      }
    }
  }

  // 5. FAIR STEPS WITH REACTION TIME:
  // - Stage 1: gentle undulations (stepRatio small) so player learns controls
  // - Stage 2+: normal stepped corridors with full dynamic range
  const stepRatio = (stageNum === 1) ? 0.25 : lerp(STEP_MIN_RATIO, STEP_MAX_RATIO, f);
  const segTime = len / currentScrollSpeed;
  const maxUpStep = 0.5 * MAX_UP_SPEED * segTime;
  const maxDownStep = 0.45 * MAX_DOWN_SPEED * segTime;
  const fairStep = Math.min(0.5 * gap, Math.max(maxUpStep, maxDownStep));
  const overlapStepLimit = Math.max(8, (lastGap + gap) / 2 - 1.4 * CAR_HITBOX_H - moveAmp);
  const maxFairStep = Math.min(fairStep - moveAmp, overlapStepLimit);

  let maxShift = isOpen ? 15 : Math.max(8, stepRatio * maxFairStep);

  // Dynamic wave motion ("اوپر نیچے رہیں"): creates exciting rollercoaster ups and downs
  const waveCycle = 0.85;
  const waveSin = Math.sin((segIndex * waveCycle) + (curLevel * 1.57));
  let shiftDir = 0.75 * waveSin + 0.25 * (levelPRNG() * 2 - 1);
  if (!isOpen) {
    if (stageNum >= 2 && levelSeedTwist === 'quick_stairs') {
      shiftDir = (segIndex % 2 === 0) ? 0.85 : -0.85;
    } else if (levelSeedTwist === 'smooth_corridor' && segIndex >= 1 && segIndex <= 3) {
      maxShift *= 0.35;
    }
    if (isSqueeze) {
      maxShift *= 0.45;
    }
  }

  // Strict fairness clamp: never exceed maxFairStep
  maxShift = Math.min(maxShift, maxFairStep);

  // Vertical band constraints for the tunnel:
  // - Gap center must stay between TUNNEL_CENTER_MIN * H and TUNNEL_CENTER_MAX * H.
  // - Gap edges must stay at least 0.12 * H away from the top HUD area: c - gap/2 >= 0.12 * H
  // - Gap edges must stay at least 0.20 * H above the bottom of the screen: c + gap/2 <= 0.80 * H
  const bandMinC = Math.max(TUNNEL_CENTER_MIN * H, gap / 2 + 0.12 * H);
  const bandMaxC = Math.min(TUNNEL_CENTER_MAX * H, H * 0.80 - gap / 2);
  const safeMinC = Math.min(bandMinC, bandMaxC);
  const safeMaxC = Math.max(bandMinC, bandMaxC);
  const targetStartCenter = TUNNEL_START_CENTER * H;
  const carH = Math.max(CAR_HITBOX_H, CAR_DRAW_H);
  const maxRiseStep = 0.4 * carH;

  let c;
  if (isOpen) {
    c = ROAD_TOP - 20;
    lastC = c;
  } else if (segIndex < 3) {
    // The first 3 tunnel segments rise smoothly from the road height to the center band,
    // in steps of at most 0.4 * carH each, reaching TUNNEL_START_CENTER (0.50 * H).
    const remainingSteps = 3 - segIndex;
    const riseNeeded = lastC - targetStartCenter;
    const stepUp = Math.min(maxRiseStep, Math.max(0, riseNeeded / remainingSteps));
    c = lastC - stepUp;
    c = Math.max(safeMinC, Math.min(safeMaxC, c));
    if (Math.abs(c - lastC) > maxFairStep) {
      c = lastC + Math.sign(c - lastC) * maxFairStep;
    }
    lastC = c;
  } else {
    // Keep the steps inside the band: if a step would leave the band, flip its direction so the corridor stays in the band
    if (shiftDir < 0 && (lastC - maxShift < safeMinC)) {
      shiftDir = Math.abs(shiftDir);
    } else if (shiftDir > 0 && (lastC + maxShift > safeMaxC)) {
      shiftDir = -Math.abs(shiftDir);
    }

    c = lastC + shiftDir * maxShift;
    c = Math.max(safeMinC, Math.min(safeMaxC, c));

    // Keep all fairness rules: vertical step never exceeds maxFairStep
    if (Math.abs(c - lastC) > maxFairStep) {
      c = lastC + Math.sign(c - lastC) * maxFairStep;
    }
    lastC = c;
  }

  const top = isOpen ? -300 : (c - gap / 2);
  const bot = isOpen ? (H + 300) : (c + gap / 2);

  const segProg = (nextX - CAR_X) / LEVEL_LENGTH;
  const noSpikes = isOpen || (segProg >= 0.95) || (nextX >= TUNNEL_END_X);
  const { topSpikes, botSpikes } = makeSpikes(len, curLevel, top, bot, noSpikes, levelPRNG);

  segs.push({
    x: nextX,
    w: len,
    top,
    bot,
    curTop: top,
    curBot: bot,
    topSpikes,
    botSpikes,
    isOpen,
    moving,
    moveAmp,
    moveSpeed,
    movePhase
  });

  lastGap = gap;
  nextX += len;
}

// 4. SANITIZE LEVEL SEGMENTS (Requirement 3):
// Check every neighboring pair with the fairness rules and fix if needed, so a level never has an impossible spot.
// Moving rails must collide exactly where they are drawn, and the fairness rules must hold at every moment of their motion.
function sanitizeLevelSegments(segmentList) {
  const currentScrollSpeed = scrollSpeed();
  const carH = CAR_HITBOX_H;

  for (let i = 1; i < segmentList.length; i++) {
    const prev = segmentList[i - 1];
    const curr = segmentList[i];
    if (prev.isOpen || curr.isOpen || prev.isSlanted || curr.isSlanted || (prev.obstacles && prev.obstacles.length) || (curr.obstacles && curr.obstacles.length)) continue;

    const gapA = prev.bot - prev.top;
    const gapB = curr.bot - curr.top;
    const lenB = curr.w;

    const ampA = prev.moving ? (prev.moveAmp || 0) : 0;
    const ampB = curr.moving ? (curr.moveAmp || 0) : 0;
    const totalAmp = ampA + ampB;

    // 1. Step limit: up steps 0.5 * MAX_UP_SPEED * segTime, down steps 0.45 * MAX_DOWN_SPEED * segTime
    const segTime = lenB / currentScrollSpeed;
    const maxUpStep = 0.5 * MAX_UP_SPEED * segTime;
    const maxDownStep = 0.45 * MAX_DOWN_SPEED * segTime;
    const fairStep = Math.min(0.5 * gapB, Math.max(maxUpStep, maxDownStep));

    // 2. Window overlap >= 1.4 * carH at ALL moments of motion:
    // overlap(t) = (gapA + gapB)/2 - |cB(t) - cA(t)| >= 1.4 * carH
    // Since worst-case center distance is |cB - cA| + totalAmp:
    // |cB - cA| <= (gapA + gapB)/2 - 1.4 * carH - totalAmp
    let overlapStepLimit = (gapA + gapB) / 2 - 1.4 * carH - totalAmp;
    let motionFairStep = fairStep - totalAmp;

    // If totalAmp is too large to allow safe passage, clamp moving amplitudes
    if (motionFairStep < 6 || overlapStepLimit < 6) {
      if (curr.moving) {
        curr.moveAmp = Math.max(6, Math.min(curr.moveAmp, 0.5 * carH, (fairStep - 12) / 2));
      }
      if (prev.moving) {
        prev.moveAmp = Math.max(6, Math.min(prev.moveAmp, 0.5 * carH, (fairStep - 12) / 2));
      }
    }
    const safeTotalAmp = (prev.moving ? (prev.moveAmp || 0) : 0) + (curr.moving ? (curr.moveAmp || 0) : 0);
    const maxAllowedStep = Math.max(6, Math.min(fairStep - safeTotalAmp, (gapA + gapB) / 2 - 1.4 * carH - safeTotalAmp));

    const cA = (prev.top + prev.bot) / 2;
    let cB = (curr.top + curr.bot) / 2;

    const diff = cB - cA;
    if (Math.abs(diff) > maxAllowedStep) {
      cB = cA + Math.sign(diff) * maxAllowedStep;
    }

    // 3. Screen vertical band constraints (accounting for motion amplitude)
    const curAmpB = curr.moving ? (curr.moveAmp || 0) : 0;
    const curAmpA = prev.moving ? (prev.moveAmp || 0) : 0;
    const bandMinC = Math.max(TUNNEL_CENTER_MIN * H, gapB / 2 + curAmpB + 0.12 * H);
    const bandMaxC = Math.min(TUNNEL_CENTER_MAX * H, H * 0.80 - gapB / 2 - curAmpB);
    const safeMinC = Math.min(bandMinC, bandMaxC);
    const safeMaxC = Math.max(bandMinC, bandMaxC);
    cB = Math.max(safeMinC, Math.min(safeMaxC, cB));

    // 4. Double check window overlap >= 1.4 * carH at maximum displacement
    const minOverlap = Math.min(prev.bot - curAmpA, cB + gapB / 2 - curAmpB) -
                       Math.max(prev.top + curAmpA, cB - gapB / 2 + curAmpB);
    if (minOverlap < 1.4 * carH) {
      const neededShift = (1.4 * carH - minOverlap);
      if (cB > cA) {
        cB = Math.max(safeMinC, cB - neededShift);
      } else {
        cB = Math.min(safeMaxC, cB + neededShift);
      }
    }

    curr.top = cB - gapB / 2;
    curr.bot = cB + gapB / 2;
    curr.curTop = curr.top;
    curr.curBot = curr.bot;

    // 5. Spikes clearance check (ensuring at least carH + 18 clearance between opposing spike tips)
    if (curr.topSpikes && curr.botSpikes) {
      const maxSpikeSum = Math.max(0, (curr.bot - curr.top) - (carH + 18));
      for (let k = 0; k < curr.topSpikes.length; k++) {
        if (curr.topSpikes[k].h + curr.botSpikes[k].h > maxSpikeSum) {
          const excess = (curr.topSpikes[k].h + curr.botSpikes[k].h) - maxSpikeSum;
          if (curr.topSpikes[k].h >= curr.botSpikes[k].h) {
            curr.topSpikes[k].h = Math.max(10, curr.topSpikes[k].h - excess);
          } else {
            curr.botSpikes[k].h = Math.max(10, curr.botSpikes[k].h - excess);
          }
        }
      }
    }
  }
}

// ============================================================================
// MODULAR LEVEL GENERATION SYSTEM (10 Distinct Modules & Recipe Engine)
// ============================================================================
let currentLevelModuleNames = [];

function getSafeTargetForAutopilot(x, modSegs, sp) {
  for (const s of modSegs) {
    if (s.obstacles && s.obstacles.length > 0) {
      let closestObs = null;
      let minAheadDist = Infinity;
      for (const obs of s.obstacles) {
        const distAhead = (obs.x + (obs.w ? obs.w / 2 : 0)) - x;
        if (distAhead >= -40 && distAhead < minAheadDist) {
          minAheadDist = distAhead;
          closestObs = obs;
        }
      }
      if (closestObs && minAheadDist < sp * 1.5) {
        if (closestObs.type === 'gate') {
          return (closestObs.gapTop + closestObs.gapBot) / 2;
        } else if (closestObs.type === 'stalactite') {
          return Math.min(H * 0.68, closestObs.tipY + 80);
        } else if (closestObs.type === 'stalagmite') {
          return Math.max(H * 0.32, closestObs.tipY - 80);
        } else if (closestObs.type === 'floating_block') {
          if (closestObs.y > H * 0.45) return closestObs.y - 70;
          else return closestObs.y + closestObs.h + 70;
        } else if (closestObs.type === 'saw_blade') {
          if (closestObs.y < H * 0.50) return Math.min(H * 0.75, closestObs.y + closestObs.radius + 50);
          else return Math.max(H * 0.25, closestObs.y - closestObs.radius - 50);
        } else if (closestObs.type === 'pendulum') {
          return Math.min(H * 0.80, closestObs.anchorY + closestObs.length + 48);
        } else if (closestObs.type === 'falling_spike') {
          return Math.min(H * 0.78, closestObs.maxDepth + 45);
        } else if (closestObs.type === 'laser_gate') {
          return (closestObs.topY + closestObs.botY) / 2;
        } else if (closestObs.type === 'boost_ring') {
          return closestObs.y;
        }
      }
    }
  }
  const b = getCorridorSafeBounds(x, modSegs);
  return b.safeCenter || (H * 0.50);
}

function verifyModuleFairness(modSegs, scrollSpd) {
  if (!modSegs || modSegs.length === 0) return true;
  const startX = modSegs[0].x;
  const endX = modSegs[modSegs.length - 1].x + modSegs[modSegs.length - 1].w;
  const startBounds = getCorridorSafeBounds(startX + 10, modSegs);
  let simY = startBounds.safeCenter || (H * 0.50);
  let simVy = 0;
  let simThrust = 0;
  let simX = startX;
  const dt = 0.016;
  const maxSteps = Math.ceil((endX - startX) / (scrollSpd * dt)) + 60;
  let step = 0;

  while (simX < endX && step < maxSteps) {
    step++;
    const lookaheadX = Math.min(endX, simX + scrollSpd * 0.25);
    const targetY = getSafeTargetForAutopilot(lookaheadX, modSegs, scrollSpd);

    const simHold = (simY > targetY + 3);
    if (simHold) {
      simThrust = Math.min(1, simThrust + dt / THRUST_RISE_TIME);
    } else {
      simThrust = Math.max(0, simThrust - dt / THRUST_FALL_TIME);
    }
    const vertAccel = -LIFT_ACCEL * simThrust + GRAVITY * (1 - simThrust);
    simVy += vertAccel * dt;
    simVy *= Math.exp(-AIR_DRAG * dt);
    simVy = Math.max(-MAX_UP_SPEED, Math.min(MAX_DOWN_SPEED, simVy));
    simY += simVy * dt;
    simX += scrollSpd * dt;

    for (const s of modSegs) {
      if (simX + HITBOX_HALF_W > s.x && simX - HITBOX_HALF_W < s.x + s.w) {
        if (s.obstacles && s.obstacles.length > 0) {
          for (const obs of s.obstacles) {
            const obsW = obs.w || (obs.radius ? obs.radius * 2 : 24);
            if (simX + HITBOX_HALF_W > obs.x - obsW / 2 && simX - HITBOX_HALF_W < obs.x + obsW / 2) {
              if (obs.type === 'gate') {
                if (simY - HITBOX_TOP_OFFSET < obs.gapTop - 4 || simY + HITBOX_BOT_OFFSET > obs.gapBot + 4) return false;
              } else if (obs.type === 'stalactite') {
                if (simY - HITBOX_TOP_OFFSET < obs.tipY - 4) return false;
              } else if (obs.type === 'stalagmite') {
                if (simY + HITBOX_BOT_OFFSET > obs.tipY + 4) return false;
              } else if (obs.type === 'floating_block') {
                if (simY - HITBOX_TOP_OFFSET < obs.y + obs.h - 4 && simY + HITBOX_BOT_OFFSET > obs.y + 4) return false;
              } else if (obs.type === 'saw_blade') {
                const d2 = (simX - obs.x) ** 2 + (simY - obs.y) ** 2;
                if (d2 < (obs.radius * 0.9 + 10) ** 2) return false;
              } else if (obs.type === 'pendulum') {
                const simTime = (simX - startX) / scrollSpd;
                const pTheta = obs.maxAngle * Math.sin(simTime * 2 * Math.PI / obs.period);
                const bx = obs.anchorX + obs.length * Math.sin(pTheta);
                const by = obs.anchorY + obs.length * Math.cos(pTheta);
                const d2 = (simX - bx) ** 2 + (simY - by) ** 2;
                if (d2 < (obs.radius * 0.9 + 10) ** 2) return false;
              } else if (obs.type === 'laser_gate') {
                const simTime = (obs.x - startX) / scrollSpd;
                let t = (simTime + obs.phase) % 1.4;
                if (t >= 0.55 && t <= 1.4) {
                  // Guarantee steady speed passing window by synchronizing gate phase
                  obs.phase = (0.35 - (simTime % 1.4) + 1.4) % 1.4;
                }
              } else if (obs.type === 'falling_spike') {
                if (simY - HITBOX_TOP_OFFSET < obs.maxDepth - 8 && Math.abs(simX - obs.x) < 14) return false;
              }
            }
          }
        }
        if (!s.isOpen) {
          let curTop = s.top;
          let curBot = s.bot;
          if (s.isSlanted && s.top2 !== undefined && s.bot2 !== undefined) {
            const frac = Math.max(0, Math.min(1, (simX - s.x) / s.w));
            curTop = s.top + (s.top2 - s.top) * frac;
            curBot = s.bot + (s.bot2 - s.bot) * frac;
          }
          if (simY - HITBOX_TOP_OFFSET < curTop - 14 || simY + HITBOX_BOT_OFFSET > curBot + 14) return false;
          if (s.topSpikes && s.botSpikes) {
            for (let i = 0; i < s.topSpikes.length; i++) {
              const spX = s.x + i * 12;
              if (simX + HITBOX_HALF_W > spX && simX - HITBOX_HALF_W < spX + 12) {
                let localTop = curTop;
                let localBot = curBot;
                if (s.isSlanted && s.top2 !== undefined && s.bot2 !== undefined) {
                  const spFrac = Math.max(0, Math.min(1, (spX + 6 - s.x) / s.w));
                  localTop = curTop + (s.top2 - curTop) * spFrac;
                  localBot = curBot + (s.bot2 - curBot) * spFrac;
                }
                const topTip = (localTop - 18) + s.topSpikes[i].h;
                const botTip = (localBot + 18) - s.botSpikes[i].h;
                if (simY - HITBOX_TOP_OFFSET < topTip - 4 || simY + HITBOX_BOT_OFFSET > botTip + 4) return false;
              }
            }
          }
        }
      }
    }
  }
  return true;
}

function widenModuleGaps(modSegs, factor) {
  for (const s of modSegs) {
    if (s.obstacles && s.obstacles.length > 0) {
      for (const obs of s.obstacles) {
        if (obs.type === 'gate') {
          const c = (obs.gapTop + obs.gapBot) / 2;
          const g = (obs.gapBot - obs.gapTop) * factor;
          obs.gapTop = Math.max(20, c - g / 2);
          obs.gapBot = Math.min(H - 20, c + g / 2);
        } else if (obs.type === 'stalactite') {
          obs.tipY = Math.max(20, obs.tipY / factor);
        } else if (obs.type === 'stalagmite') {
          obs.tipY = Math.min(H - 20, H - (H - obs.tipY) / factor);
        } else if (obs.type === 'floating_block') {
          obs.h = Math.max(24, obs.h / factor);
        } else if (obs.type === 'saw_blade') {
          if (obs.y < H * 0.5) obs.y = Math.max(s.top + obs.radius, obs.y - 8);
          else obs.y = Math.min(s.bot - obs.radius, obs.y + 8);
        } else if (obs.type === 'pendulum') {
          obs.length = Math.max(45, obs.length * 0.92);
        } else if (obs.type === 'falling_spike') {
          obs.maxDepth = Math.max(s.top + 50, obs.maxDepth - 10);
        }
      }
    }
    if (!s.isOpen) {
      const c = (s.top + s.bot) / 2;
      const g = (s.bot - s.top) * factor;
      s.top = c - g / 2;
      s.bot = c + g / 2;
      s.curTop = s.top;
      s.curBot = s.bot;
      if (s.isSlanted && s.top2 !== undefined && s.bot2 !== undefined) {
        const c2 = (s.top2 + s.bot2) / 2;
        const g2 = (s.bot2 - s.top2) * factor;
        s.top2 = c2 - g2 / 2;
        s.bot2 = c2 + g2 / 2;
      }
    }
  }
}

// 1. Calm Cruise (diff 1, minStage 1)
function genCalmCruiseModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const gap = Math.max(startGap, 3.8 * CAR_HITBOX_H);
  const endC = startCenter * 0.7 + (0.50 * H) * 0.3;
  const numSegs = 2;
  const segW = Math.round(modLen / numSegs);
  const segs = [];
  let curX = startX;
  for (let i = 0; i < numSegs; i++) {
    const w = (i === numSegs - 1) ? (startX + modLen - curX) : segW;
    const c = startCenter + (endC - startCenter) * ((i + 1) / numSegs);
    const top = c - gap / 2;
    const bot = c + gap / 2;
    const { topSpikes, botSpikes } = makeSpikes(w, lvl, top, bot, true, prng);
    segs.push({ x: curX, w, top, bot, curTop: top, curBot: bot, topSpikes, botSpikes, isOpen: false, moving: false });
    curX += w;
  }
  return { segs, endCenter: endC, endGap: gap };
}

// 2. Stairs (diff 2, minStage 1)
function genStairsModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const sp = scrollSpeed();
  const gap = Math.max(3.4 * CAR_HITBOX_H, startGap);
  const segLen = Math.max(140, Math.round(1.3 * sp));
  const numSegs = Math.max(2, Math.round(modLen / segLen));
  const actualLen = Math.round(modLen / numSegs);
  const segs = [];
  let curX = startX;
  let curC = startCenter;
  let dir = (prng() < 0.5 ? 1 : -1);
  const fairStep = Math.min(0.28 * gap, 0.35 * (GRAVITY / 3.0) * actualLen / sp);

  for (let i = 0; i < numSegs; i++) {
    const w = (i === numSegs - 1) ? (startX + modLen - curX) : actualLen;
    if (curC + dir * fairStep < 0.38 * H) dir = 1;
    else if (curC + dir * fairStep > 0.62 * H) dir = -1;
    curC += dir * fairStep;
    const top = curC - gap / 2;
    const bot = curC + gap / 2;
    const { topSpikes, botSpikes } = makeSpikes(w, lvl, top, bot, false, prng);
    segs.push({ x: curX, w, top, bot, curTop: top, curBot: bot, topSpikes, botSpikes, isOpen: false, moving: false });
    curX += w;
  }
  return { segs, endCenter: curC, endGap: gap };
}

// 3. Sine Wave (diff 2, minStage 1)
function genSineWaveModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const sp = scrollSpeed();
  const gap = Math.max(3.8 * CAR_HITBOX_H, startGap);
  const periodSec = 2.4;
  const lambda = periodSec * sp;
  const amp = 24;
  const pieceLen = 32;
  const numPieces = Math.max(4, Math.round(modLen / pieceLen));
  const actualPieceLen = modLen / numPieces;
  const segs = [];
  let curX = startX;
  const baseC = 0.50 * H;

  for (let i = 0; i < numPieces; i++) {
    const w = (i === numPieces - 1) ? (startX + modLen - curX) : Math.round(actualPieceLen);
    const p1 = (i / numPieces) * (2 * Math.PI * (modLen / lambda));
    const p2 = ((i + 1) / numPieces) * (2 * Math.PI * (modLen / lambda));
    const y1 = (i === 0) ? startCenter : (baseC + amp * Math.sin(p1));
    const y2 = baseC + amp * Math.sin(p2);
    const top1 = y1 - gap / 2;
    const bot1 = y1 + gap / 2;
    const top2 = y2 - gap / 2;
    const bot2 = y2 + gap / 2;
    const slope = (y2 - y1) / w;
    const { topSpikes, botSpikes } = makeSpikes(w, lvl, top1, bot1, false, prng);
    segs.push({
      x: curX, w, top: top1, bot: bot1, curTop: top1, curBot: bot1,
      top2, bot2, isSlanted: true, slope, topSpikes, botSpikes, isOpen: false, moving: false
    });
    curX += w;
  }
  return { segs, endCenter: baseC, endGap: gap };
}

// 4. Ramps (diff 3, minStage 3)
function genRampsModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const gap = Math.max(3.5 * CAR_HITBOX_H, startGap);
  const numRamps = 2;
  const rampLen = Math.round(modLen / numRamps);
  const segs = [];
  let curX = startX;
  let curC = startCenter;
  let dir = (startCenter > 0.50 * H ? -1 : 1);
  const maxSlope = 0.16; // approx 9 degrees, well within 18 deg max

  for (let i = 0; i < numRamps; i++) {
    const w = (i === numRamps - 1) ? (startX + modLen - curX) : rampLen;
    const deltaY = dir * maxSlope * w;
    const endC = curC + deltaY;
    const slope = (endC - curC) / w;
    const top1 = curC - gap / 2;
    const bot1 = curC + gap / 2;
    const top2 = endC - gap / 2;
    const bot2 = endC + gap / 2;
    const { topSpikes, botSpikes } = makeSpikes(w, lvl, top1, bot1, false, prng);
    segs.push({
      x: curX, w, top: top1, bot: bot1, curTop: top1, curBot: bot1,
      top2, bot2, isSlanted: true, slope, topSpikes, botSpikes, isOpen: false, moving: false
    });
    curX += w;
    curC = endC;
    dir = -dir;
  }
  return { segs, endCenter: curC, endGap: gap };
}

// 5. Funnel (diff 3, minStage 2)
function genFunnelModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const minG = Math.max(3.4 * CAR_HITBOX_H, 138);
  const wideG = Math.max(minG + 36, startGap);
  const c = startCenter;
  const w1 = Math.round(modLen * 0.35);
  const w2 = Math.round(modLen * 0.30);
  const w3 = modLen - w1 - w2;
  const segs = [];

  // 1. Narrowing
  segs.push({
    x: startX, w: w1, top: c - wideG / 2, bot: c + wideG / 2, curTop: c - wideG / 2, curBot: c + wideG / 2,
    top2: c - minG / 2, bot2: c + minG / 2, isSlanted: true, slope: (minG - wideG) / (2 * w1),
    topSpikes: makeSpikes(w1, lvl, c - wideG / 2, c + wideG / 2, false, prng).topSpikes,
    botSpikes: makeSpikes(w1, lvl, c - wideG / 2, c + wideG / 2, false, prng).botSpikes,
    isOpen: false, moving: false
  });
  // 2. Neck
  segs.push({
    x: startX + w1, w: w2, top: c - minG / 2, bot: c + minG / 2, curTop: c - minG / 2, curBot: c + minG / 2,
    topSpikes: makeSpikes(w2, lvl, c - minG / 2, c + minG / 2, true, prng).topSpikes,
    botSpikes: makeSpikes(w2, lvl, c - minG / 2, c + minG / 2, true, prng).botSpikes,
    isOpen: false, moving: false
  });
  // 3. Opening
  segs.push({
    x: startX + w1 + w2, w: w3, top: c - minG / 2, bot: c + minG / 2, curTop: c - minG / 2, curBot: c + minG / 2,
    top2: c - wideG / 2, bot2: c + wideG / 2, isSlanted: true, slope: (wideG - minG) / (2 * w3),
    topSpikes: makeSpikes(w3, lvl, c - minG / 2, c + minG / 2, false, prng).topSpikes,
    botSpikes: makeSpikes(w3, lvl, c - minG / 2, c + minG / 2, false, prng).botSpikes,
    isOpen: false, moving: false
  });

  return { segs, endCenter: c, endGap: wideG };
}

// 6. Gates (diff 3, minStage 3)
function genGatesModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const sp = scrollSpeed();
  const spacing = 1.25 * sp;
  const numGates = Math.min(5, Math.max(3, Math.floor(modLen / spacing)));
  const actualSpacing = modLen / (numGates + 1);
  const gateW = 36;
  const gateGap = Math.max(4.2 * CAR_HITBOX_H, 168);
  const obstacles = [];
  const baseC = 0.50 * H;
  const offsets = [-20, 20, -16, 16, 0];

  for (let k = 0; k < numGates; k++) {
    const gx = startX + (k + 1) * actualSpacing - gateW / 2;
    const gc = baseC + offsets[k % offsets.length];
    obstacles.push({
      type: 'gate',
      x: gx,
      w: gateW,
      gapTop: gc - gateGap / 2,
      gapBot: gc + gateGap / 2
    });
  }

  const segs = [{
    x: startX, w: modLen, top: -300, bot: H + 300, curTop: -300, curBot: H + 300,
    topSpikes: [], botSpikes: [], isOpen: true, moving: false, obstacles
  }];
  return { segs, endCenter: baseC, endGap: gateGap };
}

// 7. Slalom (diff 4, minStage 4)
function genSlalomModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const sp = scrollSpeed();
  const spacing = 1.2 * sp;
  const numTeeth = Math.max(3, Math.floor(modLen / spacing));
  const actualSpacing = modLen / (numTeeth + 1);
  const toothW = 36;
  const obstacles = [];

  for (let k = 0; k < numTeeth; k++) {
    const ox = startX + (k + 1) * actualSpacing - toothW / 2;
    if (k % 2 === 0) {
      obstacles.push({
        type: 'stalactite',
        x: ox,
        w: toothW,
        tipY: 0.38 * H
      });
    } else {
      obstacles.push({
        type: 'stalagmite',
        x: ox,
        w: toothW,
        tipY: 0.62 * H
      });
    }
  }

  const segs = [{
    x: startX, w: modLen, top: -300, bot: H + 300, curTop: -300, curBot: H + 300,
    topSpikes: [], botSpikes: [], isOpen: true, moving: false, obstacles
  }];
  return { segs, endCenter: 0.50 * H, endGap: 160 };
}

// 8. Floating Spike Islands (diff 4, minStage 5)
function genFloatingIslandsModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const numBlocks = 2;
  const spacing = modLen / (numBlocks + 1);
  const obstacles = [];

  for (let k = 0; k < numBlocks; k++) {
    const bx = startX + (k + 1) * spacing - 35;
    const bw = 70;
    const bh = 44;
    const by = (k % 2 === 0) ? (0.32 * H) : (0.58 * H);
    obstacles.push({
      type: 'floating_block',
      x: bx,
      y: by,
      w: bw,
      h: bh
    });
  }

  const segs = [{
    x: startX, w: modLen, top: -300, bot: H + 300, curTop: -300, curBot: H + 300,
    topSpikes: [], botSpikes: [], isOpen: true, moving: false, obstacles
  }];
  return { segs, endCenter: 0.50 * H, endGap: 160 };
}

// 9. Wide Cavern (diff 2, minStage 1)
function genWideCavernModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const gap = 0.70 * H;
  const c = 0.49 * H;
  const top = c - gap / 2;
  const bot = c + gap / 2;
  const { topSpikes, botSpikes } = makeSpikes(modLen, lvl, top, bot, true, prng);
  const segs = [{
    x: startX, w: modLen, top, bot, curTop: top, curBot: bot,
    topSpikes, botSpikes, isOpen: false, moving: false
  }];
  return { segs, endCenter: c, endGap: gap };
}

// 10. Comb (diff 3, minStage 2)
function genCombModule(startX, modLen, startCenter, startGap, lvl, prng) {
  const gap = Math.max(3.5 * CAR_HITBOX_H, 140);
  const c = startCenter;
  const top = c - gap / 2;
  const bot = c + gap / 2;
  const numSpikes = Math.max(1, Math.floor(modLen / 12));
  const topSpikes = [];
  const botSpikes = [];
  const pattern = ['tall_short', 'wave', 'crown', 'ramp'][Math.floor(prng() * 4)];

  for (let i = 0; i < numSpikes; i++) {
    let hTop = 14;
    let hBot = 14;
    if (pattern === 'tall_short') {
      hTop = (i % 2 === 0) ? 22 : 12;
      hBot = (i % 2 === 0) ? 12 : 22;
    } else if (pattern === 'wave') {
      hTop = Math.round(14 + 6 * Math.sin(i * 0.45));
      hBot = Math.round(14 + 6 * Math.cos(i * 0.45));
    } else if (pattern === 'crown') {
      const mid = numSpikes / 2;
      const dist = Math.abs(i - mid) / mid;
      hTop = Math.round(12 + 10 * (1 - dist));
      hBot = 12;
    } else if (pattern === 'ramp') {
      hTop = Math.round(10 + 12 * (i / numSpikes));
      hBot = 12;
    }
    topSpikes.push({ h: hTop, size: (hTop > 16 ? 'medium' : 'small') });
    botSpikes.push({ h: hBot, size: (hBot > 16 ? 'medium' : 'small') });
  }

  const segs = [{
    x: startX, w: modLen, top, bot, curTop: top, curBot: bot,
    topSpikes, botSpikes, isOpen: false, moving: false
  }];
  return { segs, endCenter: c, endGap: gap };
}

const MODULE_DEFS = {
  calm_cruise:      { id: 'calm_cruise',      name: 'Calm Cruise',           diff: 1, minStage: 1, gen: genCalmCruiseModule },
  stairs:           { id: 'stairs',           name: 'Stairs',                diff: 2, minStage: 1, gen: genStairsModule },
  sine_wave:        { id: 'sine_wave',        name: 'Sine Wave',             diff: 2, minStage: 1, gen: genSineWaveModule },
  ramps:            { id: 'ramps',            name: 'Ramps',                 diff: 3, minStage: 3, gen: genRampsModule },
  funnel:           { id: 'funnel',           name: 'Funnel',                diff: 3, minStage: 2, gen: genFunnelModule },
  gates:            { id: 'gates',            name: 'Gates',                 diff: 3, minStage: 3, gen: genGatesModule },
  slalom:           { id: 'slalom',           name: 'Slalom',                diff: 4, minStage: 4, gen: genSlalomModule },
  floating_islands: { id: 'floating_islands', name: 'Floating Spike Islands',diff: 4, minStage: 5, gen: genFloatingIslandsModule },
  wide_cavern:      { id: 'wide_cavern',      name: 'Wide Cavern',           diff: 2, minStage: 1, gen: genWideCavernModule },
  comb:             { id: 'comb',             name: 'Comb',                  diff: 3, minStage: 2, gen: genCombModule }
};

function getAvailableModules(stage) {
  return Object.values(MODULE_DEFS).filter(m => stage >= m.minStage);
}

function generateLevelPlanRaw(lvl, salt = 0) {
  const stage = getStageNumber(lvl);
  const prng = mulberry32(hashInt(lvl * 99991 + salt * 17389 + 12345));
  const available = getAvailableModules(stage);
  const numModules = 8 + Math.floor(prng() * 5); // 8 to 12
  const plan = [];

  function targetDiffAt(idx, total) {
    const peakIdx = Math.round(total * 0.70);
    if (idx === 0) return 1.0;
    if (idx === total - 2) return 1.5; // reward module
    if (idx === total - 1) return 2.0; // gentle exit
    if (idx <= peakIdx) {
      const t = idx / peakIdx;
      return 1.0 + (stage >= 4 ? 3.0 : 2.0) * Math.sin(t * (Math.PI / 2));
    } else {
      const t = (idx - peakIdx) / (total - 2 - peakIdx);
      return (1.0 + (stage >= 4 ? 3.0 : 2.0)) - (stage >= 4 ? 2.5 : 1.5) * t;
    }
  }

  // 1. First module always Calm Cruise
  plan.push(MODULE_DEFS.calm_cruise);

  for (let i = 1; i < numModules; i++) {
    const prevMod = plan[i - 1];
    let pool = available.filter(m => m.id !== prevMod.id);

    // Reward slot before end
    if (i === numModules - 2) {
      const calmPool = pool.filter(m => m.id === 'calm_cruise' || m.id === 'wide_cavern');
      if (calmPool.length > 0) pool = calmPool;
    } else if (i === numModules - 1) {
      const exitPool = pool.filter(m => m.id === 'stairs' || m.id === 'sine_wave' || m.id === 'calm_cruise');
      if (exitPool.length > 0) pool = exitPool;
    }

    const targetD = targetDiffAt(i, numModules);
    const scored = pool.map(m => {
      let weight = (m.minStage === stage) ? 0.4 : 1.0;
      const diffDist = Math.abs(m.diff - targetD);
      const diffScore = Math.max(0.15, 1.0 - diffDist * 0.35);
      return { mod: m, weight: weight * diffScore };
    });

    const totalWeight = scored.reduce((sum, item) => sum + item.weight, 0);
    let r = prng() * totalWeight;
    let chosen = scored[0].mod;
    for (const item of scored) {
      r -= item.weight;
      if (r <= 0) { chosen = item.mod; break; }
    }
    plan.push(chosen);
  }

  // Variety check: Stage 1 requires all 4 modules; Stage 2+ requires >= 5 distinct modules
  if (stage === 1) {
    const required = ['calm_cruise', 'stairs', 'sine_wave', 'wide_cavern'];
    for (const req of required) {
      if (!plan.some(m => m.id === req)) {
        for (let k = 1; k < numModules - 2; k++) {
          const id = plan[k].id;
          if (plan.filter(m => m.id === id).length > 1 &&
              (k === 0 || plan[k - 1].id !== req) &&
              (k === numModules - 1 || plan[k + 1].id !== req)) {
            plan[k] = MODULE_DEFS[req];
            break;
          }
        }
      }
    }
  } else {
    let distinct = new Set(plan.map(m => m.id));
    if (distinct.size < 5) {
      for (const cand of available) {
        if (!distinct.has(cand.id)) {
          for (let k = 1; k < numModules - 2; k++) {
            if (plan.filter(m => m.id === plan[k].id).length > 1 &&
                plan[k - 1].id !== cand.id && plan[k + 1].id !== cand.id) {
              plan[k] = cand;
              distinct.add(cand.id);
              if (distinct.size >= 5) break;
            }
          }
        }
        if (distinct.size >= 5) break;
      }
    }
  }

  return plan;
}

function generateLevelPlan(lvl) {
  let plan = generateLevelPlanRaw(lvl, 0);
  if (lvl > 1) {
    const prevPlan = generateLevelPlanRaw(lvl - 1, 0);
    let diffCount = 0;
    const len = Math.max(plan.length, prevPlan.length);
    for (let i = 0; i < len; i++) {
      if (!plan[i] || !prevPlan[i] || plan[i].id !== prevPlan[i].id) {
        diffCount++;
      }
    }
    let diffRatio = diffCount / len;
    let salt = 1;
    while (diffRatio < 0.50 && salt < 10) {
      plan = generateLevelPlanRaw(lvl, salt);
      diffCount = 0;
      const l = Math.max(plan.length, prevPlan.length);
      for (let i = 0; i < l; i++) {
        if (!plan[i] || !prevPlan[i] || plan[i].id !== prevPlan[i].id) diffCount++;
      }
      diffRatio = diffCount / l;
      salt++;
    }
  }
  return plan;
}

// Stage-by-stage introduction announcements (Requirement 7)
const STAGE_NEW_HAZARDS = {
  1: null,
  2: 'New: Saw Blades & Boost Rings',
  3: 'New: Falling Spikes',
  4: 'New: Laser Gates',
  5: 'New: Swinging Pendulums',
  6: 'New: Wind Currents',
  7: 'New: Overcharged Hazards',
  8: 'New: Apex Hazard Chaos'
};

function injectStageHazards(modSegs, modDef, modIdx, numMods, stage, prng, totalTunnelLen, curX) {
  if (stage < 2) return;
  const mStart = curX - TUNNEL_START_X;
  const isFirst20Percent = (mStart < 0.20 * totalTunnelLen);
  const isFinalCalm = (modIdx >= numMods - 2);
  if (isFirst20Percent || isFinalCalm) return;

  const targetSeg = modSegs[Math.floor(modSegs.length / 2)] || modSegs[0];
  if (!targetSeg) return;
  if (!targetSeg.obstacles) targetSeg.obstacles = [];

  const isCalm = (modDef.id === 'calm_cruise' || modDef.id === 'wide_cavern');

  if (isCalm) {
    // 1. Boost Ring (from stage 2) in calm modules
    if (stage >= 2 && prng() < 0.85) {
      const ringX = targetSeg.x + targetSeg.w * 0.5;
      const ringY = (targetSeg.top + targetSeg.bot) / 2;
      targetSeg.obstacles.push({
        type: 'boost_ring',
        x: ringX,
        y: ringY,
        radius: 24,
        collected: false
      });
    }
    // 2. Air Current (from stage 6) in calm modules - gentle push, never dangerous, reward coin arc
    if (stage >= 6 && prng() < 0.70) {
      const windX = targetSeg.x + 35;
      const windW = Math.min(200, targetSeg.w - 70);
      const pushDir = (prng() < 0.5) ? -1 : 1;
      targetSeg.obstacles.push({
        type: 'air_current',
        x: windX,
        w: windW,
        yTop: targetSeg.top,
        yBot: targetSeg.bot,
        pushDir: pushDir,
        strength: 220
      });
    }
    return;
  }

  // Action modules (stairs, sine_wave, ramps, funnel, comb)
  const availableHazards = [];
  if (stage >= 2) availableHazards.push('saw_blade');
  if (stage >= 3) availableHazards.push('falling_spike');
  if (stage >= 4) availableHazards.push('laser_gate');
  if (stage >= 5) availableHazards.push('pendulum');

  if (availableHazards.length === 0) return;

  // Prioritize new hazard introduced in this stage at debut, then mixed
  let chosenType = availableHazards[0];
  if (stage === 2) {
    chosenType = 'saw_blade';
  } else if (stage === 3) {
    chosenType = (prng() < 0.60) ? 'falling_spike' : 'saw_blade';
  } else if (stage === 4) {
    chosenType = (prng() < 0.55) ? 'laser_gate' : availableHazards[Math.floor(prng() * (availableHazards.length - 1))];
  } else if (stage === 5) {
    chosenType = (prng() < 0.50) ? 'pendulum' : availableHazards[Math.floor(prng() * (availableHazards.length - 1))];
  } else {
    chosenType = availableHazards[Math.floor(prng() * availableHazards.length)];
  }

  const hx = targetSeg.x + targetSeg.w * 0.5;

  if (chosenType === 'saw_blade') {
    const radius = Math.round(CAR_HITBOX_H * (0.48 + prng() * 0.18)); // ~17 to 24px (0.45-0.7 carH)
    const onRail = (prng() < 0.5);
    let sy = (targetSeg.top + targetSeg.bot) / 2;
    if (onRail) {
      sy = (prng() < 0.5) ? (targetSeg.top + radius + 2) : (targetSeg.bot - radius - 2);
    }
    const sliding = (prng() < 0.65);
    const slideDist = sliding ? Math.min(2 * CAR_HITBOX_H, 65) : 0;
    targetSeg.obstacles.push({
      type: 'saw_blade',
      x: hx,
      y: sy,
      radius,
      slideDist,
      slidePeriod: 3.0,
      slidePhase: prng() * 3.0,
      onRail,
      dir: (prng() < 0.5 ? 1 : -1)
    });
  } else if (chosenType === 'falling_spike') {
    const startY = targetSeg.top;
    const maxDepth = Math.min(targetSeg.bot - 3.2 * CAR_HITBOX_H, startY + 120);
    targetSeg.obstacles.push({
      type: 'falling_spike',
      x: hx,
      startY,
      curY: startY,
      maxDepth,
      h: 28,
      state: 'idle',
      warnTimer: 0.7,
      velY: 0,
      shake: 0
    });
  } else if (chosenType === 'laser_gate') {
    targetSeg.obstacles.push({
      type: 'laser_gate',
      x: hx,
      topY: targetSeg.top,
      botY: targetSeg.bot,
      period: 1.4,
      onTime: 0.8,
      warnTime: 0.4,
      phase: prng() * 1.4
    });
  } else if (chosenType === 'pendulum') {
    const anchorY = targetSeg.top;
    const maxL = Math.max(50, Math.min(130, (targetSeg.bot - targetSeg.top) - 3.4 * CAR_HITBOX_H));
    targetSeg.obstacles.push({
      type: 'pendulum',
      anchorX: hx,
      anchorY,
      length: maxL,
      radius: 18,
      period: 2.2,
      maxAngle: 0.55,
      phase: prng() * 2.2
    });
  }
}

function injectStageHazardsIntoSegments(segsList, lvl, prng) {
  const stage = getStageNumber(lvl);
  if (stage < 2) return;
  const tunnelSegs = [];
  for (let i = 0; i < segsList.length; i++) {
    const s = segsList[i];
    if (!s.isOpen && s.x >= TUNNEL_START_X && s.x + s.w <= TUNNEL_END_X) {
      tunnelSegs.push(s);
    }
  }
  if (tunnelSegs.length < 5) return;
  const valid = tunnelSegs.slice(3, tunnelSegs.length - 2);
  if (valid.length === 0) return;

  const count = (stage === 2) ? 2 : (stage <= 4 ? 3 : 4);
  const step = Math.max(1, Math.floor(valid.length / (count + 1)));

  for (let k = 0; k < count; k++) {
    const idx = Math.min(valid.length - 1, (k + 1) * step + (k % 2 === 0 ? 0 : -1));
    const targetSeg = valid[idx];
    if (!targetSeg || (targetSeg.obstacles && targetSeg.obstacles.length > 0)) continue;
    if (!targetSeg.obstacles) targetSeg.obstacles = [];

    const available = [];
    if (stage >= 2) available.push('saw_blade', 'boost_ring');
    if (stage >= 3) available.push('falling_spike');
    if (stage >= 4) available.push('laser_gate');
    if (stage >= 5) available.push('pendulum');
    if (stage >= 6) available.push('air_current');

    let chosenType = available[Math.floor(prng() * available.length)];
    if (k === 0) {
      if (stage === 2) chosenType = 'saw_blade';
      else if (stage === 3) chosenType = 'falling_spike';
      else if (stage === 4) chosenType = 'laser_gate';
      else if (stage === 5) chosenType = 'pendulum';
      else if (stage === 6) chosenType = 'air_current';
    }

    const hx = targetSeg.x + targetSeg.w * 0.5;
    if (chosenType === 'boost_ring') {
      const ringY = (targetSeg.top + targetSeg.bot) / 2;
      targetSeg.obstacles.push({
        type: 'boost_ring',
        x: hx,
        y: ringY,
        radius: 24,
        collected: false
      });
    } else if (chosenType === 'saw_blade') {
      const radius = Math.round(CAR_HITBOX_H * (0.45 + prng() * 0.15));
      const onRail = (prng() < 0.5);
      let sy = (targetSeg.top + targetSeg.bot) / 2;
      if (onRail) {
        sy = (prng() < 0.5) ? (targetSeg.top + radius + 4) : (targetSeg.bot - radius - 4);
      }
      const sliding = (prng() < 0.65);
      const slideDist = sliding ? Math.min(1.8 * CAR_HITBOX_H, 45) : 0;
      targetSeg.obstacles.push({
        type: 'saw_blade',
        x: hx,
        y: sy,
        radius,
        slideDist,
        slidePeriod: 3.0,
        slidePhase: prng() * 3.0,
        onRail,
        dir: (prng() < 0.5 ? 1 : -1)
      });
    } else if (chosenType === 'falling_spike') {
      const startY = targetSeg.top;
      const maxDepth = Math.min(targetSeg.bot - 3.0 * CAR_HITBOX_H, startY + 80);
      targetSeg.obstacles.push({
        type: 'falling_spike',
        x: hx,
        startY,
        curY: startY,
        maxDepth,
        h: 28,
        state: 'idle',
        warnTimer: 0.7,
        velY: 0,
        shake: 0
      });
    } else if (chosenType === 'laser_gate') {
      targetSeg.obstacles.push({
        type: 'laser_gate',
        x: hx,
        topY: targetSeg.top,
        botY: targetSeg.bot,
        period: 1.4,
        onTime: 0.8,
        warnTime: 0.4,
        phase: prng() * 1.4
      });
    } else if (chosenType === 'pendulum') {
      const anchorY = targetSeg.top;
      const maxL = Math.max(35, Math.min(100, (targetSeg.bot - targetSeg.top) - 3.0 * CAR_HITBOX_H));
      targetSeg.obstacles.push({
        type: 'pendulum',
        anchorX: hx,
        anchorY,
        length: maxL,
        radius: 18,
        period: 2.2,
        maxAngle: 0.50,
        phase: prng() * 2.2
      });
    } else if (chosenType === 'air_current') {
      const windX = targetSeg.x + 20;
      const windW = Math.min(160, targetSeg.w - 40);
      const pushDir = (prng() < 0.5) ? -1 : 1;
      targetSeg.obstacles.push({
        type: 'air_current',
        x: windX,
        w: windW,
        yTop: targetSeg.top,
        yBot: targetSeg.bot,
        pushDir: pushDir,
        strength: 180
      });
    }
  }
}

function buildLevelFromPlan(lvl, plan) {
  const prng = mulberry32(hashInt(lvl * 55555 + 12345));
  const totalTunnelLen = TUNNEL_LENGTH;
  const numMods = plan.length;
  const baseDurations = {
    calm_cruise: 4.5,
    stairs: 5.0,
    sine_wave: 5.5,
    ramps: 5.0,
    funnel: 4.5,
    gates: 5.5,
    slalom: 5.5,
    floating_islands: 5.0,
    wide_cavern: 5.0,
    comb: 4.5
  };

  const rawLens = plan.map(m => (baseDurations[m.id] || 5.0) * scrollSpeed());
  const rawSum = rawLens.reduce((a, b) => a + b, 0);
  const scale = totalTunnelLen / rawSum;

  const modLens = rawLens.map(l => Math.round(l * scale));
  let allocatedSum = modLens.reduce((a, b) => a + b, 0);
  modLens[modLens.length - 1] += (totalTunnelLen - allocatedSum);

  const tunnelSegs = [];
  let curX = TUNNEL_START_X;
  let curCenter = 0.50 * H;
  let curGap = getGapHeight(lvl, 0);

  for (let i = 0; i < numMods; i++) {
    const modDef = plan[i];
    const mLen = modLens[i];
    let res = modDef.gen(curX, mLen, curCenter, curGap, lvl, prng);
    injectStageHazards(res.segs, modDef, i, numMods, getStageNumber(lvl), prng, totalTunnelLen, curX);

    let fair = verifyModuleFairness(res.segs, scrollSpeed());
    let retries = 0;
    while (!fair && retries < 5) {
      widenModuleGaps(res.segs, 1.10);
      fair = verifyModuleFairness(res.segs, scrollSpeed());
      retries++;
    }
    if (!fair) {
      res = genCalmCruiseModule(curX, mLen, curCenter, curGap, lvl, prng);
    }

    for (const s of res.segs) {
      tunnelSegs.push(s);
    }
    curX += mLen;
    curCenter = res.endCenter;
    curGap = res.endGap;
  }

  return tunnelSegs;
}

function startLevel(lvl) {
  curLevel = lvl;

  const newStage = getStageNumber(lvl);
  if (newStage !== currentBgStage) {
    prevBgStage = currentBgStage;
    currentBgStage = newStage;
    bgCrossFadeTimer = 0.6;
  }
  updateSpeedPhysics();

  cam = 0;
  vy = 0;
  thrust = 0;
  cy = CAR_REST_Y;
  lastC = ROAD_TOP - 20;

  const twists = ['tight_corridor', 'quick_stairs', 'smooth_corridor'];
  levelSeedTwist = twists[Math.floor(levelPRNG() * twists.length)];
  gameTime = 0;

  const initW = TUNNEL_START_X - START_ROAD_START;
  const { topSpikes, botSpikes } = makeSpikes(initW, curLevel, -300, H + 300, true, levelPRNG);

  nextX = TUNNEL_START_X;

  tunnelSegCount = 0;
  while (nextX < TUNNEL_END_X) {
    addSeg(false);
  }

  // Requirement 4: Sanitize all neighboring segment pairs
  sanitizeLevelSegments(segs);

  // Inject stage hazards
  injectStageHazardsIntoSegments(segs, curLevel, levelPRNG);

  // Generate collectible coins and rare blue gem for the level
  generateLevelCoins(lvl, segs);

  const postW = (FINISH_ROAD_END + 500) - TUNNEL_END_X;
