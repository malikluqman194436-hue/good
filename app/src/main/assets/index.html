function getLevelInStage(level) {
  return ((level - 1) % LEVELS_PER_STAGE) + 1;

function getStage(level) {
  const stageNum = getStageNumber(level);
  const idx = (stageNum - 1) % STAGES.length;
  return STAGES[idx];
}

  const stage = getStage(level);
  if (stage && stage.backgroundPicture && stage.backgroundPicture.trim().length > 0) {

    return `STAGE ${stageNum} - ${stage.name.toUpperCase()}`;

  return `LEVEL ${level}`;
}

// Deterministic PRNG
function hashInt(n) {
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = ((n >> 16) ^ n) * 0x45d9f3b;
  n = (n >> 16) ^ n;
  return n >>> 0;
}

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function loadImageWithTimeout(url, timeoutMs = 4500) {
  return new Promise((resolve, reject) => {
    try {
      const img = new Image();
      let settled = false;

      const timer = setTimeout(() => {
        if (!settled) {
          settled = true;
          reject(new Error(`Timeout loading ${url}`));
        }
      }, timeoutMs);

      img.onload = () => {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          resolve(img);
        }
      };

      img.onerror = (err) => {
        if (!settled) {
          settled = true;
          clearTimeout(timer);
          reject(err || new Error(`Failed to load ${url}`));
        }
      };

      img.src = url;

      if (img.complete && img.naturalWidth > 0 && !settled) {
        settled = true;
        clearTimeout(timer);
        resolve(img);
      }
    } catch (err) {
      reject(err);
    }
  });
}

function processCarImage(img) {
  try {
    const origW = img.naturalWidth || img.width;
    const origH = img.naturalHeight || img.height;

    const offCanv = document.createElement('canvas');
    offCanv.width = origW;
    offCanv.height = origH;
    const offCtx = offCanv.getContext('2d');
    offCtx.drawImage(img, 0, 0);

    const imgData = offCtx.getImageData(0, 0, origW, origH);
    const d = imgData.data;

    // Green Chroma Key with smooth edge blending & despill:
    // Do not remove any yellow pixels of the car body.
    // Only remove pixels where green is clearly higher than both red and blue.
    const threshLow = 30;
    const threshHigh = 65;

    for (let i = 0; i < d.length; i += 4) {
      const r = d[i];
      const g = d[i + 1];
      const b = d[i + 2];
      const maxRB = Math.max(r, b);
      const diff = g - maxRB;

      if (diff >= threshHigh) {
        // Pure green background -> fully transparent
        d[i + 3] = 0;
      } else if (diff > threshLow) {
        // Soft edge blending
        const factor = (diff - threshLow) / (threshHigh - threshLow);
        d[i + 3] = Math.round(255 * (1 - factor));
        // Despill green fringe at boundary
        d[i + 1] = maxRB;
      } else {
        // Never remove or alter yellow body pixels (where r is high).
        // Only despill dark/neutral edges if green is slightly above red & blue:
        if (diff > 12 && r < 120) {
          d[i + 1] = maxRB;
        }
      }
    }

    offCtx.putImageData(imgData, 0, 0);

    // Auto-trim empty transparent space so tires sit at exact bottom edge
    let minX = origW, maxX = 0, minY = origH, maxY = 0;
    for (let y = 0; y < origH; y++) {
      for (let x = 0; x < origW; x++) {
        const a = d[(y * origW + x) * 4 + 3];
        if (a > 20) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    if (minX <= maxX && minY <= maxY) {
      const trimW = maxX - minX + 1;
      const trimH = maxY - minY + 1;

      const tCanv = document.createElement('canvas');
      tCanv.width = trimW;
      tCanv.height = trimH;
      const tCtx = tCanv.getContext('2d');
      tCtx.drawImage(offCanv, minX, minY, trimW, trimH, 0, 0, trimW, trimH);

      trimmedCarCanvas = tCanv;

    console.warn('Failed to process car image:', err);
    if (!loadingErrorMsg) loadingErrorMsg = 'ChromaKey: ' + (err.message || String(err));
  }
}

  if (!c) return null;

  const cx = size / 2;
  const cy = size / 2;
  const R = size * 0.48;

  c.clearRect(0, 0, size, size);

  c.save();
  c.beginPath();
  c.arc(cx, cy, R, 0, Math.PI * 2);
  c.clip();

  // Dark Wheel Barrel
  c.fillStyle = cfg.barrel;
  c.fillRect(0, 0, size, size);

  // Vented Brake Rotor background disc
  const rotorR = R * 0.88;
  const rotorGrad = c.createRadialGradient(cx, cy, R * 0.15, cx, cy, rotorR);
  rotorGrad.addColorStop(0, '#2b3442');
  rotorGrad.addColorStop(0.7, '#1f2733');
  rotorGrad.addColorStop(1, '#151b24');
  c.fillStyle = rotorGrad;
  c.beginPath();
  c.arc(cx, cy, rotorR, 0, Math.PI * 2);
  c.fill();

  // Rotor surface concentric machining grooves
  c.strokeStyle = 'rgba(255, 255, 255, 0.06)';
  c.lineWidth = 1.2;
  for (let rG = R * 0.35; rG <= rotorR - 4; rG += 7) {
    c.beginPath();
    c.arc(cx, cy, rG, 0, Math.PI * 2);
    c.stroke();
  }

  // Cross-drilled rotor holes (sporty brake vent holes)
  c.fillStyle = '#0b0f17';
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
    for (let rD = R * 0.42; rD <= rotorR - 8; rD += 12) {
      const hx = cx + Math.cos(a + rD * 0.015) * rD;
      const hy = cy + Math.sin(a + rD * 0.015) * rD;
      c.beginPath();
      c.arc(hx, hy, 1.8, 0, Math.PI * 2);
      c.fill();
    }
  }

  // 5-Spoke Twin-Beam High Performance Forged Alloy
  const spokes = 5;
  const spokeStep = (Math.PI * 2) / spokes;
  const hubR = R * 0.28;
  const rimInnerR = R * 0.86;

  for (let i = 0; i < spokes; i++) {
    const angle = i * spokeStep;

    c.save();
    c.translate(cx, cy);
    c.rotate(angle);

    // Drop shadow under each spoke onto rotor
    c.fillStyle = 'rgba(0, 0, 0, 0.45)';
    c.beginPath();
    c.moveTo(-R * 0.14, hubR * 0.8 + 2);
    c.lineTo(-R * 0.18, rimInnerR + 2);
    c.lineTo(R * 0.18, rimInnerR + 2);
    c.lineTo(R * 0.14, hubR * 0.8 + 2);
    c.closePath();
    c.fill();

    // Twin-Spoke Left Beam
    c.fillStyle = cfg.spokeDark;
    c.beginPath();
    c.moveTo(-R * 0.15, hubR);
    c.lineTo(-R * 0.20, rimInnerR);
    c.lineTo(-R * 0.12, rimInnerR);
    c.lineTo(-R * 0.07, hubR);
    c.closePath();
    c.fill();

    c.fillStyle = cfg.spokeFace;
    c.beginPath();
    c.moveTo(-R * 0.13, hubR + 1);
    c.lineTo(-R * 0.18, rimInnerR - 1);
    c.lineTo(-R * 0.11, rimInnerR - 1);
    c.lineTo(-R * 0.06, hubR + 1);
    c.closePath();
    c.fill();

    c.strokeStyle = cfg.spokeLight;
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(-R * 0.18, rimInnerR - 1);
    c.lineTo(-R * 0.13, hubR + 1);
    c.stroke();

    // Twin-Spoke Right Beam
    c.fillStyle = cfg.spokeDark;
    c.beginPath();
    c.moveTo(R * 0.07, hubR);
    c.lineTo(R * 0.12, rimInnerR);
    c.lineTo(R * 0.20, rimInnerR);
    c.lineTo(R * 0.15, hubR);
    c.closePath();
    c.fill();

    c.fillStyle = cfg.spokeFace;
    c.beginPath();
    c.moveTo(R * 0.06, hubR + 1);
    c.lineTo(R * 0.11, rimInnerR - 1);
    c.lineTo(R * 0.18, rimInnerR - 1);
    c.lineTo(R * 0.13, hubR + 1);
    c.closePath();
    c.fill();

    c.strokeStyle = cfg.spokeLight;
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(R * 0.11, rimInnerR - 1);
    c.lineTo(R * 0.06, hubR + 1);
    c.stroke();

    // Spoke-to-rim mounting joint
    c.fillStyle = cfg.spokeFace;
    c.beginPath();
    c.arc(0, rimInnerR, R * 0.18, Math.PI * 0.85, Math.PI * 0.15, true);
    c.fill();

    c.restore();
  }

  // Polished Chrome Outer Lip & Rim Flange
  c.strokeStyle = 'rgba(0, 0, 0, 0.4)';
  c.lineWidth = 3;
  c.beginPath();
  c.arc(cx, cy, rimInnerR, 0, Math.PI * 2);
  c.stroke();

  const lipGrad = c.createLinearGradient(0, cy - R, size, cy + R);
  lipGrad.addColorStop(0.0, cfg.lipOuter);
  lipGrad.addColorStop(0.25, cfg.lipInner);
  lipGrad.addColorStop(0.5, cfg.lipOuter);
  lipGrad.addColorStop(0.75, cfg.lipInner);
  lipGrad.addColorStop(1.0, cfg.lipOuter);

  c.strokeStyle = lipGrad;
  c.lineWidth = R * 0.11;
  c.beginPath();
  c.arc(cx, cy, R * 0.94, 0, Math.PI * 2);
  c.stroke();

  c.strokeStyle = cfg.spokeLight;
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(cx, cy, R - 1, 0, Math.PI * 2);
  c.stroke();

  c.strokeStyle = cfg.spokeDark;
  c.lineWidth = 1.5;
  c.beginPath();
  c.arc(cx, cy, R * 0.88, 0, Math.PI * 2);
  c.stroke();

  // Center Hub Plate & Chrome Lug Nuts
  const hubGrad = c.createRadialGradient(cx, cy, 2, cx, cy, hubR);
  hubGrad.addColorStop(0, cfg.spokeFace);
  hubGrad.addColorStop(0.6, cfg.spokeDark);
  hubGrad.addColorStop(1, '#0f172a');
  c.fillStyle = hubGrad;
  c.beginPath();
  c.arc(cx, cy, hubR, 0, Math.PI * 2);
  c.fill();

  c.strokeStyle = cfg.hubRing;
  c.lineWidth = 2.2;
  c.beginPath();
  c.arc(cx, cy, hubR, 0, Math.PI * 2);
  c.stroke();

  // 5 Chrome Lug Nuts arranged in star pattern
  const nutR = hubR * 0.65;
  for (let i = 0; i < spokes; i++) {
    const nAngle = i * spokeStep + (spokeStep / 2);
    const nx = cx + Math.cos(nAngle) * nutR;
    const ny = cy + Math.sin(nAngle) * nutR;

    c.fillStyle = '#05070a';
    c.beginPath();
    c.arc(nx + 0.8, ny + 0.8, 4.2, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = cfg.nutColor;
    c.beginPath();
    c.arc(nx, ny, 3.8, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = '#0f172a';
    c.beginPath();
    c.arc(nx, ny, 1.6, 0, Math.PI * 2);
    c.fill();
  }

  // Center Emblem Cap
  const capR = hubR * 0.44;
  c.fillStyle = cfg.hubCenter;
  c.beginPath();
  c.arc(cx, cy, capR, 0, Math.PI * 2);
  c.fill();

  c.strokeStyle = cfg.spokeLight;
  c.lineWidth = 1.8;
  c.beginPath();
  c.arc(cx, cy, capR, 0, Math.PI * 2);
  c.stroke();

  c.fillStyle = cfg.hubAccent;
  c.beginPath();
  c.arc(cx, cy, capR * 0.45, 0, Math.PI * 2);
  c.fill();

  c.restore();
  return canv;
}

function buildWheelSprites() {
  try {
    const sprite = createCustomAlloyRim(256, currentRimStyle);
    if (sprite) {
      rearWheelSprite = sprite;
      frontWheelSprite = sprite;
      wheelSpritesReady = true;
    }
  } catch (err) {
    console.warn('Failed to build alloy wheel sprite:', err);
    rearWheelSprite = null;
    frontWheelSprite = null;
    wheelSpritesReady = false;
  }
}

function setAlloyRimStyle(newStyle) {
  if (RIM_STYLE_CONFIGS[newStyle]) {
    currentRimStyle = newStyle;
    try { localStorage.setItem('skycarRimStyle', newStyle); } catch(e) {}
    buildWheelSprites();
  }
}

function cycleAlloyRimStyle() {
  const styles = ['silver_sport', 'racing_gold', 'stealth_black'];
  const nextIdx = (styles.indexOf(currentRimStyle) + 1) % styles.length;
  const newStyle = styles[nextIdx];
  setAlloyRimStyle(newStyle);
  playClickSound();
  triggerVibrate(30);
  const cfg = RIM_STYLE_CONFIGS[newStyle];
  showToast('Alloy Rim: ' + cfg.name);
}

function initAssetPreloading() {
  try {
    // 1. Preload Level Pictures concurrently
    LEVEL_PICTURE_URLS.forEach((url, idx) => {
      const item = {
        index: idx + 1,
        url,
        img: null,
        loaded: false,
        failed: false,
        seamlessCanvas: null,
        unitW: 0
      };
      preloadedPictures.push(item);

      loadImageWithTimeout(url)
        .then((img) => {
          try {
            item.img = img;
            item.loaded = true;
            updatePictureSeamlessCanvas(item);
          } catch (e) {
            console.warn('Error creating seamless canvas:', e);
            if (!loadingErrorMsg) loadingErrorMsg = 'BG: ' + (e.message || String(e));
          }
        })
        .catch((err) => {
          console.warn('Level image load failed:', err);
          item.failed = true;
          if (!loadingErrorMsg) loadingErrorMsg = 'BG failed: ' + (err.message || String(err));
        })
        .finally(() => {
          markAssetFinished();
        });
    });

    // 2. Preload and process Car Image concurrently
    loadImageWithTimeout(CAR_IMAGE_URL)
      .then((img) => {
        try {
          processCarImage(img);
          carImgLoaded = true;
        } catch (e) {
          console.warn('processCarImage error:', e);
          if (!loadingErrorMsg) loadingErrorMsg = 'Car: ' + (e.message || String(e));
          carImgFailed = true;
        }
      })
      .catch((err) => {
        console.warn('Car image load failed:', err);
        carImgFailed = true;
        if (!loadingErrorMsg) loadingErrorMsg = 'Car load failed: ' + (err.message || String(err));
      })
      .finally(() => {
        markAssetFinished();
      });

  } catch (err) {
    console.error('initAssetPreloading error:', err);
    loadingErrorMsg = 'Preload: ' + (err.message || String(err));
    assetsFinished = true;
  }
}

initAssetPreloading();

function updatePictureSeamlessCanvas(item) {
  if (!item.img || item.img.naturalWidth === 0) return;
  const aspect = item.img.naturalWidth / item.img.naturalHeight;
  const scaledW = Math.round(aspect * H);
  item.unitW = scaledW * 2;

  const sCanv = document.createElement('canvas');
  sCanv.width = item.unitW;
  sCanv.height = H;
  const sCtx = sCanv.getContext('2d');

  sCtx.drawImage(item.img, 0, 0, scaledW, H);
  sCtx.save();
  sCtx.translate(item.unitW, 0);
  sCtx.scale(-1, 1);
  sCtx.drawImage(item.img, 0, 0, scaledW, H);
  sCtx.restore();

  item.seamlessCanvas = sCanv;
}

function getLevelPicture(lvl) {
  if (!preloadedPictures.length) return null;
  const idx = (lvl - 1) % preloadedPictures.length;
  const item = preloadedPictures[idx];
  if (item && item.loaded && !item.failed && item.seamlessCanvas) {
    return item;
  }
  return null;
}

let audioCtx = null;
let masterGain = null;
let soundEnabled = true;
let vibrateEnabled = true;

try {
  soundEnabled = localStorage.getItem('skycarSound') !== 'false';
  vibrateEnabled = localStorage.getItem('skycarVibrate') !== 'false';
} catch(e) {}

function initAudio() {
  if (audioCtx) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    audioCtx = new AudioContext();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = soundEnabled ? 0.35 : 0;
    masterGain.connect(audioCtx.destination);
    decodeGasPuffAudio();
  } catch(e) {}
}

function ensureAudioContext() {
  try {
    if (!audioCtx) {
      initAudio();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    if (audioCtx && !gasPuffAudioBuffer && !isPuffDecoding) {
      decodeGasPuffAudio();
    }
    if (audioCtx && !flyAudioBuffer && !isFlyAudioDecoding) {
      decodeFlyAudio();
    }
    if (audioCtx && !windSource) {
      initWindSound();
    }
  } catch(e) {}
}

let flyAudioBuffer = null;

function decodeFlyAudio() {
  if (flyAudioBuffer || isFlyAudioDecoding) return;
  if (!audioCtx) return;
  isFlyAudioDecoding = true;
  try {
    const base64Str = FLY_SOUND_BASE64.split(',')[1];
    const binary = atob(base64Str);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const onSuccess = (buf) => {
      flyAudioBuffer = buf;
      isFlyAudioDecoding = false;
    };
    const onError = (err) => {
      console.warn('fly sound decode failed:', err);
      isFlyAudioDecoding = false;
    };
    const res = audioCtx.decodeAudioData(bytes.buffer.slice(0), onSuccess, onError);
    if (res && typeof res.then === 'function') {
      res.then(onSuccess).catch(onError);
    }
  } catch (e) {
    isFlyAudioDecoding = false;
  }
}

    if (!isFlyAudioDecoding) decodeFlyAudio();
    return;
  }
  if (isFlySoundPlaying) return;
  try {
    flySoundSource = audioCtx.createBufferSource();
    flySoundSource.buffer = flyAudioBuffer;
    flySoundSource.loop = true;
    flySoundGain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    flySoundGain.gain.setValueAtTime(0.01, now);
    flySoundGain.gain.linearRampToValueAtTime(0.40, now + 0.05);
    flySoundSource.connect(flySoundGain);
    flySoundGain.connect(masterGain || audioCtx.destination);
    flySoundSource.start(now);
    isFlySoundPlaying = true;
  } catch (e) {
    isFlySoundPlaying = false;
  }
}

function stopFlySound() {
  if (!isFlySoundPlaying) return;
  try {
    if (flySoundGain && audioCtx) {
      const now = audioCtx.currentTime;
      flySoundGain.gain.cancelScheduledValues(now);
      flySoundGain.gain.setValueAtTime(flySoundGain.gain.value, now);
      flySoundGain.gain.linearRampToValueAtTime(0.001, now + 0.05);
      setTimeout(() => {
        try {
          if (flySoundSource) {
            flySoundSource.stop();
            flySoundSource.disconnect();
          }
        } catch (e) {}
        flySoundSource = null;
        flySoundGain = null;
      }, 60);
    } else {
      if (flySoundSource) {
        flySoundSource.stop();
        flySoundSource.disconnect();
      }
      flySoundSource = null;
      flySoundGain = null;
    }
  } catch (e) {
    flySoundSource = null;
    flySoundGain = null;
  }
  isFlySoundPlaying = false;
}

function decodeGasPuffAudio() {
  if (gasPuffAudioBuffer || isPuffDecoding) return;
  if (!audioCtx) return;
  try {
    isPuffDecoding = true;
    const base64Str = GAS_PUFF_BASE64.split(',')[1];
    const binary = atob(base64Str);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const onSuccess = (buf) => {
      gasPuffAudioBuffer = buf;
      isPuffDecoding = false;
    };
    const onError = (err) => {
      console.warn('gas_puff decode failed, fallback will be used', err);
      gasPuffAudioBuffer = null;
      isPuffDecoding = false;
    };
    const res = audioCtx.decodeAudioData(bytes.buffer.slice(0), onSuccess, onError);
    if (res && typeof res.then === 'function') {
      res.then(onSuccess).catch(onError);
    }
  } catch (err) {
    gasPuffAudioBuffer = null;
    isPuffDecoding = false;
  }
}

function playSynthesizedPuff(targetVol, targetRate) {
  if (!audioCtx) return;
  try {
    const sampleRate = audioCtx.sampleRate || 44100;
    const dur = 0.18;
    const frameCount = Math.floor(sampleRate * dur);
    const noiseBuffer = audioCtx.createBuffer(1, frameCount, sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < frameCount; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    src.playbackRate.value = targetRate || 1.0;

    // High-pass filter at 2500 Hz
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2500;

    // Band-pass filter at 5000 Hz (Q 0.7)
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 5000;
    bp.Q.value = 0.7;

    // Volume envelope: rises to 0.8 in 30 ms, falls to 0.45 by 120 ms, cuts to 0 at 180 ms
    const scale = (targetVol !== undefined) ? (targetVol / 0.8) : 1.0;
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.8 * scale, now + 0.030);
    g.gain.linearRampToValueAtTime(0.45 * scale, now + 0.120);
    g.gain.linearRampToValueAtTime(0.0001, now + 0.180);

    src.connect(hp);
    hp.connect(bp);
    bp.connect(g);
    g.connect(masterGain || audioCtx.destination);

    src.start(now);
    src.stop(now + 0.180);
  } catch (err) {
    console.warn('Fallback synthesized puff error:', err);
  }
}

function playSinglePuff(isInitial = false) {
  if (!soundEnabled) return;
  ensureAudioContext();
  if (!audioCtx) return;

  const rate = 0.92 + Math.random() * (1.08 - 0.92);
  const vol = isInitial ? SFX_VOLUME : (SFX_VOLUME * (0.7 + Math.random() * 0.3));

  if (gasPuffAudioBuffer) {
    try {
      const src = audioCtx.createBufferSource();
      src.buffer = gasPuffAudioBuffer;
      src.playbackRate.value = rate;

      const g = audioCtx.createGain();
      g.gain.value = vol;

      src.connect(g);
      g.connect(masterGain || audioCtx.destination);

      src.start();
    } catch (err) {
      playSynthesizedPuff(vol, rate);
    }
  } else {
    playSynthesizedPuff(vol, rate);
  }
}

function updateThrustAudio(dt) {
  const isThrustActive = (st === 'play' && hold && finishRunStage === 'none' && !stopping && !settingsOpen);

  if (!soundEnabled || !isThrustActive) {
    wasThrustActive = false;
    puffHoldTimer = 0;
    return;
  }

  // Pressed: every time the thrust button is pressed, play immediately
  if (!wasThrustActive) {
    wasThrustActive = true;
    puffHoldTimer = 0;
    playSinglePuff(true);
    return;
  }

  // While held: play a new puff every PUFF_INTERVAL = 0.2s
  puffHoldTimer += dt;
  if (puffHoldTimer >= PUFF_INTERVAL) {
    puffHoldTimer -= PUFF_INTERVAL;
    playSinglePuff(false);
  }
}

// ==========================================
// PROCEDURAL LEVEL CONFIG & FALLBACK SCENES
// ==========================================
const SHAPE_TYPES = [
  'cone', 'needle', 'fat stud', 'double-cone', 'faceted crystal',
  'curved thorn', 'fork', 'saw tooth', 'bullet', 'flame-shaped'
];
const RAIL_STYLES = ['rivets', 'bolts', 'small gears', 'chain links', 'dots'];

function getSceneType(level) {
  return (getStageNumber(level) - 1) % STAGES.length;
}

function generateLevelConfig(level, prev) {
  const sceneId = getSceneType(level);
  const stage = getStage(level);
  const seed = hashInt(level * 10007 + 773);
  const rng = mulberry32(seed);
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const range = (a, b) => a + rng() * (b - a);

  let H = Math.round((level * 137.508) % 360);
  const name = stage.name;

  let bgTop, bgBot, cloudColor;
  switch (sceneId) {
    case 0:
      bgTop = '#48cae4'; bgBot = '#caf0f8'; cloudColor = '#ffffff'; H = 195;
      break;
    case 1:
      bgTop = '#00b4d8'; bgBot = '#ffd166'; cloudColor = '#ffffff'; H = 45;
      break;
    case 2:
      bgTop = '#ff70a6'; bgBot = '#ffd670'; cloudColor = '#fff0f5'; H = 330;
      break;
    case 3:
      bgTop = '#7097c2'; bgBot = '#dceaf7'; cloudColor = '#ffffff'; H = 210;
      break;
    case 4:
      bgTop = '#f77f00'; bgBot = '#fcbf49'; cloudColor = '#fff5eb'; H = 35;
      break;
    case 5:
      bgTop = '#2ec4b6'; bgBot = '#cbf3f0'; cloudColor = '#f0fff4'; H = 150;
      break;
    case 6:
      bgTop = '#240046'; bgBot = '#7b2cbf'; cloudColor = '#ff9e00'; H = 275;
      break;
    case 7:
      bgTop = '#023e8a'; bgBot = '#0096c7'; cloudColor = '#90e0ef'; H = 190;
      break;
  }

  if (level > 8) {
    const shift = Math.floor(rng() * 40) - 20;
    H = (H + shift + 360) % 360;
  }

  const shapeType = pick(SHAPE_TYPES);
  const width = Math.round(range(10, 15));
  const heightRatio = +(range(1.6, 2.8)).toFixed(2);
  const tipSharpness = pick(['sharp', 'medium', 'rounded']);
  const collarRing = rng() > 0.35;
  const bend = +(range(-0.3, 0.3)).toFixed(2);
  const railStyle = pick(RAIL_STYLES);

  const spikeSat = Math.round(range(75, 95));
  const spikeLit = Math.round(range(44, 56));
  const spikeColor = { h: H, s: spikeSat, l: spikeLit };
  const railColor = `hsl(${H}, 35%, 52%)`;

  return {
    level,
    sceneId,
    name,
    H,
    bgTop,
    bgBot,
    cloudColor,
    spikeColor,
    shapeType,
    width,
    heightRatio,
    tipSharpness,
    collarRing,
    bend,
    railStyle,
    railColor,
    accentColor: `hsl(${H}, 90%, 50%)`,
    glowColor: `hsl(${H}, 95%, 60%)`
  };
}

const levelConfigCache = new Map();
function getLevelConfig(level) {
  if (levelConfigCache.has(level)) return levelConfigCache.get(level);
  const prev = level > 1 ? getLevelConfig(level - 1) : null;
  const cfg = generateLevelConfig(level, prev);
  levelConfigCache.set(level, cfg);
  return cfg;
}

function hasRealScenePicture(level, cfg) {
  return level === 1;
}

function getLevelDisplayText(level, cfg) {
  return getLevelTitleCardText(level);
}

let curConfig = getLevelConfig(1);
let spikeCanvases = {};
let fallbackBgCanvas = null;
let fallbackParallaxCanvases = [];

function roundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function renderSpikeToCanvas(canvas, isTop, h, cfg) {
  const sCtx = canvas.getContext('2d');
  sCtx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = 18;
  const baseY = isTop ? 2 : 46;
  const dir = isTop ? 1 : -1;
  const tipY = baseY + dir * h;
  const w = Math.min(16, Math.max(9, cfg.width));
  const bendOffset = (cfg.bend || 0) * (h * 0.22);
  const tipX = cx + bendOffset;

  const H = cfg.spikeColor.h, S = cfg.spikeColor.s, L = cfg.spikeColor.l;
  const colBase = `hsl(${H}, ${S}%, ${L}%)`;
  const colLight = `hsl(${H}, ${Math.max(10, S - 15)}%, ${Math.min(95, L + 28)}%)`;
  const colDark = `hsl(${H}, ${Math.min(100, S + 10)}%, ${Math.max(14, L - 22)}%)`;
  const outlineColor = '#181e28';

  sCtx.save();

  // 3D Facets
  sCtx.fillStyle = colLight;
  sCtx.beginPath();
  sCtx.moveTo(cx - w / 2, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx, baseY);
  sCtx.closePath();
  sCtx.fill();

  sCtx.fillStyle = colDark;
  sCtx.beginPath();
  sCtx.moveTo(cx, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx + w / 2, baseY);
  sCtx.closePath();
  sCtx.fill();

  // Thin dark outline
  sCtx.strokeStyle = outlineColor;
  sCtx.lineWidth = 1.4;
  sCtx.lineJoin = 'round';
  sCtx.beginPath();
  sCtx.moveTo(cx - w / 2, baseY);
  sCtx.lineTo(tipX, tipY);
  sCtx.lineTo(cx + w / 2, baseY);
  sCtx.stroke();

  if (cfg.collarRing) {
    const crH = 3.5;
    const crY = isTop ? baseY : baseY - crH;
    sCtx.fillStyle = colBase;
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, crH);
    sCtx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    sCtx.fillRect(cx - (w + 4) / 2, crY, w + 4, 1);
    sCtx.strokeStyle = outlineColor;
    sCtx.lineWidth = 1;
    sCtx.strokeRect(cx - (w + 4) / 2, crY, w + 4, crH);
  }

  sCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  sCtx.lineWidth = 1.3;
  sCtx.beginPath();
  sCtx.moveTo(cx - w * 0.22, baseY + dir * 3);
  sCtx.lineTo(tipX - 1, tipY - dir * 2);
  sCtx.stroke();

  sCtx.fillStyle = '#ffffff';
  sCtx.beginPath();
  sCtx.arc(tipX, tipY - dir * 1.5, 1.3, 0, 6.28);
  sCtx.fill();

  sCtx.restore();
}

function drawFluffyClouds(pCtx, x, y, scale = 1, alpha = 0.85, tint = '#ffffff') {
  pCtx.save();
  pCtx.globalAlpha = alpha;
  pCtx.fillStyle = tint;
  const circles = [
    [0, 0, 26], [24, -8, 22], [48, 2, 24], [-22, 4, 18], [20, 8, 20]
  ];
  for (const [ox, oy, r] of circles) {
    pCtx.beginPath();
    pCtx.arc(x + ox * scale, y + oy * scale, r * scale, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  pCtx.beginPath();
  pCtx.ellipse(x + 12 * scale, y - 6 * scale, 34 * scale, 12 * scale, 0, 0, Math.PI * 2);
  pCtx.fill();
  pCtx.restore();
}

function prerenderSpikes(cfg) {
  const sizes = { small: 12, medium: 22, big: 36 };
  for (const sKey in sizes) {
    const h = sizes[sKey];
    for (const dir of ['top', 'bot']) {
      const key = `${sKey}_${dir}`;
      if (!spikeCanvases[key]) {
        spikeCanvases[key] = document.createElement('canvas');
        spikeCanvases[key].width = 36;
        spikeCanvases[key].height = 48;
      }
      renderSpikeToCanvas(spikeCanvases[key], dir === 'top', h, cfg);
    }
  }
}

function drawSkyscrapersWithNeon(sCtx, unitW, H, layer, stage) {
  // Neon City: skyscrapers with neon signs
  sCtx.save();
  const accent = stage.accent || '#19e3ff';
  const accent2 = stage.accentSecondary || '#ff3fb0';
  if (layer === 'far') {
    sCtx.fillStyle = 'rgba(11, 31, 51, 0.40)';
    sCtx.beginPath();
    sCtx.moveTo(0, H);
    sCtx.lineTo(0, H * 0.42);
    const cols = 12;
    const colW = unitW / cols;
    for (let i = 0; i < cols; i++) {
      const topH = H * (0.35 + ((i * 7) % 5) * 0.04);
      sCtx.lineTo(i * colW, topH);
      sCtx.lineTo((i + 1) * colW, topH);
    }
    sCtx.lineTo(unitW, H * 0.42);
    sCtx.lineTo(unitW, H);
    sCtx.closePath();

    sCtx.lineTo(0, H * 0.54);
    const cols = 8;
    const colW = unitW / cols;
    for (let i = 0; i < cols; i++) {
      const topH = H * (0.46 + ((i * 5 + 3) % 6) * 0.04);
      sCtx.lineTo(i * colW + 4, topH);
      sCtx.lineTo((i + 1) * colW - 4, topH);
    }
    sCtx.lineTo(unitW, H * 0.54);
    sCtx.lineTo(unitW, H);
    sCtx.closePath();
    sCtx.fill();
    // Glowing neon window dots
    sCtx.fillStyle = accent;
    for (let i = 0; i < cols; i++) {
      const topH = H * (0.46 + ((i * 5 + 3) % 6) * 0.04);
      for (let r = 0; r < 4; r++) {
        sCtx.fillRect(i * colW + 12 + (r % 2) * 14, topH + 20 + r * 16, 5, 3);
      }
    }
  } else {
    // Near: sharp foreground high-rises and neon signs
    sCtx.fillStyle = 'rgba(8, 12, 28, 0.95)';
    sCtx.beginPath();
    sCtx.moveTo(0, H);
    sCtx.lineTo(0, H * 0.66);
    const cols = 5;
    const colW = unitW / cols;
    for (let i = 0; i < cols; i++) {
      const topH = H * (0.58 + ((i * 4 + 1) % 4) * 0.04);
      sCtx.lineTo(i * colW + 8, topH);
      sCtx.lineTo((i + 1) * colW - 8, topH);
    }
    sCtx.lineTo(unitW, H * 0.66);
    sCtx.lineTo(unitW, H);
    sCtx.closePath();
    sCtx.fill();
    // Neon signage bands
    sCtx.fillStyle = accent2;
    sCtx.fillRect(unitW * 0.22, H * 0.62, 36, 4);
    sCtx.fillStyle = accent;
    sCtx.fillRect(unitW * 0.65, H * 0.60, 44, 4);

function renderStageSilhouettes(idx, stage, farCtx, midCtx, nearCtx, unitW, H) {
  switch (idx) {
    case 0:
      drawMesasAndArches(farCtx, unitW, H, 'far', stage);
      drawMesasAndArches(midCtx, unitW, H, 'mid', stage);
      drawMesasAndArches(nearCtx, unitW, H, 'near', stage);
      break;
    case 1:
      drawSkyscrapersWithNeon(farCtx, unitW, H, 'far', stage);
      drawSkyscrapersWithNeon(midCtx, unitW, H, 'mid', stage);
      drawSkyscrapersWithNeon(nearCtx, unitW, H, 'near', stage);
      break;
    case 2:
      drawMountainRidges(farCtx, unitW, H, 'far', stage);
      drawMountainRidges(midCtx, unitW, H, 'mid', stage);
      drawMountainRidges(nearCtx, unitW, H, 'near', stage);
      break;
    case 3:
      drawVolcanoCliffs(farCtx, unitW, H, 'far', stage);
      drawVolcanoCliffs(midCtx, unitW, H, 'mid', stage);
      drawVolcanoCliffs(nearCtx, unitW, H, 'near', stage);
      break;
    case 4:
      drawCyberFactory(farCtx, unitW, H, 'far', stage);
      drawCyberFactory(midCtx, unitW, H, 'mid', stage);
      drawCyberFactory(nearCtx, unitW, H, 'near', stage);
      break;
    case 5:
      drawAlienJungle(farCtx, unitW, H, 'far', stage);
      drawAlienJungle(midCtx, unitW, H, 'mid', stage);
      drawAlienJungle(nearCtx, unitW, H, 'near', stage);
      break;
    case 6:
      drawOceanRuins(farCtx, unitW, H, 'far', stage);
      drawOceanRuins(midCtx, unitW, H, 'mid', stage);
      drawOceanRuins(nearCtx, unitW, H, 'near', stage);
      break;
    case 7:
    default:
      drawSpaceStation(farCtx, unitW, H, 'far', stage);
      drawSpaceStation(midCtx, unitW, H, 'mid', stage);
      drawSpaceStation(nearCtx, unitW, H, 'near', stage);
      break;
  }
}

function prerenderStageBackgrounds() {
  const unitW = 720;
  stageBgCanvases.length = 0;

  STAGES.forEach((stage, idx) => {
    // 1. Gradient canvas with light haze band in middle
    const gradCanv = document.createElement('canvas');
    gradCanv.width = W;
    gradCanv.height = H;
    const gCtx = gradCanv.getContext('2d');
    const bgGrad = gCtx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, stage.gradientTop);
    bgGrad.addColorStop(1, stage.gradientBottom);
    gCtx.fillStyle = bgGrad;
    gCtx.fillRect(0, 0, W, H);

    // Light haze band in the middle
    const haze = gCtx.createLinearGradient(0, H * 0.40, 0, H * 0.62);
    haze.addColorStop(0, 'rgba(255, 255, 255, 0)');

// Stage Particles (slow particles in 2 sizes)
const stageParticles = [];
function initStageParticles() {
  stageParticles.length = 0;
  for (let i = 0; i < 28; i++) {
    stageParticles.push({
      x: rnd(0, W),
      y: rnd(0, H),
      sizeClass: (i % 2 === 0) ? 0 : 1, // 0 = small (~1.8px), 1 = medium (~3.8px)
      phase: rnd(0, 6.28),
      speed: rnd(15, 38)
    });
  }
}

function drawStageParticles(stage, alpha = 1) {
  const pType = stage.particleType || 'dust';
  const color = stage.accent || '#ffffff';

  ctx.save();
  ctx.globalAlpha = alpha;

  for (let i = 0; i < stageParticles.length; i++) {
    const p = stageParticles[i];
    const r = (p.sizeClass === 0) ? 1.8 : 3.6;

    if (pType === 'rain') {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = (p.sizeClass === 0) ? 1.0 : 1.6;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - 3, p.y + (p.sizeClass === 0 ? 8 : 14));
      ctx.stroke();
    } else if (pType === 'bubbles') {
      ctx.strokeStyle = 'rgba(52, 224, 200, 0.7)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      ctx.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    } else if (pType === 'embers') {
      ctx.fillStyle = '#ff6a1a';
      ctx.shadowColor = '#ea580c';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    } else if (pType === 'sparks') {
      ctx.fillStyle = '#ffd21a';
      ctx.shadowColor = '#eab308';
      ctx.shadowBlur = 3;
      ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
    } else if (pType === 'glowing spores') {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    } else if (pType === 'snow') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // dust / floating dust
      ctx.fillStyle = (pType === 'dust') ? '#f59e0b' : 'rgba(200, 180, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function updateStageParticles(dt, stage) {
  const pType = stage.particleType || 'dust';

  for (let i = 0; i < stageParticles.length; i++) {
    const p = stageParticles[i];
    if (pType === 'rain') {
      p.x -= 30 * dt;
      p.y += (350 + p.speed * 4) * dt;
    } else if (pType === 'bubbles') {
      p.y -= (45 + p.speed * 0.8) * dt;
      p.x += Math.sin(p.phase + gameTime * 2) * 12 * dt;
    } else if (pType === 'embers') {
      p.y -= (40 + p.speed * 0.7) * dt;
      p.x += Math.sin(p.phase + gameTime * 2.5) * 10 * dt;
    } else if (pType === 'sparks') {
      p.y += (65 + p.speed) * dt;
      p.x += Math.sin(p.phase + gameTime * 3) * 16 * dt;
    } else if (pType === 'glowing spores') {
      p.x -= (22 + p.speed * 0.4) * dt;
      p.y += Math.sin(p.phase + gameTime * 1.5) * 8 * dt;
    } else if (pType === 'snow') {
      p.y += (32 + p.speed * 0.5) * dt;
      p.x += Math.sin(p.phase + gameTime * 1.8) * 14 * dt;
    } else {
      // dust / floating dust
      p.x -= (18 + p.speed * 0.4) * dt;
      p.y += Math.sin(p.phase + gameTime) * 6 * dt;
    }

    if (p.x < -10) p.x += W + 20;
    if (p.x > W + 10) p.x -= W + 20;
    if (p.y < -10) p.y += H + 20;
    if (p.y > H + 10) p.y -= H + 20;
  }
}

// Speed Lines
const speedLines = [];
function initSpeedLines() {
  speedLines.length = 0;
  for (let i = 0; i < 22; i++) {
    speedLines.push({
      x: rnd(0, W),
      y: rnd(H * 0.12, H * 0.88),
      len: rnd(35, 85),
      speedMult: rnd(1.4, 2.1),
      alpha: rnd(0.15, 0.45)
    });
  }
}

function updateAndDrawSpeedLines(dt, currentSp, stage) {
  const mult = getSpeedMultiplier();
  // None at Normal start (when mult <= 1.0 and currentSp <= W * 0.31 * 1.05)
  if (mult <= 1.0 && currentSp <= W * 0.31 * 1.05) return;

  const baseSp = W * 0.31;
  const speedRatio = Math.max(0, (currentSp - baseSp) / (W * 0.45));
  const activeCount = Math.min(speedLines.length, Math.round(6 + speedRatio * 14));
  const color = stage.accent || '#19e3ff';

  ctx.save();
  for (let i = 0; i < activeCount; i++) {
    const sl = speedLines[i];
    sl.x -= currentSp * sl.speedMult * dt;
    if (sl.x + sl.len < 0) {
      sl.x = W + rnd(10, 60);
      sl.y = rnd(H * 0.12, H * 0.88);
      sl.len = rnd(35, 90);
      sl.speedMult = rnd(1.4, 2.1);
      sl.alpha = rnd(0.15, 0.45);
    }

    const lineAlpha = Math.min(0.55, sl.alpha * (0.6 + speedRatio * 0.6));
    const grad = ctx.createLinearGradient(sl.x, 0, sl.x + sl.len, 0);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
    grad.addColorStop(0.3, color);
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

    ctx.globalAlpha = lineAlpha;
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sl.x, sl.y);
    ctx.lineTo(sl.x + sl.len, sl.y);
    ctx.stroke();
  }
  ctx.restore();
}

// Soft Wind Audio (bandpass white noise WebAudio)
let windSource = null;
let windFilter = null;
let windGain = null;

function initWindSound() {
  if (!audioCtx || windSource) return;
  try {
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 500;
    filter.Q.value = 1.2;

    const gain = audioCtx.createGain();
    gain.gain.value = 0;

    whiteNoise.connect(filter);
    filter.connect(gain);
    if (masterGain) {
      gain.connect(masterGain);
    } else {
      gain.connect(audioCtx.destination);
    }
    whiteNoise.start(0);

    windSource = whiteNoise;
    windFilter = filter;
    windGain = gain;
  } catch(e) {}
}

function updateWindSound(dt, currentSp) {
  if (!windGain || !windFilter || !audioCtx) return;
  if (!soundEnabled || st !== 'play' || stopping || finishRunStage !== 'none') {
    windGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.12);
    return;
  }
  const baseSp = W * 0.31;
  const speedRatio = Math.max(0, (currentSp - baseSp) / (W * 0.45));
  const targetGain = Math.min(WIND_VOLUME, 0.015 + speedRatio * (WIND_VOLUME - 0.015));
  const targetFreq = 420 + Math.min(850, speedRatio * 750);

  windGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.08);
  windFilter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.08);
}

    shineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');

    shineGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    fCtx.fillStyle = shineGrad;
    fCtx.beginPath();
    fCtx.arc(0, 0, GOLD_RADIUS - 1.2, 0, Math.PI * 2);
    fCtx.fill();

    if (i % 2 === 0) {
      fCtx.fillStyle = '#ffffff';
      fCtx.beginPath();
      fCtx.arc(-GOLD_RADIUS * 0.55, -GOLD_RADIUS * 0.55, 2.5, 0, Math.PI * 2);
      fCtx.fill();
    }

    fCtx.restore();
    goldFrames.push(canv);
  }

  // 4. ROYAL BLUE GEM COIN: value 50, faceted jewel coin with magical aura & bold "50"
  const gemSz = Math.ceil(GEM_RADIUS * 2 + 16);
  const gemCx = gemSz / 2, gemCy = gemSz / 2;
  for (let i = 0; i < 8; i++) {
    const canv = document.createElement('canvas');
    canv.width = gemSz;
    canv.height = gemSz;
    const gCtx = canv.getContext('2d');

    const ang = (i / 8) * Math.PI;
    const wScale = Math.max(0.28, Math.abs(Math.cos(ang)));

    gCtx.save();
    gCtx.translate(gemCx, gemCy);

    // Magical cyan aura
    const mGlow = gCtx.createRadialGradient(0, 0, GEM_RADIUS * 0.4, 0, 0, GEM_RADIUS + 6);
    mGlow.addColorStop(0, 'rgba(56, 189, 248, 0.60)');
    mGlow.addColorStop(0.7, 'rgba(14, 165, 233, 0.20)');
    mGlow.addColorStop(1, 'rgba(14, 165, 233, 0)');
    gCtx.fillStyle = mGlow;
    gCtx.beginPath();
    gCtx.arc(0, 0, GEM_RADIUS + 6, 0, Math.PI * 2);
    gCtx.fill();

    gCtx.scale(wScale, 1.0);

    const gr = GEM_RADIUS;

    // Diamond gem outline / shadow
    gCtx.fillStyle = '#082f49';
    gCtx.beginPath();
    gCtx.moveTo(0, -gr);
    gCtx.lineTo(gr * 0.85, -gr * 0.35);
    gCtx.lineTo(gr * 0.65, gr * 0.55);
    gCtx.lineTo(0, gr);
    gCtx.lineTo(-gr * 0.65, gr * 0.55);
    gCtx.lineTo(-gr * 0.85, -gr * 0.35);
    gCtx.closePath();
    gCtx.fill();

    // Blue gem body gradient
    const gemGrad = gCtx.createLinearGradient(0, -gr, 0, gr);
    gemGrad.addColorStop(0, '#f0f9ff');
    gemGrad.addColorStop(0.2, '#38bdf8');
    gemGrad.addColorStop(0.65, '#0284c7');
    gemGrad.addColorStop(1, '#075985');
    gCtx.fillStyle = gemGrad;
    gCtx.beginPath();
    gCtx.moveTo(0, -gr + 1.5);
    gCtx.lineTo(gr * 0.85 - 1.2, -gr * 0.35);
    gCtx.lineTo(gr * 0.65 - 1.2, gr * 0.55 - 1.0);
    gCtx.lineTo(0, gr - 1.5);
    gCtx.lineTo(-gr * 0.65 + 1.2, gr * 0.55 - 1.0);
    gCtx.lineTo(-gr * 0.85 + 1.2, -gr * 0.35);
    gCtx.closePath();
    gCtx.fill();

    // Internal facet lines
    gCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    gCtx.lineWidth = 1.0;
    gCtx.beginPath();
    gCtx.moveTo(0, -gr + 1.5);
    gCtx.lineTo(0, gr - 1.5);
    gCtx.moveTo(-gr * 0.85 + 1.2, -gr * 0.35);
    gCtx.lineTo(gr * 0.85 - 1.2, -gr * 0.35);
    gCtx.stroke();

    // Big bold engraved "50" in center (NO "Rs"!)
    if (wScale >= 0.35) {
      gCtx.font = '900 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      gCtx.textAlign = 'center';
      gCtx.textBaseline = 'middle';
      gCtx.strokeStyle = '#082f49';
      gCtx.lineWidth = 2.6;
      gCtx.lineJoin = 'round';
      gCtx.strokeText('50', 0, 0.8);
      gCtx.fillStyle = '#ffffff';
      gCtx.fillText('50', 0, 0.5);
    }

    // Sparkle glint on facet
    if (i % 2 === 0) {
      gCtx.fillStyle = '#ffffff';
      gCtx.beginPath();
      gCtx.arc(-gr * 0.3, -gr * 0.45, 2.8, 0, Math.PI * 2);
      gCtx.fill();
    }

    gCtx.restore();
    gemFrames.push(canv);
  }
}

function playCoinPickupSound(coinType = 'bronze') {
  if (!soundEnabled || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    coinCombo = Math.min(8, coinCombo + 1);
    coinComboTimer = 0.8;

    const pitchFactor = Math.pow(2, coinCombo / 14);
    const outNode = masterGain || audioCtx.destination;

    if (coinType === 'gem') {
      // Shimmering triple chime for rare blue gem
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor],
        [2637.0 * pitchFactor, 3135.96 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.055;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.24, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          osc.start(t);
          osc.stop(t + 0.26);
        });
      });
      return;
    }

    if (coinType === 'gold') {
      // Fuller double chime for gold coin
      const freqs = [
        [1046.5 * pitchFactor, 1318.5 * pitchFactor],
        [1567.98 * pitchFactor, 2093.0 * pitchFactor]
      ];
      freqs.forEach((pair, idx) => {
        const t = now + idx * 0.06;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.setValueAtTime(0.26, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        g.connect(outNode);
        pair.forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          osc.connect(g);
          osc.start(t);
          osc.stop(t + 0.22);
        });
      });
      return;
    }

    if (coinType === 'silver') {
      // Higher ting for silver coin
      const f1 = 1760 * pitchFactor;
      const f2 = 2637 * pitchFactor;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.25, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      g.connect(outNode);
      [f1, f2].forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        osc.connect(g);
        osc.start(now);
        osc.stop(now + 0.16);
      });
      return;
    }

    // Normal ting for bronze coin
    const f1 = 1318 * pitchFactor;
    const f2 = 1976 * pitchFactor;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    g.connect(outNode);
    [f1, f2].forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.connect(g);
      osc.start(now);
      osc.stop(now + 0.14);
    });
  } catch (e) {}
}

function getCorridorSafeBounds(x, segsList) {
  for (let i = 0; i < segsList.length; i++) {
    const s = segsList[i];
    if (x >= s.x && x <= s.x + s.w) {
      if (s.isOpen) {
        return {
          top: -300,
          bot: H + 300,
          safeTop: 120,
          safeBot: H - 120,
          safeCenter: CAR_REST_Y - 40,
          halfH: 100
        };
      }
      let curTop = (s.curTop !== undefined) ? s.curTop : s.top;
      let curBot = (s.curBot !== undefined) ? s.curBot : s.bot;

      // Smooth step interpolation near segment boundary
      if (i < segsList.length - 1) {
        const sNext = segsList[i + 1];
        if (!sNext.isOpen) {
          const seamX = s.x + s.w;
          const blendDist = 48 * 1.2;
          if (x > seamX - blendDist) {
            const t = (x - (seamX - blendDist)) / blendDist;
            const ease = t * t * (3 - 2 * t);
            const nextTop = (sNext.curTop !== undefined) ? sNext.curTop : sNext.top;
            const nextBot = (sNext.curBot !== undefined) ? sNext.curBot : sNext.bot;
            curTop = curTop + (nextTop - curTop) * ease;
            curBot = curBot + (nextBot - curBot) * ease;
          }
        }
      }

      const safeTop = curTop + 1.2 * 48;
      const safeBot = curBot - 1.2 * 48;
      const safeCenter = (safeTop + safeBot) / 2;
      const halfH = Math.max(12, (safeBot - safeTop) / 2 - COIN_RADIUS);
      return { top: curTop, bot: curBot, safeTop, safeBot, safeCenter, halfH };
    }
  }
  return {
    top: -300,
    bot: H + 300,
    safeTop: 120,
    safeBot: H - 120,
    safeCenter: CAR_REST_Y,
    halfH: 100
  };
}

function generateLevelCoins(lvl, segsList) {
  coins.length = 0;
  coinSparkles.length = 0;
  flyingCoins.length = 0;
  coinFloatTexts.length = 0;
  levelCoinsCollected = 0;
  earnedStars = 1;
  isPerfect = false;
  perfectBonusGiven = false;
  starSoundsPlayed = [false, false, false];
  bronzeCoinsPicked = 0;

  const prng = mulberry32(hashInt(lvl * 77777 + 98765));
  const coinSpacing = 1.1 * 48; // ~52.8 px
  const sp = scrollSpeed();

  function pushCoin(cx, cy, type, phase) {
    const isHigher = (type !== 'bronze');
    const b = getCorridorSafeBounds(cx, segsList);
    let finalY = cy;
    if (isHigher) {
      // 1.4 * carH distance from spike tips for higher value coins
      const minSafeY = b.top + 1.4 * 48;
      const maxSafeY = b.bot - 1.4 * 48;
      if (minSafeY < maxSafeY) {
        finalY = Math.max(minSafeY, Math.min(maxSafeY, cy));
      } else {
        finalY = b.safeCenter;
      }
    } else {
      finalY = Math.max(b.safeTop + BRONZE_RADIUS, Math.min(b.safeBot - BRONZE_RADIUS, cy));
    }
    const val = (type === 'gem') ? GEM_VALUE : ((type === 'gold') ? GOLD_VALUE : ((type === 'silver') ? SILVER_VALUE : BRONZE_VALUE));
    const r = (type === 'gem') ? GEM_RADIUS : ((type === 'gold') ? GOLD_RADIUS : ((type === 'silver') ? SILVER_RADIUS : BRONZE_RADIUS));
    coins.push({
      x: cx,
      y: finalY,
      type,
      val,
      radius: r,
      collected: false,
      phase,
      popTimer: 0
    });
  }

  // 1. START GUIDE: 5 bronze coins in gentle arc leading into tunnel
  const startX = START_ROAD_START + (START_ROAD_END - START_ROAD_START) * 0.60;
  const firstSegBounds = getCorridorSafeBounds(TUNNEL_START_X + 60, segsList);
  const targetEntryY = firstSegBounds.safeCenter;
  for (let k = 0; k < 5; k++) {
    const t = k / 4;
    const x = startX + k * coinSpacing;
    const y = CAR_REST_Y - (CAR_REST_Y - targetEntryY) * Math.sin(t * Math.PI * 0.5);
    pushCoin(x, y, 'bronze', prng() * 6.28);
  }

  // 2. TUNNEL COIN PATTERNS (Subway Surfers style: straight, wave, arc, staircase, double row, risk line)
  let curX = TUNNEL_START_X + 180;
  const tunnelMaxX = TUNNEL_END_X - 180;
  const patternTypes = ['straight', 'wave', 'arc_up', 'arc_down', 'staircase', 'double_row', 'risk_high', 'risk_low'];
  const totalApproxPatterns = Math.max(1, Math.floor((tunnelMaxX - curX) / (sp * 1.35)));

  // Rare blue gem appears at most once per level (value 25)
  const hasGem = (prng() < 0.50);
  const gemPatternIndex = hasGem ? Math.floor(totalApproxPatterns * (0.35 + prng() * 0.35)) : -1;

  // Gold coins: at most 3 per level (value 10)
  const maxGold = hasGem ? 1 : Math.min(3, Math.floor(prng() * 2 + 1));
  const maxSilver = hasGem ? Math.min(4, Math.floor(prng() * 2 + 2)) : Math.min(6, Math.floor(prng() * 2 + 4));
  let goldPlaced = 0;
  let silverPlaced = 0;
  let gemPlaced = false;
  let patternCount = 0;

  while (curX < tunnelMaxX) {
    const pType = patternTypes[Math.floor(prng() * patternTypes.length)];
    const count = (pType === 'double_row') ? Math.floor(prng() * 3 + 4) : Math.floor(prng() * 4 + 5);
    const isGemPattern = (patternCount === gemPatternIndex && !gemPlaced);

    // Higher-value coin placement: end of pattern or top of arc
    let rewardIdx = -1;
    let rewardType = 'bronze';

    if (isGemPattern) {
      rewardType = 'gem';
      gemPlaced = true;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (goldPlaced < maxGold && (patternCount % 4 === 1 || pType === 'risk_high' || pType === 'risk_low') && prng() < 0.50) {
      rewardType = 'gold';
      goldPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    } else if (silverPlaced < maxSilver && (patternCount % 2 === 0 || prng() < 0.40)) {
      rewardType = 'silver';
      silverPlaced++;
      rewardIdx = (pType === 'arc_up' || pType === 'arc_down') ? Math.floor(count / 2) : (count - 1);
    }

    if (pType === 'straight') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, b.safeCenter, type, prng() * 6.28);
      }
    } else if (pType === 'wave') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const amp = Math.min(b.halfH * 0.65, 36);
        const y = b.safeCenter + Math.sin((k / count) * Math.PI * 2) * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'arc_up' || pType === 'arc_down') {
      const sign = (pType === 'arc_up') ? -1 : 1;
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const t = k / (count - 1);
        const arc = 4 * t * (1 - t);
        const amp = Math.min(b.halfH * 0.70, 38);
        const y = b.safeCenter + sign * arc * amp;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'staircase') {
      const bStart = getCorridorSafeBounds(curX, segsList);
      const bEnd = getCorridorSafeBounds(curX + count * coinSpacing, segsList);
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const t = k / (count - 1);
        const ease = t * t * (3 - 2 * t);
        const y = bStart.safeCenter + (bEnd.safeCenter - bStart.safeCenter) * ease;
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    } else if (pType === 'double_row') {
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(18, b.halfH * 0.45);
        const type = (k === count - 1 && rewardType === 'silver') ? 'silver' : 'bronze';
        pushCoin(cx, b.safeCenter - offset, type, prng() * 6.28);
        pushCoin(cx, b.safeCenter + offset, 'bronze', (prng() * 6.28) + 1.5);
      }
    } else {
      // risk line slightly toward one edge of safe band (still safe)
      const isHigh = (pType === 'risk_high');
      for (let k = 0; k < count; k++) {
        const cx = curX + k * coinSpacing;
        if (cx > tunnelMaxX) break;
        const b = getCorridorSafeBounds(cx, segsList);
        const offset = Math.min(30, b.halfH * 0.65);
        const y = isHigh ? (b.safeCenter - offset) : (b.safeCenter + offset);
        const type = (k === rewardIdx) ? rewardType : 'bronze';
        pushCoin(cx, y, type, prng() * 6.28);
      }
    }

    patternCount++;
    const patternLen = count * coinSpacing;
    const gapSec = 0.8 + prng() * 0.8;
    curX += patternLen + (gapSec * sp);
  }

  // 3. FINISH ROAD: 10 straight coins along asphalt (9 bronze, final coin at finish line is silver)
  const finishCoinY = CAR_REST_Y - BRONZE_RADIUS - 2;
  const finishCoinsStart = FINISH_ROAD_X + 50;
  const finishCoinsEnd = FINISH_LINE_X - 50;
  const finishCoinStep = (finishCoinsEnd - finishCoinsStart) / 9;
  for (let k = 0; k < 10; k++) {
    const isLast = (k === 9);
    pushCoin(finishCoinsStart + k * finishCoinStep, finishCoinY, isLast ? 'silver' : 'bronze', prng() * 6.28);
  }

  levelCoinsTotal = coins.reduce((acc, c) => acc + c.val, 0);
}

// ==========================================
// GLOSSY UI COMPONENTS (White text with dark outline)
// ==========================================
const BUTTON_THEMES = {
  green: { top: '#6ee7b7', mid: '#22c55e', bot: '#16a34a', lip: '#14532d', border: '#052e16' },
  blue: { top: '#93c5fd', mid: '#3b82f6', bot: '#2563eb', lip: '#1e3a8a', border: '#0f172a' },
  purple: { top: '#d8b4fe', mid: '#a855f7', bot: '#9333ea', lip: '#581c87', border: '#3b0764' },
  orange: { top: '#fed7aa', mid: '#f97316', bot: '#ea580c', lip: '#7c2d12', border: '#431407' },
  red: { top: '#fca5a5', mid: '#ef4444', bot: '#dc2626', lip: '#7f1d1d', border: '#450a0a' },
  gray: { top: '#e2e8f0', mid: '#94a3b8', bot: '#64748b', lip: '#334155', border: '#1e293b' }
};

function drawGlossyText(text, x, y, size, align = 'center', color = '#ffffff', strokeColor = '#0f172a', strokeWidth) {
  ctx.save();
  ctx.font = `800 ${size}px "Lilita One", "Baloo 2", cursive, system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';

  const sw = strokeWidth !== undefined ? strokeWidth : Math.max(3.5, Math.round(size * 0.18));
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = sw;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeText(text, x, y);

  ctx.shadowColor = 'transparent';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawGlossyButton(x, y, w, h, theme, label, iconType, isPressed, radius = 18) {
  const py = isPressed ? y + 3 : y;
  const lipH = isPressed ? 2 : 5;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = isPressed ? 4 : 8;
  ctx.shadowOffsetY = isPressed ? 2 : 5;

  ctx.fillStyle = theme.lip;
  roundRect(ctx, x, py + lipH, w, h, radius);
  ctx.fill();

  ctx.shadowColor = 'transparent';

  const grad = ctx.createLinearGradient(0, py, 0, py + h);
  grad.addColorStop(0, theme.top);
  grad.addColorStop(0.48, theme.mid);
  grad.addColorStop(1, theme.bot);
  ctx.fillStyle = grad;
  roundRect(ctx, x, py, w, h, radius);
  ctx.fill();

  // White gloss band on top half
  ctx.save();
  roundRect(ctx, x, py, w, h, radius);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, py, 0, py + h * 0.54);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
  ctx.fillStyle = glossGrad;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, py + 2, w * 0.6, h * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Inner highlight outline
  ctx.save();
  roundRect(ctx, x + 1.5, py + 1.5, w - 3, h - 3, Math.max(2, radius - 1));
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.restore();

  // Dark outer outline
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = 2.4;
  roundRect(ctx, x, py, w, h + (isPressed ? 1 : 2), radius);
  ctx.stroke();

  if (iconType) {
    drawButtonIcon(iconType, x + w / 2, py + h / 2, Math.min(w, h) * 0.48);
  }
  if (label) {
    const textY = py + h / 2 + 1;
    drawGlossyText(label, x + w / 2, textY, Math.min(22, Math.round(h * 0.42)), 'center', '#ffffff', theme.border, 4.2);
  }
  ctx.restore();
}

function drawRoundGlossyButton(cx, cy, r, theme, iconType, isPressed) {
  drawGlossyButton(cx - r, cy - r, r * 2, r * 2, theme, null, iconType, isPressed, r);
}

function drawButtonIcon(type, cx, cy, sz) {
  ctx.save();
  ctx.translate(cx, cy);

  if (type === 'gear') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2;
    for (let a = 0; a < 6; a++) {
      ctx.rotate(Math.PI / 3);
      ctx.fillRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
      ctx.strokeRect(-sz * 0.16, -sz * 0.52, sz * 0.32, sz * 0.22);
    }
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.38, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(0, 0, sz * 0.18, 0, 6.28); ctx.fill(); ctx.stroke();

  } else if (type === 'car') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#3b0764';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.45, sz * 0.15);
    ctx.lineTo(-sz * 0.35, -sz * 0.1);
    ctx.lineTo(-sz * 0.1, -sz * 0.28);
    ctx.lineTo(sz * 0.2, -sz * 0.28);
    ctx.lineTo(sz * 0.4, -sz * 0.05);
    ctx.lineTo(sz * 0.45, sz * 0.15);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-sz * 0.25, sz * 0.18, sz * 0.14, 0, 6.28); ctx.fill();
  } else if (type === 'wheel') {
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.44, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Inner dark rotor
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // 5 Spokes
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2.2;
    for (let a = 0; a < 5; a++) {
      const ang = a * (Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * sz * 0.36, Math.sin(ang) * sz * 0.36);
      ctx.stroke();
    }
    // Red sport center cap
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.12, 0, Math.PI * 2);
    ctx.fill();

  } else if (type === 'close') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = sz * 0.22;
    ctx.lineCap = 'round';
    const s = sz * 0.32;
    ctx.beginPath();
    ctx.moveTo(-s, -s); ctx.lineTo(s, s);
    ctx.moveTo(s, -s); ctx.lineTo(-s, s);
    ctx.stroke();

  } else if (type === 'sound_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.24, -0.6, 0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.05, 0, sz * 0.4, -0.7, 0.7); ctx.stroke();

  } else if (type === 'sound_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-sz * 0.35, -sz * 0.15); ctx.lineTo(-sz * 0.15, -sz * 0.15); ctx.lineTo(sz * 0.1, -sz * 0.35);
    ctx.lineTo(sz * 0.1, sz * 0.35); ctx.lineTo(-sz * 0.15, sz * 0.15); ctx.lineTo(-sz * 0.35, sz * 0.15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();

  } else if (type === 'vibrate_on') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(-sz * 0.25, 0, sz * 0.25, Math.PI * 0.75, Math.PI * 1.25); ctx.stroke();
    ctx.beginPath(); ctx.arc(sz * 0.25, 0, sz * 0.25, -Math.PI * 0.25, Math.PI * 0.25); ctx.stroke();

  } else if (type === 'vibrate_off') {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    roundRect(ctx, -sz * 0.2, -sz * 0.35, sz * 0.4, sz * 0.7, 4);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-sz * 0.35, -sz * 0.35); ctx.lineTo(sz * 0.35, sz * 0.35); ctx.stroke();
  }

  ctx.restore();
}

function drawGoldStar(cx, cy, r, scale = 1.0) {
  if (scale <= 0.01) return;
  ctx.save();
  ctx.translate(cx, cy);
  if (scale !== 1.0) {
    ctx.scale(scale, scale);
  }

  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 2;

  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (i * Math.PI) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.48;
    const x = Math.cos(ang) * rad;
    const y = Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const starGrad = ctx.createLinearGradient(0, -r, 0, r);
  starGrad.addColorStop(0, '#fef08a');
  starGrad.addColorStop(0.4, '#facc15');
  starGrad.addColorStop(1, '#ca8a04');
  ctx.fillStyle = starGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#713f12';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-r * 0.2, -r * 0.25, r * 0.2, 0, 6.28);
  ctx.fill();

  ctx.restore();
}

          best = Math.floor(data.bestScore);

    }
  } catch (e) {

  try {

    if (legacyBest > best) best = legacyBest;

    if (hLvl !== undefined && hLvl !== null) {
      highestLevel = Math.max(curLevel, Math.floor(hLvl));
    } else {
      highestLevel = Math.max(highestLevel, curLevel);
    }
    if (bScore !== undefined && bScore !== null) {
      best = Math.max(best, Math.floor(bScore));

    const payload = JSON.stringify({

}

// Synchronized progress calculation: exactly 100% when finish road reaches car
function getLevelProgress() {
  const dist = Math.max(0, cam);
  return Math.max(0, Math.min(1, dist / LEVEL_LENGTH));
}

function getDifficultyDistance() {
  const distInLevel = Math.max(0, Math.min(LEVEL_LENGTH, cam));
  return (curLevel - 1) * LEVEL_LENGTH + distInLevel;
}

// 1. Difficulty Growth:
// Balanced progressive curve: fBase = 1 - exp(-(L - 1) / LEVEL_GROWTH_TAU)
// Smoothly scales from Level 1 (f=0) through Level 10 (f~0.43) to Level 30 (f~0.84)
function getLevelDifficulty(lvl, p = 0) {
  const L = lvl || curLevel;
  const fBase = 1 - Math.exp(-(L - 1) / LEVEL_GROWTH_TAU);

  let intra = 1.0;
  if (p < INTRA_LEVEL_EASY_FRACTION) {
    const ramp = p / INTRA_LEVEL_EASY_FRACTION;
    intra = (1.0 - INTRA_LEVEL_GROWTH) + (INTRA_LEVEL_GROWTH * ramp);
  } else {
    const normP = (p - INTRA_LEVEL_EASY_FRACTION) / (1.0 - INTRA_LEVEL_EASY_FRACTION);
    intra = 1.0 + INTRA_LEVEL_GROWTH * normP;
  }

  const f = Math.max(0, Math.min(1.0, fBase * intra));
  return { f, fBase, intra };
}

// Scroll speed: canvasWidth * 0.31 * multiplier at level 1, growing with difficulty up to 1.4 * starting speed
function scrollSpeed(difficultyDistance = getDifficultyDistance()) {
  const p = getLevelProgress();
  const { f } = getLevelDifficulty(curLevel, p);
  const mult = getSpeedMultiplier();
  const startingSpeed = W * BASE_SCROLL_SPEED_RATIO * mult;
  const diffMultiplier = Math.min(1.4, 1 + SCROLL_SPEED_GROWTH * f);
  return startingSpeed * diffMultiplier * SPEED_MULTIPLIER;
}
const speed = scrollSpeed;

// Gap height = lerp(GAP_LEVEL_1_RATIO, GAP_MAX_DIFFICULTY_RATIO, f) * carH
function getGapHeight(lvl, p = 0) {
  const { f } = getLevelDifficulty(lvl, p);
  const gapRatio = lerp(GAP_LEVEL_1_RATIO, GAP_MAX_DIFFICULTY_RATIO, f);
  return Math.max(GAP_MAX_DIFFICULTY_RATIO * CAR_HITBOX_H, gapRatio * CAR_HITBOX_H);
}

// 3. SPIKE SIZES:
// - levels 1 & 2: only small spikes (12px), friendly introduction
// - levels 3 to 4: medium (22px) and small spikes
// - level 5+: big spikes (36px) appear moderately (8% to 24% at high levels)
function pickClusterSize(lvl, levelRng) {
  const L = lvl || curLevel;
  if (L < 5) {
    if (L <= 2) return 'small';
    return levelRng() < 0.45 ? 'medium' : 'small';
  }
  const t = Math.max(0, Math.min(1, (L - 5) / (25 - 5)));
  const pBig = 0.08 + (0.24 - 0.08) * t;
  const pMed = 0.42;
  const r = levelRng();
  if (r < pBig) return 'big';
  if (r < pBig + pMed) return 'medium';
  return 'small';
}

// 4. SPIKE GENERATION: level 4+ mixes spike heights inside one rail
function makeSpikes(len, lvl, top, bot, noSpikes = false, levelRng) {
  const count = Math.ceil(len / 12);
  const heights = { small: 12, medium: 22, big: 36 };
  const L = lvl || curLevel;
  const allowMixed = (L >= 4);

  function gen(isTop) {
    const list = [];
    let i = 0;
    while (i < count) {
      const cLen = Math.min(count - i, Math.floor(2 + levelRng() * 4));
      const baseSize = pickClusterSize(L, levelRng);
      const isMixed = allowMixed && (levelRng() < 0.35);

      for (let k = 0; k < cLen; k++) {
        let size = baseSize;
        if (isMixed && k % 2 === 1) {
          size = (baseSize === 'big') ? 'medium' : 'small';
        }
        const h = noSpikes ? 0 : heights[size];
        list.push({ h, size });
      }
      i += cLen;
    }
    return list;
  }
  const topSpikes = gen(true);
  const botSpikes = gen(false);
  const maxSpikeSum = Math.max(0, (bot - top) - (CAR_HITBOX_H + 18));
  for (let i = 0; i < count; i++) {
    if (topSpikes[i].h + botSpikes[i].h > maxSpikeSum) {
      if (topSpikes[i].h >= botSpikes[i].h) {
        if (22 + botSpikes[i].h <= maxSpikeSum) { topSpikes[i].h = 22; topSpikes[i].size = 'medium'; }
        else { topSpikes[i].h = 12; topSpikes[i].size = 'small'; }
      } else {
        if (topSpikes[i].h + 22 <= maxSpikeSum) { botSpikes[i].h = 22; botSpikes[i].size = 'medium'; }
        else { botSpikes[i].h = 12; botSpikes[i].size = 'small'; }
      }
    }
  }
  return { topSpikes, botSpikes };
}
