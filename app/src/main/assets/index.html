}

function advanceToNextLevel() {
  const nextLvl = (levelJustCleared ? levelJustCleared + 1 : curLevel + 1);
  curLevel = nextLvl;
  saveProgress(curLevel, Math.max(highestLevel, curLevel), best);
  startLevel(curLevel);
  st = 'transition';
  transitionTimer = 0;
  hold = false;
  thrust = 0;
}

function resetGame() {
  curLevel = 1;
  cam = 0;
  startLevel(1);
}

function initConfetti() {
  confettis = [];
  const colors = ['#22c55e', '#facc15', '#38bdf8', '#f43f5e', '#a855f7', '#fb923c'];
  for (let i = 0; i < 75; i++) {
    confettis.push({
      x: rnd(10, W - 10),
      y: rnd(-80, H * 0.45),
      vx: rnd(-35, 35),
      vy: rnd(65, 160),
      size: rnd(4, 7),
      w: rnd(5, 9),
      rot: rnd(0, 6.28),
      vRot: rnd(-4, 4),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateConfetti(dt) {
  for (const c of confettis) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.vRot * dt;
    if (c.y > H + 20) {
      c.y = rnd(-20, -5);
      c.x = rnd(10, W - 10);
      c.vy = rnd(65, 160);
    }
  }
}

function drawConfetti() {
  for (const c of confettis) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.size / 2, c.w * Math.abs(Math.cos(c.rot)), c.size);
    ctx.restore();
  }
}

function die() {
  st = 'dead';
  deadAt = performance.now();
  hold = false;
  thrust = 0;
  podDeploy = 0;
  flameIntensity = 0;
  for (let i = 0; i < sparkPool.length; i++) sparkPool[i].active = false;
  playCrashSound();
  const progress = getLevelProgress();
  const curScore = Math.floor(progress * 100);
  const currentTotal = 100 * (curLevel - 1) + curScore;
  if (currentTotal > best) {
    best = currentTotal;
    saveProgress(curLevel, highestLevel, best);
  }
}

function spawnTireDust() {
  const drawW = CAR_DRAW_W;
  const drawH = CAR_DRAW_H;
  const rearOx = -drawW / 2 + drawW * WHEEL_REAR_X;
  const frontOx = -drawW / 2 + drawW * WHEEL_FRONT_X;
  const wheelY = cy + drawH * (WHEEL_Y - 0.5) + (drawW * WHEEL_RADIUS) * 0.9;
  for (const ox of [rearOx, frontOx]) {
    parts.push({
      x: carDrawX + ox + rnd(-3, 3),
      y: wheelY + rnd(-1, 2),
      vx: rnd(-45, -15),
      vy: rnd(-5, 0),
      l: 0,
      m: rnd(0.2, 0.35),
      size: rnd(2.5, 4.5),
      color: 'rgba(255, 255, 255, 0.65)'
    });
  }
}

// 3-layer cartoon road platform with red deck edge and soft shadow
function drawRoadPlatform(startX, endX, roadTop, isFinish = false) {
  const w = endX - startX;
  if (w <= 0) return;
  const x = startX - cam;
  if (x + w < -60 || x > W + 60) return;

  const bandH = 36; // 36 px tall asphalt band
  const roadCenterY = roadTop + bandH / 2; // middle: roadTop + 18
  const roadBottom = roadTop + bandH; // roadTop + 36
  const trussBottom = roadBottom + 20;

  // Clip all details of a road strictly to the road's own rectangle [x, x + w]
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, roadTop - 32, w, (trussBottom + 8) - (roadTop - 32));
  ctx.clip();

  // Soft drop shadow under platform
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;

  // 1. Asphalt Road Surface (frames car in the middle of the road, 36px tall band)
  ctx.fillStyle = '#26282c';
  ctx.fillRect(x, roadTop, w, bandH);

  // 2. Upper Red Deck Edge / Barrier (symmetrical border)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadTop - 2, w, 3);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadTop - 2, w, 1);

  // 3. Yellow Dashed Center Lane Markings
  // Start at least 20 px after road's left edge and stop at least 20 px before right edge; only whole dashes
  ctx.fillStyle = '#fde047';
  const dashW = 22;
  const dashPitch = 48;
  for (let relX = 24; relX + dashW <= w - 20; relX += dashPitch) {
    ctx.fillRect(x + relX, roadCenterY - 1.5, dashW, 3);
  }

  // 4. Lower Red Deck Edge (front edge of the road, below tires at roadBottom - 2)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadBottom - 2, w, 4);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadBottom - 2, w, 1.2);

  // 5. Steel Truss structure underneath (below tires)
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x, roadBottom + 2, w, 18);

  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let relX = 0; relX < w; relX += 40) {
    const p1 = x + relX;
    const p2 = Math.min(x + w, x + relX + 40);
    ctx.moveTo(p1, roadBottom + 3); ctx.lineTo(p2, roadBottom + 19);
    ctx.moveTo(p2, roadBottom + 3); ctx.lineTo(p1, roadBottom + 19);
  }
  ctx.stroke();

  // 6. Safety rail at the end of the road (strictly clipped inside the road's rectangle)
  if (isFinish) {
    const railScreenX = endX - cam;
    if (railScreenX > -40 && railScreenX < W + 40) {
      const rx = railScreenX - 12;
      // Heavy steel posts
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(rx - 3, roadTop - 26, 6, bandH + 26);
      ctx.fillRect(rx + 4, roadTop - 26, 6, bandH + 26);

      // Crash barrier body
      const barrierW = 16;
      ctx.fillStyle = '#475569';
      ctx.fillRect(rx - 4, roadTop - 22, barrierW, 14);

      // Red and white hazard warning stripes
      ctx.save();
      ctx.beginPath();
      ctx.rect(rx - 4, roadTop - 22, barrierW, 14);
      ctx.clip();
      for (let sx = -12; sx < barrierW + 12; sx += 6) {
        ctx.fillStyle = (Math.floor(sx / 6) % 2 === 0) ? '#ef4444' : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(rx - 4 + sx, roadTop - 8);
        ctx.lineTo(rx - 4 + sx + 6, roadTop - 8);
        ctx.lineTo(rx - 4 + sx + 12, roadTop - 22);
        ctx.lineTo(rx - 4 + sx + 6, roadTop - 22);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Red reflector caps
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(rx - 4, roadTop - 28, 7, 3);
      ctx.fillRect(rx + 3, roadTop - 28, 7, 3);
    }
  }

  ctx.restore();

  if (isFinish) {
    ctx.save();
    const camStop = FINISH_ROAD_END - ROAD_END_STOP_X;
    const finishLineWx = camStop + FINISH_LINE_X;
    const characterWx = camStop + CHARACTER_X;
    const flX = finishLineWx - cam;
    const charX = characterWx - cam;

    // 1. Checkered Finish Line Strip across the asphalt road
    if (flX >= x - 20 && flX <= x + w + 20) {
      const stripW = 16;
      const cols = 2;
      const rows = 4;
      const cellW = stripW / cols;
      const cellH = bandH / rows;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 4;
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          ctx.fillStyle = ((c + r) % 2 === 0) ? '#ffffff' : '#0f172a';
          ctx.fillRect(flX - stripW / 2 + c * cellW, roadTop + r * cellH, cellW, cellH);
        }
      }
      ctx.fillStyle = '#facc15';
      ctx.fillRect(flX - stripW / 2 - 1.5, roadTop, 1.5, bandH);
      ctx.fillRect(flX + stripW / 2, roadTop, 1.5, bandH);
      ctx.restore();

      // 2. Two Finish Flags placed on sides of the finish line
      for (const side of [-1, 1]) {
        const poleX = flX + side * 15;
        const poleBaseY = roadTop + 2;
        const poleTopY = roadTop - 50;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.ellipse(poleX + 1, poleBaseY, 5, 2, 0, 0, 6.28);
        ctx.fill();

        // Silver pole
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(poleX - 1.5, poleTopY, 3, poleBaseY - poleTopY);

        // Gold finial sphere
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(poleX, poleTopY, 4, 0, 6.28);
        ctx.fill();

        // Waving checkered flag
        const flagW = 22 * side;
        const flagTop = poleTopY + 2;
        const flagH = 22;
        const fRows = 3, fCols = 3;
        const fSqW = flagW / fCols;
        const fSqH = flagH / fRows;
        for (let fc = 0; fc < fCols; fc++) {
          for (let fr = 0; fr < fRows; fr++) {
            const wave = Math.sin(fc * 0.8 + gameTime * 6) * 2;
            ctx.fillStyle = ((fc + fr) % 2 === 0) ? '#ffffff' : '#0f172a';
            ctx.fillRect(poleX + fc * fSqW, flagTop + fr * fSqH + wave, fSqW, fSqH);
          }
        }
      }
    }

    // 3. Cheering friendly character standing on the road at characterWx
    drawFinishCharacter(charX, roadTop);

    ctx.restore();
  }
}

// Dark gunmetal rail (thickness 0.28 * carVis = 12px) with rivets, lighter edge line and soft shadow
function drawWall(s, x) {
  const cfg = curConfig;
  const w = s.w + 1;
  const top = (s.curTop !== undefined) ? s.curTop : s.top;
  const bot = (s.curBot !== undefined) ? s.curBot : s.bot;
  if (s.isSlanted && s.top2 !== undefined) {
    drawSlantedRail(x, (top - 18) - RAIL_THICKNESS, x + s.w, (s.top2 - 18) - RAIL_THICKNESS, true, cfg);
    drawSlantedRail(x, bot + 18, x + s.w, s.bot2 + 18, false, cfg);
  } else {
    drawRailSegment(x, (top - 18) - RAIL_THICKNESS, w, true, cfg);
    drawRailSegment(x, bot + 18, w, false, cfg);
  }
}

function drawHexRivet(c, cx, cy, r) {
  c.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i * Math.PI) / 3;
    const hx = cx + r * Math.cos(a);
    const hy = cy + r * Math.sin(a);
    if (i === 0) c.moveTo(hx, hy);
    else c.lineTo(hx, hy);
  }
  c.closePath();
  c.fill();
}

function drawGearRivet(c, cx, cy, r) {
  const teeth = 6;
  c.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a = (i * Math.PI) / teeth;
    const rad = (i % 2 === 0) ? r : r * 0.68;
    const gx = cx + rad * Math.cos(a);
    const gy = cy + rad * Math.sin(a);
    if (i === 0) c.moveTo(gx, gy);
    else c.lineTo(gx, gy);
  }
  c.closePath();
  c.fill();
}

function drawSlantedRail(x1, y1, x2, y2, isCeiling, cfg) {
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = isCeiling ? -2 : 3;

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x2, y2 + RAIL_THICKNESS);
  ctx.lineTo(x1, y1 + RAIL_THICKNESS);
  ctx.closePath();

  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2) + RAIL_THICKNESS;
  const baseRailColor = (cfg && cfg.railColor) ? cfg.railColor : '#2d3748';
  const railGrad = ctx.createLinearGradient(0, minY, 0, maxY);
  if (isCeiling) {
    railGrad.addColorStop(0.0, '#0a0d14');
    railGrad.addColorStop(0.5, baseRailColor);
    railGrad.addColorStop(1.0, adjustColor(baseRailColor, 0.30));
  } else {
    railGrad.addColorStop(0.0, adjustColor(baseRailColor, 0.30));
    railGrad.addColorStop(0.5, baseRailColor);
    railGrad.addColorStop(1.0, '#0a0d14');
  }
  ctx.fillStyle = railGrad;
  ctx.fill();

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines along slope
  ctx.strokeStyle = isCeiling ? 'rgba(255, 255, 255, 0.85)' : '#0a0d14';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x1, y1 + (isCeiling ? RAIL_THICKNESS : 0));
  ctx.lineTo(x2, y2 + (isCeiling ? RAIL_THICKNESS : 0));
  ctx.stroke();

  ctx.strokeStyle = isCeiling ? '#0a0d14' : 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath();
  ctx.moveTo(x1, y1 + (isCeiling ? 0 : RAIL_THICKNESS));
  ctx.lineTo(x2, y2 + (isCeiling ? 0 : RAIL_THICKNESS));
  ctx.stroke();

  // Rivets along the slanted rail
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const rivetSteps = Math.floor(dist / RIVET_SPACING);
  const rivetStyle = (cfg && cfg.rivetStyle) ? cfg.rivetStyle : 'round';

  for (let k = 1; k < rivetSteps; k++) {
    const t = k / rivetSteps;
    const rx = x1 + (x2 - x1) * t;
    const ry = (y1 + (y2 - y1) * t) + RAIL_THICKNESS / 2;
    if (rivetStyle === 'hex') {
      ctx.fillStyle = '#cbd5e1';
      drawHexRivet(ctx, rx, ry, 2.5);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(rx, ry, 0.8, 0, Math.PI * 2); ctx.fill();
    } else if (rivetStyle === 'gear') {
      ctx.fillStyle = '#94a3b8';
      drawGearRivet(ctx, rx, ry, 2.8);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(rx, ry, 0.9, 0, Math.PI * 2); ctx.fill();
    } else {
      const grad = ctx.createRadialGradient(rx - 0.7, ry - 0.7, 0.3, rx, ry, 2.3);
      grad.addColorStop(0.0, '#ffffff');
      grad.addColorStop(0.5, '#cbd5e1');
      grad.addColorStop(1.0, '#334155');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(rx, ry, 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawObstacles(s, screenX, cfg) {
  if (!s.obstacles || s.obstacles.length === 0) return;
  for (const obs of s.obstacles) {
    const ox = obs.x - cam;
    if (ox + obs.w < -60 || ox > W + 60) continue;

    if (obs.type === 'gate') {
      // Upper Bar down to obs.gapTop
      ctx.save();
      ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
      ctx.shadowBlur = 6;
      const topH = Math.max(10, obs.gapTop);
      const gateGrad = ctx.createLinearGradient(ox, 0, ox + obs.w, 0);
      gateGrad.addColorStop(0, '#1e293b');
      gateGrad.addColorStop(0.3, cfg.railColor || '#64748b');
      gateGrad.addColorStop(0.7, cfg.railColor || '#64748b');
      gateGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = gateGrad;
      ctx.fillRect(ox, 0, obs.w, topH);

      // Warning hazard stripes on upper bar
      ctx.fillStyle = 'rgba(234, 179, 8, 0.85)';
      for (let sy = 12; sy < topH - 8; sy += 18) {
        ctx.fillRect(ox + 3, sy, obs.w - 6, 6);
      }
      // Spikes at bottom lip of upper gate bar
      const spCount = Math.floor(obs.w / 12);
      for (let k = 0; k < spCount; k++) {
        drawSpike(ox + k * 12, obs.gapTop - 18, true, { h: 14, size: 'small' }, k);
      }

      // Lower Bar from obs.gapBot down to H
      const botH = Math.max(10, H - obs.gapBot);
      ctx.fillStyle = gateGrad;
      ctx.fillRect(ox, obs.gapBot, obs.w, botH);

      // Warning stripes on lower bar
      ctx.fillStyle = 'rgba(234, 179, 8, 0.85)';
      for (let sy = obs.gapBot + 8; sy < H - 8; sy += 18) {
        ctx.fillRect(ox + 3, sy, obs.w - 6, 6);
      }
      // Spikes at top lip of lower gate bar
      for (let k = 0; k < spCount; k++) {
        drawSpike(ox + k * 12, obs.gapBot + 18, false, { h: 14, size: 'small' }, k);
      }

      // Portal energy glow between bars
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
      ctx.fillRect(ox - 4, obs.gapTop, obs.w + 8, obs.gapBot - obs.gapTop);
      ctx.restore();

    } else if (obs.type === 'stalactite') {
      ctx.save();
      const toothW = obs.w;
      const topH = Math.max(12, obs.tipY);
      const grad = ctx.createLinearGradient(ox, 0, ox + toothW, 0);
      grad.addColorStop(0, '#1e293b');
      grad.addColorStop(0.5, cfg.railColor || '#64748b');
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(ox, 0);
      ctx.lineTo(ox + toothW, 0);
      ctx.lineTo(ox + toothW * 0.7, topH - 12);
      ctx.lineTo(ox + toothW / 2, topH);
      ctx.lineTo(ox + toothW * 0.3, topH - 12);
      ctx.closePath();
      ctx.fill();
      drawSpike(ox + (toothW - 12) / 2, obs.tipY - 18, true, { h: 20, size: 'medium' }, 0);
      ctx.restore();

    } else if (obs.type === 'stalagmite') {
      ctx.save();
      const toothW = obs.w;
      const grad = ctx.createLinearGradient(ox, 0, ox + toothW, 0);
      grad.addColorStop(0, '#1e293b');
      grad.addColorStop(0.5, cfg.railColor || '#64748b');
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(ox, H);
      ctx.lineTo(ox + toothW, H);
      ctx.lineTo(ox + toothW * 0.7, obs.tipY + 12);
      ctx.lineTo(ox + toothW / 2, obs.tipY);
      ctx.lineTo(ox + toothW * 0.3, obs.tipY + 12);
      ctx.closePath();
      ctx.fill();
      drawSpike(ox + (toothW - 12) / 2, obs.tipY + 18, false, { h: 20, size: 'medium' }, 0);
      ctx.restore();

    } else if (obs.type === 'floating_block') {
      ctx.save();
      ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
      ctx.shadowBlur = 8;
      const bGrad = ctx.createLinearGradient(0, obs.y, 0, obs.y + obs.h);
      bGrad.addColorStop(0, '#ffffff');
      bGrad.addColorStop(0.2, cfg.railColor || '#475569');
      bGrad.addColorStop(0.8, '#1e293b');
      bGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = bGrad;
      roundRect(ctx, ox, obs.y, obs.w, obs.h, 6);
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // Outline
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.8;
      roundRect(ctx, ox, obs.y, obs.w, obs.h, 6);
      ctx.stroke();

      // Warning hazard stripe center
      ctx.fillStyle = 'rgba(234, 179, 8, 0.85)';
      ctx.fillRect(ox + 8, obs.y + obs.h / 2 - 2, obs.w - 16, 4);

      // Spikes on top and bottom of island
      const numSp = Math.floor((obs.w - 12) / 12);
      for (let k = 0; k < numSp; k++) {
        drawSpike(ox + 6 + k * 12, obs.y + 18, false, { h: 14, size: 'small' }, k);
        drawSpike(ox + 6 + k * 12, obs.y + obs.h - 18, true, { h: 14, size: 'small' }, k);
      }
      ctx.restore();

    } else if (obs.type === 'saw_blade') {
      // 1. SAW BLADE (spinning circular saw, telegraphed glow, rail/open-air slide)
      const slide = (obs.slideDist || 0) * Math.sin((gameTime + (obs.slidePhase || 0)) * 2 * Math.PI / (obs.slidePeriod || 3.0));
      const curWx = obs.x + slide;
      const sox = curWx - cam;
      if (sox + obs.radius < -40 || sox - obs.radius > W + 40) continue;

      ctx.save();
      // Draw slide track if moving
      if (obs.slideDist > 0) {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(obs.x - obs.slideDist - cam, obs.y);
        ctx.lineTo(obs.x + obs.slideDist - cam, obs.y);
        ctx.stroke();
      }

      // Teeth glow in stage accent color
      ctx.shadowColor = cfg.accentColor || '#38bdf8';
      ctx.shadowBlur = 8;

      ctx.translate(sox, obs.y);
      ctx.rotate(gameTime * 14 * (obs.dir || 1));
      const d = obs.radius * 2;
      if (sawBladeCanvas) {
        ctx.drawImage(sawBladeCanvas, -obs.radius, -obs.radius, d, d);
      } else {
        ctx.fillStyle = '#64748b';
        ctx.beginPath(); ctx.arc(0, 0, obs.radius, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

    } else if (obs.type === 'falling_spike') {
      // 2. FALLING SPIKE (shaking telegraph & thin warning line 0.7s before drop)
      const fx = obs.x - cam;
      if (fx < -40 || fx > W + 40) continue;

      if (obs.state === 'warning') {
        // Thin glowing warning line down to safe depth
        ctx.save();
        ctx.strokeStyle = cfg.accentColor || '#ef4444';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.globalAlpha = 0.5 + 0.4 * Math.sin((0.7 - obs.warnTimer) * 30);
        ctx.beginPath();
        ctx.moveTo(fx, obs.startY);
        ctx.lineTo(fx, obs.maxDepth);
        ctx.stroke();
        ctx.restore();

        // Shaking spike hanging from ceiling
        drawSpike(fx + (obs.shake || 0) - 6, obs.startY - 18, true, { h: obs.h || 28, size: 'big' }, 0);
      } else if (obs.state === 'falling') {
        // Motion trail
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(fx, obs.curY - 14);
        ctx.lineTo(fx, obs.curY - 2);
        ctx.stroke();
        ctx.restore();

        drawSpike(fx - 6, obs.curY - 18, true, { h: obs.h || 28, size: 'big' }, 0);
      } else if (obs.state === 'idle') {
        drawSpike(fx - 6, obs.startY - 18, true, { h: obs.h || 28, size: 'big' }, 0);
      }

    } else if (obs.type === 'laser_gate') {
      // 3. LASER GATE (top/bot emitters, 0.4s warning flicker before 0.8s lethal beam)
      const lx = obs.x - cam;
      if (lx < -40 || lx > W + 40) continue;

      ctx.save();
      // Draw emitter housings
      if (laserEmitterCanvas) {
        ctx.drawImage(laserEmitterCanvas, lx - 16, obs.topY - 18, 32, 20);
        ctx.save();
        ctx.translate(lx, obs.botY + 8);
        ctx.rotate(Math.PI);
        ctx.drawImage(laserEmitterCanvas, -16, -10, 32, 20);
        ctx.restore();
      }

      const t = (gameTime + obs.phase) % 1.4;
      if (t >= 0.2 && t < 0.6) {
        // Warning mode: thin flickering energy wire (not lethal)
        ctx.strokeStyle = cfg.accentColor || '#38bdf8';
        ctx.globalAlpha = 0.35 + 0.35 * Math.sin(gameTime * 50);
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(lx, obs.topY);
        ctx.lineTo(lx, obs.botY);
        ctx.stroke();
      } else if (t >= 0.6) {
        // Active lethal mode (0.8s on)
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = cfg.accentColor || '#38bdf8';
        ctx.globalAlpha = 0.85;
        ctx.fillRect(lx - 5, obs.topY, 10, obs.botY - obs.topY);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 1.0;
        ctx.fillRect(lx - 1.8, obs.topY, 3.6, obs.botY - obs.topY);

        // Discharge plasma nodes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(lx, obs.topY + 3, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(lx, obs.botY - 3, 4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

    } else if (obs.type === 'pendulum') {
      // 4. PENDULUM (spiked ball on chain swinging from ceiling, >= 3.0 carH floor clearance)
      const anchorSx = obs.anchorX - cam;
      const anchorSy = obs.anchorY;
      const theta = obs.maxAngle * Math.sin((gameTime + obs.phase) * 2 * Math.PI / obs.period);
      const ballWx = obs.anchorX + obs.length * Math.sin(theta);
      const ballWy = obs.anchorY + obs.length * Math.cos(theta);
      const ballSx = ballWx - cam;
      const ballSy = ballWy;

      if (Math.min(anchorSx, ballSx) < -60 || Math.max(anchorSx, ballSx) > W + 60) continue;

      ctx.save();
      // Ceiling anchor
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(anchorSx - 8, anchorSy - 3, 16, 6);

      // Steel chain
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(anchorSx, anchorSy);
      ctx.lineTo(ballSx, ballSy);
      ctx.stroke();

      // Spiked wrecking ball
      ctx.translate(ballSx, ballSy);
      ctx.rotate(theta);
      const bd = obs.radius * 2;
      if (pendulumBallCanvas) {
        ctx.drawImage(pendulumBallCanvas, -obs.radius, -obs.radius, bd, bd);
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath(); ctx.arc(0, 0, obs.radius, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

    } else if (obs.type === 'air_current') {
      // 5. AIR CURRENT (glowing wind tunnel, gentle push, reward coin trail)
      const ax = obs.x - cam;
      if (ax + obs.w < -40 || ax > W + 40) continue;

      ctx.save();
      const grad = ctx.createLinearGradient(ax, 0, ax + obs.w, 0);
      grad.addColorStop(0, 'rgba(56, 189, 248, 0)');
      grad.addColorStop(0.2, 'rgba(56, 189, 248, 0.12)');
      grad.addColorStop(0.8, 'rgba(56, 189, 248, 0.12)');
      grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(ax, obs.yTop, obs.w, obs.yBot - obs.yTop);

      // Flowing chevrons
      ctx.strokeStyle = cfg.accentColor || '#38bdf8';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.45;
      const flowOff = (gameTime * 70 * obs.pushDir) % 36;
      for (let cx = ax + 24; cx < ax + obs.w - 20; cx += 50) {
        for (let cy = obs.yTop + 24; cy < obs.yBot - 16; cy += 36) {
          const chevY = cy + flowOff;
          if (chevY > obs.yTop + 10 && chevY < obs.yBot - 10) {
            ctx.beginPath();
            if (obs.pushDir < 0) {
              // Pointing up
              ctx.moveTo(cx - 6, chevY + 4); ctx.lineTo(cx, chevY - 4); ctx.lineTo(cx + 6, chevY + 4);
            } else {
              // Pointing down
              ctx.moveTo(cx - 6, chevY - 4); ctx.lineTo(cx, chevY + 4); ctx.lineTo(cx + 6, chevY - 4);
            }
            ctx.stroke();
          }
        }
      }
      ctx.restore();

    } else if (obs.type === 'boost_ring') {
      // 6. BOOST RING (glowing toroid in stage accent color)
      if (obs.collected) continue;
      const rx = obs.x - cam;
      if (rx + obs.radius < -40 || rx - obs.radius > W + 40) continue;

      ctx.save();
      ctx.translate(rx, obs.y);
      const pulse = 1.0 + 0.08 * Math.sin(gameTime * 8);
      ctx.scale(pulse, pulse);
      const rd = obs.radius * 2;
      if (boostRingCanvas) {
        ctx.drawImage(boostRingCanvas, -obs.radius, -obs.radius, rd, rd);
      } else {
        ctx.strokeStyle = cfg.accentColor || '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, obs.radius, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawRailSegment(x, y, w, isCeiling, cfg) {
  ctx.save();
  // Soft shadow so rails stand out clearly against bright sky picture
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = isCeiling ? -2 : 3;

  const baseRailColor = (cfg && cfg.railColor) ? cfg.railColor : '#2d3748';
  const railGrad = ctx.createLinearGradient(0, y, 0, y + RAIL_THICKNESS);
  if (isCeiling) {
    railGrad.addColorStop(0.0, '#0a0d14');
    railGrad.addColorStop(0.5, baseRailColor);
    railGrad.addColorStop(1.0, adjustColor(baseRailColor, 0.30));
  } else {
    railGrad.addColorStop(0.0, adjustColor(baseRailColor, 0.30));
    railGrad.addColorStop(0.5, baseRailColor);
    railGrad.addColorStop(1.0, '#0a0d14');
  }
  ctx.fillStyle = railGrad;
  ctx.fillRect(x, y, w, RAIL_THICKNESS);

  ctx.shadowColor = 'transparent';

  // Lighter inner edge line and dark outer edge
  if (isCeiling) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fillRect(x, y + RAIL_THICKNESS - 1, w, 1);
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(x, y, w, 1);
  } else {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fillRect(x, y, w, 1);
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(x, y + RAIL_THICKNESS - 1, w, 1);
  }

  // End caps
  ctx.fillStyle = '#0a0d14';
  ctx.fillRect(x - 1, y, 2, RAIL_THICKNESS);
  ctx.fillRect(x + w - 1, y, 2, RAIL_THICKNESS);

  // Rivets spaced every RIVET_SPACING (23px)
  const centerY = y + RAIL_THICKNESS / 2;
  const startRivet = Math.floor(x / RIVET_SPACING) * RIVET_SPACING;
  const rivetStyle = (cfg && cfg.rivetStyle) ? cfg.rivetStyle : 'round';

  for (let rx = startRivet; rx <= x + w + RIVET_SPACING; rx += RIVET_SPACING) {
    if (rx < x + 3 || rx > x + w - 3) continue;
    if (rivetStyle === 'hex') {
      ctx.fillStyle = '#cbd5e1';
      drawHexRivet(ctx, rx, centerY, 2.5);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(rx, centerY, 0.8, 0, Math.PI * 2); ctx.fill();
    } else if (rivetStyle === 'gear') {
      ctx.fillStyle = '#94a3b8';
      drawGearRivet(ctx, rx, centerY, 2.8);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(rx, centerY, 0.9, 0, Math.PI * 2); ctx.fill();
    } else {
      // Classic round silver rivet with 3D radial gradient
      const grad = ctx.createRadialGradient(rx - 0.7, centerY - 0.7, 0.3, rx, centerY, 2.3);
      grad.addColorStop(0.0, '#ffffff');
      grad.addColorStop(0.5, '#cbd5e1');
      grad.addColorStop(1.0, '#334155');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(rx, centerY, 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawVerticalRailConnector(x, y1, y2, cfg) {
  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2) + RAIL_THICKNESS;
  const h = maxY - minY;
  if (h <= RAIL_THICKNESS) return;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;

  const baseRailColor = (cfg && cfg.railColor) ? cfg.railColor : '#2d3748';
  const railGrad = ctx.createLinearGradient(x - RAIL_THICKNESS / 2, 0, x + RAIL_THICKNESS / 2, 0);
  railGrad.addColorStop(0.0, '#0a0d14');
  railGrad.addColorStop(0.5, baseRailColor);
  railGrad.addColorStop(1.0, adjustColor(baseRailColor, 0.30));
  ctx.fillStyle = railGrad;
  ctx.fillRect(x - RAIL_THICKNESS / 2, minY, RAIL_THICKNESS, h);

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.fillRect(x + RAIL_THICKNESS / 2 - 1, minY, 1, h);
  ctx.fillStyle = '#0a0d14';
  ctx.fillRect(x - RAIL_THICKNESS / 2, minY, 1, h);

  // End caps
  ctx.fillStyle = '#0a0d14';
  ctx.fillRect(x - RAIL_THICKNESS / 2 - 1, minY - 1, RAIL_THICKNESS + 2, 2);
  ctx.fillRect(x - RAIL_THICKNESS / 2 - 1, maxY - 1, RAIL_THICKNESS + 2, 2);

  // Rivets spaced every RIVET_SPACING (23px)
  const centerX = x;
  const startRivetY = Math.floor(minY / RIVET_SPACING) * RIVET_SPACING;
  const rivetStyle = (cfg && cfg.rivetStyle) ? cfg.rivetStyle : 'round';

  for (let ry = startRivetY; ry <= maxY + RIVET_SPACING; ry += RIVET_SPACING) {
    if (ry < minY + 4 || ry > maxY - 4) continue;
    if (rivetStyle === 'hex') {
      ctx.fillStyle = '#cbd5e1';
      drawHexRivet(ctx, centerX, ry, 2.5);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(centerX, ry, 0.8, 0, Math.PI * 2); ctx.fill();
    } else if (rivetStyle === 'gear') {
      ctx.fillStyle = '#94a3b8';
      drawGearRivet(ctx, centerX, ry, 2.8);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(centerX, ry, 0.9, 0, Math.PI * 2); ctx.fill();
    } else {
      const grad = ctx.createRadialGradient(centerX - 0.7, ry - 0.7, 0.3, centerX, ry, 2.3);
      grad.addColorStop(0.0, '#ffffff');
      grad.addColorStop(0.5, '#cbd5e1');
      grad.addColorStop(1.0, '#334155');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(centerX, ry, 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSpike(x, baseY, isTop, sp, idx = 0, slope = 0) {
  if (!sp || !sp.h || sp.h <= 0) return;
  const sizeKey = sp.size || (sp.h <= SPIKE_H_SMALL ? 'small' : (sp.h <= SPIKE_H_MEDIUM ? 'medium' : 'big'));
  const fam = sp.family || (curConfig && curConfig.families ? curConfig.families[0] : 'classic');
  const cIdx = sp.colorIdx || 0;
  const dir = isTop ? 'top' : 'bot';
  const key = `${fam}_${cIdx}_${dir}_${sizeKey}`;
  const spr = spikeCanvases[key] ||
              spikeCanvases[`${fam}_0_${dir}_${sizeKey}`] ||
              spikeCanvases[`${sizeKey}_${dir}`] ||
              Object.values(spikeCanvases)[0];

  if (spr) {
    ctx.save();
    // 6. DEPTH: Thin soft dark shadow of spikes on rail (shadowColor rgba(0, 0, 0, 0.45), blur 3)
    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = isTop ? 1 : -1;

    if (slope !== 0) {
      ctx.translate(x + 6, baseY);
      ctx.rotate(slope);
      ctx.drawImage(spr, -27, isTop ? -6 : -58);
    } else {
      if (isTop) {
        ctx.drawImage(spr, x + 6 - 27, baseY - 6);
      } else {
        ctx.drawImage(spr, x + 6 - 27, baseY - 58);
      }
    }
    ctx.restore();

    // Soft tip glow pulsing slowly out of phase across the row
    const pulse = 0.35 + 0.35 * Math.sin(gameTime * 2.5 + idx * 0.4);
    if (pulse > 0.08) {
      const glowColor = (curConfig && curConfig.glowColor) ? curConfig.glowColor : '#ff8a1f';
      const tipY = baseY + (isTop ? sp.h : -sp.h);
      const glowX = x + 6;
      const glowR = Math.min(8, Math.max(4, sp.h * 0.22));

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(glowX, tipY, 0, glowX, tipY, glowR);
      g.addColorStop(0, hexToRgba(glowColor, pulse));
      g.addColorStop(0.5, hexToRgba(glowColor, pulse * 0.45));
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(glowX, tipY, glowR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// High-performance sports car wheel with realistic rubber tyre, stationary brake caliper & rotating chrome twin-spoke alloy rim
function drawSportsWheel(cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);

  // 1. Solid Tyre (Deep matte black rubber with realistic sidewall contour)
  ctx.fillStyle = '#0f1115';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Tyre outer edge definition
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath();
  ctx.arc(0, 0, r - ctx.lineWidth / 2, 0, Math.PI * 2);
  ctx.stroke();

  // Subtle tyre sidewall highlight band
  ctx.strokeStyle = '#262a33';
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
  ctx.stroke();

  // Inner tyre bead line
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(0.8, r * 0.04);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.77, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Wheel Cavity / Rim Barrel (Dark interior background behind spokes)
  ctx.fillStyle = '#14161a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.73, 0, Math.PI * 2);
  ctx.fill();

  // 3. Stationary Brake Assembly (Realistic: Caliper and Rotor do NOT spin with wheel)
  // Brake disc rotor (brushed steel)
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.56, 0, Math.PI * 2);
  ctx.fill();

  // Brake rotor groove ring
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.035);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.44, 0, Math.PI * 2);
  ctx.stroke();

  // High-performance Red Sports Brake Caliper (stationary at top quadrant)
  ctx.save();
  ctx.rotate(-0.58);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  const calW = r * 0.22;
  const calH = r * 0.38;
  const calX = r * 0.36;
  const calY = -calH / 2;
  if (ctx.roundRect) {
    ctx.roundRect(calX, calY, calW, calH, r * 0.05);
  } else {
    ctx.rect(calX, calY, calW, calH);
  }
  ctx.fill();
  // Caliper highlight bolt
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(calX + calW / 2, 0, Math.max(0.8, r * 0.035), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 4. Rotating Alloy Rim Lip & Spokes
  ctx.save();
  ctx.rotate(angle);

  // Outer chrome rim lip
  ctx.strokeStyle = '#f1f5f9';
  ctx.lineWidth = Math.max(1.2, r * 0.065);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.71, 0, Math.PI * 2);
  ctx.stroke();

  // Inner chrome bevel
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = Math.max(0.8, r * 0.03);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.67, 0, Math.PI * 2);
  ctx.stroke();

  // 5 Twin-Spoke High Performance Alloy Wheels (10 blades)
  const numPairs = 5;
  const innerR = r * 0.19;
  const outerR = r * 0.67;
  const spokeWidth = Math.max(1.2, r * 0.055);
  const splitOffset = 0.13;

  ctx.lineWidth = spokeWidth;
  ctx.lineCap = 'round';

  for (let i = 0; i < numPairs; i++) {
    const baseAng = (i * Math.PI * 2) / numPairs;

    for (const sign of [-1, 1]) {
      const spkAng = baseAng + sign * splitOffset;
      const cosA = Math.cos(spkAng);
      const sinA = Math.sin(spkAng);

      // Shaded metallic side
      ctx.strokeStyle = '#64748b';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR + sign * 0.4, sinA * innerR);
      ctx.lineTo(cosA * outerR + sign * 0.4, sinA * outerR);
      ctx.stroke();

      // Bright polished chrome face
      ctx.strokeStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR, sinA * innerR);
      ctx.lineTo(cosA * outerR, sinA * outerR);
      ctx.stroke();
    }
  }

  // 5. Central Wheel Hub & Lug Nuts
  // Chrome outer hub
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.03);
  ctx.stroke();

  // Center cap badge
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(0.7, r * 0.04), 0, Math.PI * 2);
  ctx.fill();

  // 5 Chrome Lug Nuts
  ctx.fillStyle = '#f8fafc';
  for (let l = 0; l < 5; l++) {
    const lugAng = (l * Math.PI * 2) / 5 + 0.31;
    const lx = Math.cos(lugAng) * (r * 0.175);
    const ly = Math.sin(lugAng) * (r * 0.175);
    ctx.beginPath();
    ctx.arc(lx, ly, Math.max(0.6, r * 0.026), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore(); // Restore wheel rotation
  ctx.restore(); // Restore wheel translation
}

function car(drawX = CAR_X) {
  const drawW = CAR_DRAW_W;
  const drawH = CAR_DRAW_H;
  // Align bottom of tires to the exact same ground baseline as the original car (cy + 24)
  const groundBaseline = cy + 24;
  const carCenterY = groundBaseline - drawH / 2;

  // Soft dark ground shadow under the car tires
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
  ctx.beginPath();
  ctx.ellipse(drawX, groundBaseline - 2, drawW * 0.42, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Soft blue glow ellipse on the road or air below the car (alpha 0.25)
  if (SHOW_FLAMES && flameIntensity > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glowY = carCenterY + drawH / 2 + 18;
    const glowW = drawW * 0.36;
    const glowH = 11;
    const glowGrad = ctx.createRadialGradient(drawX - 2, glowY, 0, drawX - 2, glowY, glowW);
    const alpha = 0.25 * flameIntensity;
    glowGrad.addColorStop(0, `rgba(56, 189, 248, ${alpha})`);
    glowGrad.addColorStop(0.5, `rgba(99, 102, 241, ${alpha * 0.5})`);
    glowGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.ellipse(drawX - 2, glowY, glowW, glowH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw car always horizontal (perfectly straight, no rotation or tilt)
  ctx.save();
  ctx.translate(drawX, carCenterY);

  // Jet thruster flames under the car (additive blending)
  if (SHOW_FLAMES && flameIntensity > 0.01) {
    drawJetFlames(ctx, drawW, drawH, gameTime);
  }

  if (trimmedCarCanvas) {
    // Soft dark outline shadow so white body stays clear on bright backgrounds
    ctx.shadowColor = CAR_SHADOW_COLOR;
    ctx.shadowBlur = CAR_SHADOW_BLUR;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.drawImage(trimmedCarCanvas, -drawW / 2, -drawH / 2, drawW, drawH);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;

    // Metal nozzle pods sliding out from under the body
    if (SHOW_FLAMES && podDeploy > 0.01) {
      drawThrusterPods(ctx, drawW, drawH);
    }

    // Dynamic rotating wheel rims copied from center of each wheel
    if (wheelSpritesReady && rearWheelSprite && frontWheelSprite) {
      try {
        const rearX = -drawW / 2 + drawW * WHEEL_REAR_X;
        const frontX = -drawW / 2 + drawW * WHEEL_FRONT_X;
        const wheelY = -drawH / 2 + drawH * WHEEL_Y;
        const rimR = drawW * WHEEL_SPIN_RADIUS;
        const rimD = rimR * 2;

        // Draw rear rim sprite concentric to axle (spins only the rim; tire & body arch stay static)
        ctx.save();
        ctx.translate(rearX, wheelY);
        ctx.rotate(wheelAngle);
        ctx.drawImage(rearWheelSprite, -rimR, -rimR, rimD, rimD);
        ctx.restore();

        // Draw front rim sprite concentric to axle (spins only the rim; tire & body arch stay static)
        ctx.save();
        ctx.translate(frontX, wheelY);
        ctx.rotate(wheelAngle);
        ctx.drawImage(frontWheelSprite, -rimR, -rimR, rimD, rimD);
        ctx.restore();

        // Motion blur at high spin speed
        const isHighSpin = (Math.abs(currentAngularSpeed) > 12) || (thrustSpinMultiplier > 1.25);
        if (isHighSpin) {
          const blurOffset = 0.08 * (currentAngularSpeed >= 0 ? 1 : -1);
          ctx.save();
          ctx.globalAlpha = 0.35;
          ctx.translate(rearX, wheelY);
          ctx.rotate(wheelAngle - blurOffset);
          ctx.drawImage(rearWheelSprite, -rimR, -rimR, rimD, rimD);
          ctx.restore();

          ctx.save();
          ctx.globalAlpha = 0.35;
          ctx.translate(frontX, wheelY);
          ctx.rotate(wheelAngle - blurOffset);
          ctx.drawImage(frontWheelSprite, -rimR, -rimR, rimD, rimD);
          ctx.restore();
        }

        // Debug green circles at wheel positions (false by default)
        if (SHOW_WHEEL_DEBUG) {
          ctx.save();
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = '#00ff00';
          // Rim circles
          ctx.beginPath();
          ctx.arc(rearX, wheelY, rimR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(frontX, wheelY, rimR, 0, Math.PI * 2);
          ctx.stroke();
          // Tire circles
          const tireR = drawW * WHEEL_RADIUS;
          ctx.beginPath();
          ctx.arc(rearX, wheelY, tireR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(frontX, wheelY, tireR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      } catch (err) {
        console.warn('Failed to render wheel sprites:', err);
      }
    }
  } else {
    // Fallback to drawn car if image fails to load
    if (SHOW_FLAMES && podDeploy > 0.01) {
      drawThrusterPods(ctx, drawW, drawH);
    }
    ctx.scale(CAR_SCALE, CAR_SCALE);
    renderCarBody(wheelRot);
  }
  ctx.restore();
}

// Background drawing: clean cinematic background with 3 parallax silhouettes, haze, particles, tunnel dark gradient and vignette
function drawParallaxLayer(layerCanv, rate) {
  if (!layerCanv) return;
  const unitW = layerCanv.width;
  const scrollX = cam * rate;
  const relX = -((scrollX % unitW + unitW) % unitW);
  ctx.drawImage(layerCanv, relX, 0);
  if (relX + unitW < W) {
    ctx.drawImage(layerCanv, relX + unitW, 0);
  }
  if (relX > 0) {
    ctx.drawImage(layerCanv, relX - unitW, 0);
  }
}

function drawPreRenderedStage(bgData) {
  if (bgData.gradient) {
    ctx.drawImage(bgData.gradient, 0, 0);
  }
  drawParallaxLayer(bgData.far, 0.08);
  drawParallaxLayer(bgData.mid, 0.14);
  drawParallaxLayer(bgData.near, 0.22);
}

function drawStageScene(stageNum, alpha = 1) {
  const stageIdx = (stageNum - 1) % STAGES.length;
  const stage = STAGES[stageIdx];
  const bgData = stageBgCanvases[stageIdx];

  ctx.save();
  ctx.globalAlpha = alpha;

  const pic = (stage.backgroundPicture && stage.backgroundPicture.length > 0) ? getLevelPicture(curLevel) : getLevelPicture(curLevel);
  if (pic && pic.seamlessCanvas) {
    const unitW = pic.unitW;
    const scrollX = cam * 0.15;
    const relX = -((scrollX % unitW + unitW) % unitW);
    ctx.drawImage(pic.seamlessCanvas, relX, 0);
    if (relX + unitW < W) ctx.drawImage(pic.seamlessCanvas, relX + unitW, 0);
    if (relX > 0) ctx.drawImage(pic.seamlessCanvas, relX - unitW, 0);
  } else if (bgData) {
    drawPreRenderedStage(bgData);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, stage.gradientTop);
    grad.addColorStop(1, stage.gradientBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  drawStageParticles(stage, alpha);
  ctx.restore();
}

function drawBackground() {
  if (bgCrossFadeTimer > 0 && prevBgStage !== currentBgStage) {
    const fade = 1 - Math.max(0, Math.min(1, bgCrossFadeTimer / 0.6));
    drawStageScene(prevBgStage, 1);
    drawStageScene(currentBgStage, fade);
  } else {
    drawStageScene(currentBgStage, 1);
  }

  // Slight dark gradient behind the tunnel area (about 25 percent black, soft edges)
  const tunnelGrad = ctx.createLinearGradient(0, H * 0.12, 0, H * 0.88);
  tunnelGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  tunnelGrad.addColorStop(0.25, 'rgba(0, 0, 0, 0.25)');
  tunnelGrad.addColorStop(0.75, 'rgba(0, 0, 0, 0.25)');
  tunnelGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = tunnelGrad;
  ctx.fillRect(0, H * 0.12, W, H * 0.76);

  // Soft vignette on the screen edges
  if (vignetteCanvas) {
    ctx.drawImage(vignetteCanvas, 0, 0);
  }
}


// ==========================================
// GAME LOOP (STEP & DRAW)
// ==========================================
function step(dt) {
  const sp = speed();
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) toastMsg = null;
  }

  if (st === 'loading') {
    loadingTimer += dt;
    loadingWheelRot += dt * 14;

    // Hard timeout check: after 6 seconds, stop waiting and continue with fallbacks
    if (loadingTimer >= 6.0 && !assetsFinished) {
      console.warn('Hard timeout reached (6s); continuing with fallback visuals');
      assetsFinished = true;
    }

    if (!assetsFinished) {
      // 1. LOADING PROGRESS: progress = max(realProgress, timeProgress)
      // realProgress = (number of finished assets) / (total assets)
      // timeProgress = elapsedSeconds / 2.5, capped at 0.95
      const realProgress = totalAssets > 0 ? (finishedAssetsCount / totalAssets) : 1;
      const timeProgress = Math.min(0.95, loadingTimer / 2.5);
      const targetProgress = Math.max(realProgress, timeProgress);

      // Animate displayed value toward target, never jump backwards
      visualLoadProgress = Math.max(visualLoadProgress, Math.min(targetProgress, visualLoadProgress + dt * 0.8));
      progressAtFinish = visualLoadProgress;
    } else {
      // 4. FINISH: When all assets are finished (or after timeout), fill the bar smoothly to 100% in about 0.4s
      finishFillTimer += dt;
      const fillT = Math.min(1, finishFillTimer / 0.4);
      visualLoadProgress = Math.max(visualLoadProgress, progressAtFinish + (1 - progressAtFinish) * fillT);

      // Show "100%", hold for 0.3 seconds, then fade out into main menu
      if (visualLoadProgress >= 0.999) {
        visualLoadProgress = 1;
        holdTimer += dt;
        if (holdTimer >= 0.3) {
          loadingFade += dt / 0.4;
          if (loadingFade >= 1) {
            st = 'ready';
            menuFadeTimer = 0;
          }
        }
      }
    }
    return;
  }

  if (bgCrossFadeTimer > 0) {
    bgCrossFadeTimer = Math.max(0, bgCrossFadeTimer - dt);
  }
  const curStageIdx = (currentBgStage - 1) % STAGES.length;
  updateStageParticles(dt, STAGES[curStageIdx]);
  updateWindSound(dt, sp);

  // Coin combo reset & counter bump decay
  if (coinComboTimer > 0) {
    coinComboTimer -= dt;
    if (coinComboTimer <= 0) coinCombo = 0;
  }
  if (coinCounterBump > 1.0) {
    coinCounterBump = Math.max(1.0, coinCounterBump - dt * 2.5);
  }

  // Update flying coins
  for (let i = flyingCoins.length - 1; i >= 0; i--) {
    const fc = flyingCoins[i];
    fc.t += dt / fc.dur;
    if (fc.t >= 1.0) {
      flyingCoins.splice(i, 1);
      coinCounterBump = 1.35;
    } else if (fc.t > 0) {
      const t = fc.t;
      const ease = t * t * (3 - 2 * t);
      fc.curX = fc.startX + (fc.endX - fc.startX) * ease;
      fc.curY = fc.startY + (fc.endY - fc.startY) * ease;
    } else {
      fc.curX = fc.startX;
      fc.curY = fc.startY;
    }
  }

  // Update coin sparkles
  for (let i = coinSparkles.length - 1; i >= 0; i--) {
    const spk = coinSparkles[i];
    spk.x += spk.vx * dt;
    spk.y += spk.vy * dt;
    spk.vy += 220 * dt;
    spk.life -= dt;
    if (spk.life <= 0) coinSparkles.splice(i, 1);
  }

  // Update floating +1 / +5 texts
  for (let i = coinFloatTexts.length - 1; i >= 0; i--) {
    const ft = coinFloatTexts[i];
    ft.y -= 38 * dt;
    ft.timer -= dt;
    if (ft.timer <= 0) coinFloatTexts.splice(i, 1);
  }

  // Update collected coins pop animation
  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.collected && c.popTimer > 0) {
      c.popTimer = Math.max(0, c.popTimer - dt);
    }
  }

  // Coin collision detection during play
  if (st === 'play' && !stopping) {
    const carCX = cam + carDrawX;
    const carCY = cy;

    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.collected) continue;

      const dx = c.x - carCX;
      if (dx < -PICKUP_RADIUS || dx > PICKUP_RADIUS) continue;

      const dy = c.y - carCY;
      if (Math.hypot(dx, dy) <= PICKUP_RADIUS) {
        c.collected = true;
        c.popTimer = 0.22;
        const val = c.val || (c.type === 'gem' ? GEM_VALUE : ((c.type === 'gold') ? GOLD_VALUE : ((c.type === 'silver') ? SILVER_VALUE : BRONZE_VALUE)));
        levelCoinsCollected += val;
        wallet += val;
        saveWallet();
        playCoinPickupSound(c.type);

        const screenX = c.x - cam;
        const screenY = c.y;

        // Sparkle color matches coin metal
        const spkColor = (c.type === 'gem') ? '#38bdf8' : ((c.type === 'silver') ? '#e2e8f0' : '#fde047');
        for (let s = 0; s < 6; s++) {
          const spkAng = (s / 6) * Math.PI * 2 + (Math.random() * 0.4);
          const spkSpeed = rnd(40, 110);
          coinSparkles.push({
            x: screenX,
            y: screenY,
            vx: Math.cos(spkAng) * spkSpeed,
            vy: Math.sin(spkAng) * spkSpeed - 30,
            life: 0.32,
            maxLife: 0.32,
            size: rnd(2.0, 3.8),
            color: spkColor
          });
        }

        // Flying coin animation to HUD
        flyingCoins.push({
          startX: screenX,
          startY: screenY,
          curX: screenX,
          curY: screenY,
          endX: W - 55,
          endY: 50 + topInset,
          t: 0,
          dur: 0.35,
          type: c.type
        });

        // Floating real value text (clean numbers: +10, +50, +100):
        if (c.type === 'coin_10' || c.type === 'bronze' || !c.type || c.type === 'coin') {
          bronzeCoinsPicked++;
          if (bronzeCoinsPicked % 3 === 0) {
            coinFloatTexts.push({
              text: '+10',
              x: carDrawX,
              y: cy - 24,
              timer: 0.65,
              color: '#fde047'
            });
          }
        } else if (c.type === 'coin_50' || c.type === 'gold' || c.type === 'silver') {
          coinFloatTexts.push({
            text: '+50',
            x: carDrawX,
            y: cy - 24,
            timer: 0.65,
            color: '#fde047'
          });
        } else if (c.type === 'coin_100' || c.type === 'gem') {
          coinFloatTexts.push({
            text: '+100',
            x: carDrawX,
            y: cy - 24,
            timer: 0.65,
            color: '#ffffff'
          });
        }
      }
    }
  }

  if (st === 'ready') {
    cy = CAR_REST_Y;
    vy = 0;
    thrust = 0;
    cam = 0;
    menuFadeTimer += dt;
  } else if (st === 'transition') {
    transitionTimer += dt;
    cy = CAR_REST_Y;
    vy = 0;
    thrust = 0;
    cam = 0;
    const wheelRadiusPx = CAR_DRAW_W * WHEEL_RADIUS;
    if (wheelRadiusPx > 0) {
      currentAngularSpeed = sp / wheelRadiusPx;
      wheelAngle += currentAngularSpeed * dt;
      wheelRot = wheelAngle;
    }
    if (transitionTimer >= TITLE_CARD_DURATION) {
      st = 'play';
      hold = false;
      thrust = 0;
    }
  } else if (st === 'play') {
    const wx = cam + CAR_X;
    const progress = getLevelProgress();

    // 1. Player-controlled flight & landing (NO autopilot):
    // After the last spike, player keeps full control (thrust and sink work with normal physics).
    // Open area between last spike and finish road has no spikes and no crashes.
    if (finishRunStage === 'none') {
      if (hold) {
        thrust = Math.min(1, thrust + dt / THRUST_RISE_TIME);
      } else {
        thrust = Math.max(0, thrust - dt / THRUST_FALL_TIME);
      }
      const vertAccel = -LIFT_ACCEL * thrust + GRAVITY * (1 - thrust);
      vy += vertAccel * dt;
      vy *= Math.exp(-AIR_DRAG * dt);
      vy = Math.max(-MAX_UP_SPEED, Math.min(MAX_DOWN_SPEED, vy));
      cy += vy * dt;

      const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
      const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
      const onRoadPlatform = onStartPlatform || onFinishPlatform;

      if (onRoadPlatform) {
        if (!hold && cy >= CAR_REST_Y) {
          cy = CAR_REST_Y;
          vy = 0;
          thrust = 0;
        } else if (cy > CAR_REST_Y) {
          cy = CAR_REST_Y;
          if (vy > 0) vy = 0;
        }
      }

      // Safety fallback only if needed: if the road has passed under the car's front (near finish line)
      // and the car is still in the air, then, and only then, ease the car down gently to the road in about 0.6 seconds.
      const roadPassedFront = (wx >= finishLineWorldX - 100);
      if (roadPassedFront && cy < CAR_REST_Y) {
        if (safetyLandingTimer === 0) {
          safetyLandingStartY = cy;
        }
        safetyLandingTimer += dt;
        const safeT = Math.min(1.0, safetyLandingTimer / 0.6);
        const easeSafe = safeT * safeT * (3 - 2 * safeT);
        cy = safetyLandingStartY + (CAR_REST_Y - safetyLandingStartY) * easeSafe;
        if (safeT >= 1.0) {
          cy = CAR_REST_Y;
          vy = 0;
        }
      } else if (!roadPassedFront) {
        safetyLandingTimer = 0;
      }

      if (cy < 16) { cy = 16; vy = 0; }
      if (cy > H - 16) { cy = H - 16; vy = 0; }

      // Landing moment: as soon as car lands on finish road (tires touch asphalt), start finish run!
      if (wx >= FINISH_ROAD_X && cy >= CAR_REST_Y - 2) {
        finishRunStage = 'speed_run';
        finishRunTimer = 0;
        landingScrollSpeed = sp;
        cy = CAR_REST_Y;
        vy = 0;
        hold = false;
        thrust = 0;
        playWinSound();
      }
    }

    // 2. FINISH RUN EXECUTION:
    const camStop = FINISH_ROAD_END - ROAD_END_STOP_X;
    const easeDist = FINISH_RUN_SPEED * 0.5 * 0.5; // distance during 0.5s deceleration = 0.30 * W
    const wheelRadiusPx = CAR_DRAW_W * WHEEL_RADIUS;

    if (finishRunStage !== 'none') {
      hold = false;
      thrust = 0;
      cy = CAR_REST_Y;
      vy = 0;

      if (finishRunStage === 'speed_run') {
        finishRunTimer += dt;
        const accelT = Math.min(1.0, finishRunTimer / 0.5);
        const currentScrollSp = lerp(landingScrollSpeed, FINISH_RUN_SPEED, accelT);
        cam += currentScrollSp * dt;
        carDrawX = CAR_X;

        // Wheels spin at fastest speed
        if (wheelRadiusPx > 0) {
          const maxSpin = (FINISH_RUN_SPEED / wheelRadiusPx) * 2.5;
          wheelAngle += maxSpin * dt;
          wheelRot = wheelAngle;
        }

        // Subtle white dust at tires
        if (Math.random() < 0.45) {
          spawnTireDust();
        }

        if (cam >= camStop - easeDist) {
          finishRunStage = 'scroll_stopping';
          scrollStopTimer = 0;
          camEaseStart = cam;
          camEaseDist = camStop - cam;
        }
      } else if (finishRunStage === 'scroll_stopping') {
        scrollStopTimer += dt;
        const t = Math.min(1.0, scrollStopTimer / 0.5);
        const progressEase = 1 - Math.pow(1 - t, 2);
        cam = camEaseStart + camEaseDist * progressEase;
        carDrawX = CAR_X;

        const currentScrollSp = FINISH_RUN_SPEED * (1 - t);
        if (wheelRadiusPx > 0) {
          const spinRate = (currentScrollSp / wheelRadiusPx) * 2.5;
          wheelAngle += spinRate * dt;
          wheelRot = wheelAngle;
        }

        if (Math.random() < 0.35 * (1 - t)) {
          spawnTireDust();
        }

        if (t >= 1.0) {
          cam = camStop;
          finishRunStage = 'car_driving';
          carDriveTimer = 0;
        }
      } else if (finishRunStage === 'car_driving') {
        carDriveTimer += dt;
        const driveDuration = 1.35;
        const t = Math.min(1.0, carDriveTimer / driveDuration);
        const carTargetCenterX = CAR_STOP_FRONT_X - CAR_DRAW_W * 0.42;
        const totalDist = carTargetCenterX - CAR_X;
        const driveEase = 1 - Math.pow(1 - t, 2.8);
        carDrawX = CAR_X + totalDist * driveEase;

        if (wheelRadiusPx > 0 && t < 1.0) {
          const forwardVelocity = (totalDist * 2.8 * Math.pow(1 - t, 1.8)) / driveDuration;
          const spinRate = Math.max(0, forwardVelocity / wheelRadiusPx);
          wheelAngle += spinRate * dt;
          wheelRot = wheelAngle;
        }

        const carFrontScreenX = carDrawX + CAR_DRAW_W * 0.42;
        if (carFrontScreenX >= FINISH_LINE_X && !confettiStarted) {
          confettiStarted = true;
          initConfetti();
        }

        if (t >= 1.0) {
          finishRunStage = 'car_stopped';
          thumbsUpTimer = 0;
        }
      } else if (finishRunStage === 'car_stopped') {
        thumbsUpTimer += dt;
        carDrawX = CAR_STOP_FRONT_X - CAR_DRAW_W * 0.42;

        if (thumbsUpTimer >= 1.0 && !levelCompleted) {
          levelCompleted = true;
          st = 'level_complete';
          levelCompleteTimer = 0;
          levelJustCleared = curLevel;
          const ratio = levelCoinsTotal > 0 ? (levelCoinsCollected / levelCoinsTotal) : 1;
          earnedStars = 1;
          if (ratio >= 0.60) earnedStars = 2;
          if (ratio >= 0.90) earnedStars = 3;
          isPerfect = (levelCoinsTotal > 0 && levelCoinsCollected >= levelCoinsTotal);
          perfectBonusGiven = false;
          starSoundsPlayed = [false, false, false];
          saveStars(curLevel, earnedStars);
          const nextLvl = curLevel + 1;
          const clearScore = 100 * curLevel;
          if (clearScore > best) best = clearScore;
          saveProgress(curLevel, Math.max(highestLevel, nextLvl), best);
        }
      }
    } else {
      cam += sp * dt;
      carDrawX = CAR_X;
      if (wheelRadiusPx > 0) {
        currentAngularSpeed = (sp / wheelRadiusPx) * (hold ? 2.2 : 1.0);
        wheelAngle += currentAngularSpeed * dt;
        wheelRot = wheelAngle;
      }
    }

    const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
    const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
    const onRoadPlatform = onStartPlatform || onFinishPlatform;
    const isCarOnRoad = onRoadPlatform && (cy >= CAR_REST_Y - 2);
    const isCarInAir = !isCarOnRoad;

    const isFlying = (hold && isCarInAir && st === 'play' && !autoLanding && !stopping);
    if (isFlying) {
      if (!isFlySoundPlaying) {
        startFlySound();
      }
    } else {
      if (isFlySoundPlaying) {
        stopFlySound();
      }
    }

    // Jet thrusters and flames (replaces white smoke puffs)
    const isThrustFlying = (hold && isCarInAir && st === 'play' && !autoLanding && !stopping);
    if (isThrustFlying) {
      podDeploy = Math.min(1.0, podDeploy + dt / POD_SLIDE_TIME);
      flameIntensity = Math.min(1.0, flameIntensity + dt / 0.12);
    } else {
      podDeploy = Math.max(0.0, podDeploy - dt / POD_SLIDE_TIME);
      flameIntensity = Math.max(0.0, flameIntensity - dt / FLAME_FADE_OUT_TIME);
    }
    // Hard check: never allow flames or sparks when car is resting or driving on the road
    if (isCarOnRoad) {
      flameIntensity = 0.0;
      podDeploy = Math.max(0.0, podDeploy - dt / POD_SLIDE_TIME);
    }

    if (SHOW_FLAMES && flameIntensity > 0.05 && isCarInAir) {
      sparkSpawnTimer += dt;
      if (sparkSpawnTimer >= 0.04) {
        sparkSpawnTimer -= 0.04;
        const drawW = CAR_DRAW_W;
        const drawH = CAR_DRAW_H;
        const carCenterY = (cy + 24) - drawH / 2;
        const nIdx = Math.floor(Math.random() * NOZZLE_X.length);
        const nx = -drawW / 2 + drawW * NOZZLE_X[nIdx];
        const baseNozzleY = -drawH / 2 + drawH * NOZZLE_Y;
        const podH = drawH * 0.05;
        const nozzleLipY = carCenterY + baseNozzleY + podH * podDeploy;
        const flameLen = NOZZLE_LEN[nIdx] * drawH * (0.35 + 0.65 * flameIntensity);
        spawnSpark(CAR_X + nx, nozzleLipY, flameLen, sp);
      }
    }
    updateSparks(dt, sp);
    if (boostTimer > 0) {
      boostTimer = Math.max(0, boostTimer - dt);
    }
    updateHazardParticles(dt);
    updateFloatingTexts(dt);
    gameTime += dt;
    for (const s of segs) {
      if (s.moving) {
        const moveY = Math.sin(gameTime * s.moveSpeed + s.movePhase) * s.moveAmp;
        s.curTop = s.top + moveY;
        s.curBot = s.bot + moveY;
      } else {
        s.curTop = s.top;
        s.curBot = s.bot;
      }

      // Update interactive hazard states (falling spikes, boost rings, air currents)
      if (s.obstacles && s.obstacles.length > 0) {
        for (const obs of s.obstacles) {
          if (obs.type === 'falling_spike') {
            if (obs.state === 'idle') {
              const distToSpike = obs.x - wx;
              if (distToSpike > 0 && distToSpike <= sp * 1.5 && (!activeFallingSpike || activeFallingSpike === obs) && boostTimer <= 1.0) {
                activeFallingSpike = obs;
                obs.state = 'warning';
                obs.warnTimer = 0.7;
              }
            } else if (obs.state === 'warning') {
              obs.warnTimer -= dt;
              obs.shake = Math.sin((0.7 - obs.warnTimer) * 45) * 2.2;
              if (obs.warnTimer <= 0) {
                obs.state = 'falling';
                obs.velY = 0;
                obs.shake = 0;
              }
            } else if (obs.state === 'falling') {
              obs.velY += 1200 * dt;
              obs.curY += obs.velY * dt;
              if (obs.curY >= obs.maxDepth) {
                obs.state = 'shattered';
                spawnHazardShards(obs.x, obs.curY, (curConfig && curConfig.accentColor) || '#cbd5e1');
                if (activeFallingSpike === obs) activeFallingSpike = null;
              }
            }
          } else if (obs.type === 'boost_ring' && !obs.collected) {
            if (Math.abs(wx - obs.x) < 26 && Math.abs(cy - obs.y) < obs.radius + 16) {
              obs.collected = true;
              boostTimer = 2.0;
              playBoostSound();
              spawnFloatingText('BOOST!', CAR_X, cy - 28, '#38bdf8');
              spawnHazardShards(obs.x, obs.y, '#38bdf8');
            }
          } else if (obs.type === 'air_current') {
            if (wx >= obs.x && wx <= obs.x + obs.w && cy >= obs.yTop - 20 && cy <= obs.yBot + 20) {
              vy += obs.pushDir * obs.strength * dt;
            }
          }
        }
      }
    }

    for (const s of segs) {
      // Crash cannot happen after the last spike or during finish run
      if (stopping || autoLanding || wx >= TUNNEL_END_X) break;

      // Obstacles collision check (gates, stalactites, stalagmites, floating blocks, hazards)
      if (s.obstacles && s.obstacles.length > 0) {
        let obsHit = false;
        for (const obs of s.obstacles) {
          const obsW = obs.w || (obs.radius ? obs.radius * 2 : 24);
          if (wx + HITBOX_HALF_W > obs.x - obsW / 2 && wx - HITBOX_HALF_W < obs.x + obsW / 2) {
            if (obs.type === 'gate') {
              if (cy - HITBOX_TOP_OFFSET < obs.gapTop - 4 || cy + HITBOX_BOT_OFFSET > obs.gapBot + 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'stalactite') {
              if (cy - HITBOX_TOP_OFFSET < obs.tipY - 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'stalagmite') {
              if (cy + HITBOX_BOT_OFFSET > obs.tipY + 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'floating_block') {
              if (cy - HITBOX_TOP_OFFSET < obs.y + obs.h - 4 && cy + HITBOX_BOT_OFFSET > obs.y + 4) {
                obsHit = true; break;
              }
            } else if (obs.type === 'saw_blade') {
              const slide = (obs.slideDist || 0) * Math.sin((gameTime + (obs.slidePhase || 0)) * 2 * Math.PI / (obs.slidePeriod || 3.0));
              const curX = obs.x + slide;
              const cxClamped = Math.max(wx - HITBOX_HALF_W, Math.min(curX, wx + HITBOX_HALF_W));
              const cyClamped = Math.max(cy - HITBOX_TOP_OFFSET, Math.min(obs.y, cy + HITBOX_BOT_OFFSET));
              const d2 = (curX - cxClamped) ** 2 + (obs.y - cyClamped) ** 2;
              if (d2 < (obs.radius * 0.9) ** 2) {
                obsHit = true; break;
              }
            } else if (obs.type === 'falling_spike') {
              if (obs.state === 'falling') {
                if (cy + HITBOX_BOT_OFFSET > obs.curY && cy - HITBOX_TOP_OFFSET < obs.curY + (obs.h || 28) - 6) {
                  obsHit = true; break;
                }
              }
            } else if (obs.type === 'laser_gate') {
              const t = (gameTime + obs.phase) % 1.4;
              if (t >= 0.6 && boostTimer <= 1.0) {
                if (cy >= obs.topY && cy <= obs.botY) {
                  obsHit = true; break;
                }
              }
            } else if (obs.type === 'pendulum') {
              const theta = obs.maxAngle * Math.sin((gameTime + obs.phase) * 2 * Math.PI / obs.period);
              const bx = obs.anchorX + obs.length * Math.sin(theta);
              const by = obs.anchorY + obs.length * Math.cos(theta);
              const cxClamped = Math.max(wx - HITBOX_HALF_W, Math.min(bx, wx + HITBOX_HALF_W));
              const cyClamped = Math.max(cy - HITBOX_TOP_OFFSET, Math.min(by, cy + HITBOX_BOT_OFFSET));
              const d2 = (bx - cxClamped) ** 2 + (by - cyClamped) ** 2;
              if (d2 < (obs.radius * 0.9) ** 2) {
                obsHit = true; break;
              }
            }
          }
        }
        if (obsHit) { die(); break; }
      }

      // Rails and spikes collision check
      const curTop = (s.curTop !== undefined) ? s.curTop : s.top;
      const curBot = (s.curBot !== undefined) ? s.curBot : s.bot;
      if (wx + HITBOX_HALF_W > s.x && wx - HITBOX_HALF_W < s.x + s.w && !s.isOpen) {
        if (s.isSlanted && s.top2 !== undefined && s.bot2 !== undefined) {
          const fracMid = Math.max(0, Math.min(1, (wx - s.x) / s.w));
          const effTop = curTop + (s.top2 - curTop) * fracMid;
          const effBot = curBot + (s.bot2 - curBot) * fracMid;
          if (cy - HITBOX_TOP_OFFSET < effTop - 18 || cy + HITBOX_BOT_OFFSET > effBot + 18) {
            die(); break;
          }
          let hit = false;
          const count = s.topSpikes ? s.topSpikes.length : 0;
          for (let i = 0; i < count; i++) {
            const spX = s.x + i * 12;
            if (wx + HITBOX_HALF_W > spX && wx - HITBOX_HALF_W < spX + 12) {
              const spFrac = Math.max(0, Math.min(1, (spX + 6 - s.x) / s.w));
              const localTop = curTop + (s.top2 - curTop) * spFrac;
              const localBot = curBot + (s.bot2 - curBot) * spFrac;
              const topTip = (localTop - 18) + s.topSpikes[i].h;
              const botTip = (localBot + 18) - s.botSpikes[i].h;
              if ((cy - HITBOX_TOP_OFFSET) < topTip - 6 || (cy + HITBOX_BOT_OFFSET) > botTip + 6) {
                hit = true; break;
              }
            }
          }
          if (hit) { die(); break; }
        } else {
          if (cy - HITBOX_TOP_OFFSET < curTop - 18 || cy + HITBOX_BOT_OFFSET > curBot + 18) { die(); break; }
          let hit = false;
          const count = s.topSpikes ? s.topSpikes.length : 0;
          for (let i = 0; i < count; i++) {
            const spX = s.x + i * 12;
            if (wx + HITBOX_HALF_W > spX && wx - HITBOX_HALF_W < spX + 12) {
              const topTip = (curTop - 18) + s.topSpikes[i].h;
              const botTip = (curBot + 18) - s.botSpikes[i].h;
              if ((cy - HITBOX_TOP_OFFSET) < topTip - 6 || (cy + HITBOX_BOT_OFFSET) > botTip + 6) {
                hit = true;
                break;
              }
            }
          }
          if (hit) { die(); break; }
        }
      }
    }
    if (stopping) {
      updateConfetti(dt);
    }
  } else if (st === 'level_complete') {
    levelCompleteTimer += dt;
    cy = CAR_REST_Y;
    vy = 0;
    updateConfetti(dt);
  }

  updateThrustAudio(dt);

  for (const p of parts) { p.l += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.l < p.m);
}

function drawLoadingScreen() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#38bdf8');
  bgGrad.addColorStop(1, '#0284c7');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawFluffyClouds(ctx, 180, 160, 1.4, 0.85);

  const carCenterX = W / 2;
  const bounceY = Math.sin(loadingTimer * 4.5) * 5.5;
  const carCenterY = H * 0.38 + bounceY;

  // Car centered at about 60 percent of screen width
  const loadW = Math.round(W * 0.60);
  const loadH = trimmedCarCanvas
    ? Math.round(loadW * (trimmedCarCanvas.height / trimmedCarCanvas.width))
    : Math.round(loadW * 0.42);
  const carScale = (W * 0.60) / 72;

  const carReady = (trimmedCarCanvas != null);
  const useFallback = !carReady && (carImgFailed || loadingTimer >= 1.5);

  if (carReady || useFallback) {
    ctx.save();
    ctx.globalAlpha = 1;

    // Soft dark-blue shadow under the car
    ctx.save();
    const shadowW = loadW * 0.44;
    const shadowH = 7.5;
    const shadowY = carCenterY + loadH * 0.45;
    const shadowGrad = ctx.createRadialGradient(carCenterX, shadowY, 2, carCenterX, shadowY, shadowW);
    shadowGrad.addColorStop(0, 'rgba(15, 23, 62, 0.45)');
    shadowGrad.addColorStop(0.55, 'rgba(15, 23, 62, 0.2)');
    shadowGrad.addColorStop(1, 'rgba(15, 23, 62, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(carCenterX, shadowY, shadowW, shadowH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.translate(carCenterX, carCenterY);

    // Very soft warm yellow glow behind the car
    ctx.save();
    const glowR = loadW * 0.54;
    const glowGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, glowR);
    glowGrad.addColorStop(0, 'rgba(253, 224, 71, 0.38)');
    glowGrad.addColorStop(0.5, 'rgba(250, 204, 21, 0.16)');
    glowGrad.addColorStop(1, 'rgba(250, 204, 21, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Thin animated speed lines behind the car
    ctx.save();
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const lineY = -loadH * 0.22 + i * (loadH * 0.16);
      const phase = (loadingTimer * 3.2 + i * 1.6) % 1;
      const startX = -loadW * 0.42 - phase * 55;
      const len = 22 + (i % 3) * 14;
      const lineAlpha = (0.25 + 0.4 * Math.sin(phase * Math.PI)).toFixed(2);
      const lineGrad = ctx.createLinearGradient(startX - len, 0, startX, 0);
      lineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      lineGrad.addColorStop(1, `rgba(255, 255, 255, ${lineAlpha})`);
      ctx.strokeStyle = lineGrad;
      ctx.beginPath();
      ctx.moveTo(startX - len, lineY);
      ctx.lineTo(startX, lineY);
      ctx.stroke();
    }
    ctx.restore();

    // White futuristic coupe car image
    if (trimmedCarCanvas) {
      ctx.shadowColor = CAR_SHADOW_COLOR;
      ctx.shadowBlur = CAR_SHADOW_BLUR;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.drawImage(trimmedCarCanvas, -loadW / 2, -loadH / 2, loadW, loadH);

      // Rotating rim sprites on loading screen
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      if (wheelSpritesReady && rearWheelSprite && frontWheelSprite) {
        const loadRearX = -loadW / 2 + loadW * WHEEL_REAR_X;
        const loadFrontX = -loadW / 2 + loadW * WHEEL_FRONT_X;
        const loadWheelY = -loadH / 2 + loadH * WHEEL_Y;
        const loadRimR = loadW * WHEEL_SPIN_RADIUS;
        const loadRimD = loadRimR * 2;

        ctx.save();
        ctx.translate(loadRearX, loadWheelY);
        ctx.rotate(loadingWheelRot);
        ctx.drawImage(rearWheelSprite, -loadRimR, -loadRimR, loadRimD, loadRimD);
        ctx.restore();

        ctx.save();
        ctx.translate(loadFrontX, loadWheelY);
        ctx.rotate(loadingWheelRot);
        ctx.drawImage(frontWheelSprite, -loadRimR, -loadRimR, loadRimD, loadRimD);
        ctx.restore();

        if (SHOW_WHEEL_DEBUG) {
          ctx.save();
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = '#00ff00';
          ctx.beginPath();
          ctx.arc(loadRearX, loadWheelY, loadRimR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(loadFrontX, loadWheelY, loadRimR, 0, Math.PI * 2);
          ctx.stroke();
          const loadTireR = loadW * WHEEL_RADIUS;
          ctx.beginPath();
          ctx.arc(loadRearX, loadWheelY, loadTireR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(loadFrontX, loadWheelY, loadTireR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      } else {
        const loadRearX = -loadW / 2 + loadW * WHEEL_REAR_X;
        const loadFrontX = -loadW / 2 + loadW * WHEEL_FRONT_X;
        const loadWheelY = -loadH / 2 + loadH * WHEEL_Y;
        const loadWheelR = loadW * WHEEL_SPIN_RADIUS;

        drawSportsWheel(loadRearX, loadWheelY, loadWheelR, loadingWheelRot);
        drawSportsWheel(loadFrontX, loadWheelY, loadWheelR, loadingWheelRot);
      }
    } else {
      ctx.scale(carScale, carScale);
      renderCarBody(loadingWheelRot);
    }

    ctx.restore();
  }

  // Game name under the car
  const titleY = carCenterY + loadH / 2 + 50;
  drawGlossyText('THORN RUSH', W / 2, titleY, 44, 'center', '#ffffff', '#0f172a', 7);

  // Loading bar and "Loading..." at the bottom
  const barW = W * 0.70;
  const barH = 18;
  const barX = W / 2 - barW / 2;
  const barY = H * 0.74;

  const pct = Math.min(100, Math.floor(visualLoadProgress * 100));
  drawGlossyText(`Loading... ${pct}%`, W / 2, barY - 14, 16, 'center', '#ffffff', '#0f172a', 4);

  // Background track
  ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
  roundRect(ctx, barX, barY, barW, barH, barH / 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  roundRect(ctx, barX, barY, barW, barH, barH / 2);
  ctx.stroke();

  // Progress follows real loading progress with car matching yellow-to-orange gradient
  const fillW = Math.max(barH, barW * visualLoadProgress);
  const fillGrad = ctx.createLinearGradient(0, barY, 0, barY + barH);
  fillGrad.addColorStop(0, '#fef08a');
  fillGrad.addColorStop(0.45, '#facc15');
  fillGrad.addColorStop(1, '#ea580c');
  ctx.fillStyle = fillGrad;
  roundRect(ctx, barX, barY, fillW, barH, barH / 2);
  ctx.fill();

  // Glossy highlight on loading bar
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, barX, barY, fillW, barH, barH / 2);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, barY, 0, barY + barH * 0.55);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.12)');
  ctx.fillStyle = glossGrad;
  ctx.fillRect(barX, barY, fillW, barH * 0.5);
  ctx.restore();

  // Tiny gray debug error message in corner if any error occurred
  if (loadingErrorMsg) {
    ctx.save();
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(100, 116, 139, 0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(String(loadingErrorMsg).slice(0, 48), 8, H - 8);
    ctx.restore();
  }
}

// ==========================================
// REAL CAMERA SPEED MEASUREMENT & DEBUG OVERLAY
// ==========================================
let camSamples = [];
let realSpeedWPerSec = 0;
let realSpeedPxPerSec = 0;

function updateRealSpeedMeasurement(nowSec) {
  camSamples.push({ t: nowSec, cam: cam });
  while (camSamples.length > 2 && camSamples[0].t < nowSec - 1.0) {
    camSamples.shift();
  }
  if (camSamples.length >= 2) {
    const oldest = camSamples[0];
    const newest = camSamples[camSamples.length - 1];
    const dtWindow = newest.t - oldest.t;
    if (dtWindow >= 0.08) {
      const dCam = newest.cam - oldest.cam;
      realSpeedPxPerSec = Math.max(0, dCam / dtWindow);
      realSpeedWPerSec = realSpeedPxPerSec / W;
    }
  }
}

  drawRoundGlossyButton(cx + cw - 12, cy + 12, 17, BUTTON_THEMES.red, 'close', isXPressed);

  // Play star sound when each star appears
  const starDelays = [0.35, 0.70, 1.05];
  for (let i = 0; i < 3; i++) {
    if (earnedStars >= (i + 1) && levelCompleteTimer >= starDelays[i] && !starSoundsPlayed[i]) {
      starSoundsPlayed[i] = true;
      playStarSound(i + 1);
    }
  }

  // Draw 3 stars with sequential pop animation
  const starCoords = [
    { x: W / 2 - 50, y: cy + 54, r: 19 },
    { x: W / 2,      y: cy + 42, r: 25 },
    { x: W / 2 + 50, y: cy + 54, r: 19 }
  ];

  for (let i = 0; i < 3; i++) {
    const sc = starCoords[i];
    const delay = starDelays[i];
    if (earnedStars >= (i + 1)) {
      if (levelCompleteTimer < delay) {
        drawEmptyStar(sc.x, sc.y, sc.r);
      } else {
        const t = (levelCompleteTimer - delay) / 0.22;
        let scale = 1.0;
        if (t < 1.0) {
          scale = 1.0 + 0.35 * Math.sin(t * Math.PI);
        }
        drawGoldStar(sc.x, sc.y, sc.r, scale);
      }
    } else {
      drawEmptyStar(sc.x, sc.y, sc.r);

    drawGoldenPerfectRibbon(W / 2, cy + 86, 210, 30);

          curY: ribY,
          endX: wX,
          endY: wY,
          t: -k * 0.045,
          dur: 0.52,
          type: 'coin'
        });

  // Quick count-up for "Coins: collected / total" with gold coin icon
  const countT = Math.min(1.0, levelCompleteTimer / 0.65);
  const displayedCoins = Math.min(levelCoinsCollected, Math.floor(countT * levelCoinsCollected));

  const coinCY = coinsRowY;

  if (coinFrames[curAnimFrame]) {
    const spr = coinFrames[curAnimFrame];
    const s = (coinR * 2.2) / spr.height;
    ctx.drawImage(spr, coinCX - (spr.width * s) / 2, coinCY - (spr.height * s) / 2, spr.width * s, spr.height * s);
  } else {
    ctx.save();
    ctx.beginPath();
    ctx.arc(coinCX, coinCY, coinR * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = '#fde047';
    ctx.fill();
    ctx.restore();
  }
  drawGlossyText(coinsText, coinCX + coinR + gap, coinCY + 1, 16, 'left', '#fde047', '#713f12', 3.0);

  // Total Score & Wallet Line
  const totalScore = 100 * lvlNum;
  const scoreRowY = isPerf ? (cy + 162) : (cy + 134);
  drawGlossyText(`Total Score: ${totalScore}  •  🪙 Wallet: ${wallet}`, W / 2, scoreRowY, 13, 'center', '#ffffff', '#0f172a', 2.6);

  drawGlossyButton(W / 2 - btnW / 2, cy + ch - 66, btnW, btnH, BUTTON_THEMES.green, `START LEVEL ${lvlNum + 1}`, null, isNextPressed, 22);

  // Wallet coin pill on top right
  drawWalletCoinPill(W - 98, 14 + topInset, 88, 24, wallet, coinCounterBump);

  // Draw Flying Coins above popup
  for (let i = 0; i < flyingCoins.length; i++) {
    const fc = flyingCoins[i];
    if (fc.t < 0) continue;
    const spr = getCoinSprite(fc.type, curAnimFrame);
    if (spr) {
      ctx.save();
      const glow = (fc.type === 'coin_100' || fc.type === 'gem') ? '#ffffff' : ((fc.type === 'coin_50' || fc.type === 'gold' || fc.type === 'silver') ? '#facc15' : '#fde047');
      ctx.shadowColor = glow;
      ctx.shadowBlur = 8;
      ctx.drawImage(spr, fc.curX - spr.width / 2, fc.curY - spr.height / 2);
      ctx.restore();
    }
  }

  ctx.restore();

  const cw = 290, ch = 275;
