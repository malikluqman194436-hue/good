function addSeg(isOpen = false, forceLen) {
  const isTunnel = !isOpen && nextX >= TUNNEL_START_X && nextX < TUNNEL_END_X;
  const segIndex = isTunnel ? tunnelSegCount++ : 0;

  const segDistInLevel = isTunnel ? Math.max(0, Math.min(LEVEL_LENGTH, nextX - CAR_X)) : 0;
  const p = isTunnel ? (segDistInLevel / LEVEL_LENGTH) : 0;
  const { f } = getLevelDifficulty(curLevel, p);

  const currentScrollSpeed = scrollSpeed();
  const mult = getSpeedMultiplier();

  // 1. Segment Length >= 1.3 * scrollSpeed
  const minSegLen = Math.round(1.3 * currentScrollSpeed);
  const baseLen = lerp(SEG_LEN_LEVEL_1_RATIO, SEG_LEN_MAX_RATIO, f) * BASE_SEGMENT_LEN * mult;
  let len = forceLen || Math.max(minSegLen, Math.round(baseLen));

  if (!isOpen && nextX + len > TUNNEL_END_X) {
    len = Math.max(minSegLen, TUNNEL_END_X - nextX);
  }

  // 2. Base Gap Height = lerp(4.4, 3.0, f) * carH (never below 3.0 * carH)
  let gap = isOpen ? 380 : getGapHeight(curLevel, p);

  // 3. Squeeze sections (gap about 2.85 * carH) from level 7
  let isSqueeze = false;
  if (!isOpen && curLevel >= 7) {
    if (curLevel >= 15) {
      if (segIndex === 4 || segIndex === 8) isSqueeze = true;
    } else {
      if (segIndex === 4) isSqueeze = true;
    }
  }
  if (isSqueeze) {
    gap = SQUEEZE_GAP_RATIO * CAR_HITBOX_H;
    len = Math.max(minSegLen, Math.round(len * 0.9));
  }

  // Seed twists for this level:
  if (!isOpen) {
    if (levelSeedTwist === 'tight_corridor' && (segIndex === 2 || segIndex === 5)) {
      gap = Math.max(GAP_MAX_DIFFICULTY_RATIO * CAR_HITBOX_H, gap * 0.96);
    }
  }

  // 4. Moving rails: from level 10, smooth gentle sine motion
  let moving = false;
  let moveAmp = 0;
  let moveSpeed = 0;
  let movePhase = 0;

  if (!isOpen && curLevel >= 10) {
    const isMovingSeg = (curLevel >= 18) ? (segIndex === 3 || segIndex === 7) : (segIndex === 4);
    if (isMovingSeg) {
      moving = true;
      moveAmp = MOVE_RAIL_AMP_MIN + levelPRNG() * (MOVE_RAIL_AMP_MAX - MOVE_RAIL_AMP_MIN);
      moveSpeed = (curLevel >= 16) ? MOVE_RAIL_SPEED_FAST : MOVE_RAIL_SPEED_SLOW;
      movePhase = levelPRNG() * Math.PI * 2;
    }
  }

  // 5. FAIR STEPS WITH REACTION TIME (Requirement 3):
  // Up steps: 0.4 * MAX_UP_SPEED * segmentTime, down steps: 0.35 * terminalSinkSpeed * segmentTime.
  // Window overlap >= 2.0 * carH: |cB - cA| <= (lastGap + gap)/2 - 2.0 * carH.
  const segTime = len / currentScrollSpeed;
  const maxUpStep = 0.4 * MAX_UP_SPEED * segTime;
  const maxDownStep = 0.35 * MAX_DOWN_SPEED * segTime;
  const fairStep = Math.min(0.5 * gap, Math.max(maxUpStep, maxDownStep));
  const overlapStepLimit = Math.max(8, (lastGap + gap) / 2 - 2.0 * CAR_HITBOX_H);
  const maxFairStep = Math.min(fairStep, overlapStepLimit);

  const stepRatio = lerp(STEP_MIN_RATIO, STEP_MAX_RATIO, f);
  let maxShift = isOpen ? 15 : (stepRatio * maxFairStep);

  let shiftDir = (levelPRNG() * 2 - 1);
  if (!isOpen) {
    if (levelSeedTwist === 'quick_stairs') {
      shiftDir = (segIndex % 2 === 0) ? 0.9 : -0.9;
    } else if (levelSeedTwist === 'smooth_corridor' && segIndex >= 1 && segIndex <= 3) {
      maxShift *= 0.25;
    }
    if (isSqueeze) {
      maxShift *= 0.5;
    }
  }

  // Strict fairness clamp: never exceed maxFairStep
  maxShift = Math.min(maxShift, maxFairStep);

  // Vertical band constraints for the tunnel:
  // - Gap center must stay between TUNNEL_CENTER_MIN * H and TUNNEL_CENTER_MAX * H.
  // - Gap edges must stay at least 0.12 * H away from the top HUD area: c - gap/2 >= 0.12 * H
  // - Gap edges must stay at least 0.20 * H above the bottom of the screen: c + gap/2 <= 0.80 * H
  const bandMinC = Math.max(TUNNEL_CENTER_MIN * H, gap / 2 + 0.12 * H);
  const bandMaxC = Math.min(TUNNEL_CENTER_MAX * H, H * 0.80 - gap / 2);
  const safeMinC = Math.min(bandMinC, bandMaxC);
  const safeMaxC = Math.max(bandMinC, bandMaxC);
  const targetStartCenter = TUNNEL_START_CENTER * H;
  const carH = Math.max(CAR_HITBOX_H, CAR_DRAW_H);
  const maxRiseStep = 0.4 * carH;

  let c;
  if (isOpen) {
    c = ROAD_TOP - 20;
    lastC = c;
  } else if (segIndex < 3) {
    // The first 3 tunnel segments rise smoothly from the road height to the center band,
    // in steps of at most 0.4 * carH each, reaching TUNNEL_START_CENTER (0.50 * H).
    const remainingSteps = 3 - segIndex;
    const riseNeeded = lastC - targetStartCenter;
    const stepUp = Math.min(maxRiseStep, Math.max(0, riseNeeded / remainingSteps));
    c = lastC - stepUp;
    c = Math.max(safeMinC, Math.min(safeMaxC, c));
    if (Math.abs(c - lastC) > maxFairStep) {
      c = lastC + Math.sign(c - lastC) * maxFairStep;
    }
    lastC = c;
  } else {
    // Keep the steps inside the band: if a step would leave the band, flip its direction so the corridor stays in the band
    if (shiftDir < 0 && (lastC - maxShift < safeMinC)) {
      shiftDir = Math.abs(shiftDir);
    } else if (shiftDir > 0 && (lastC + maxShift > safeMaxC)) {
      shiftDir = -Math.abs(shiftDir);
    }

    c = lastC + shiftDir * maxShift;
    c = Math.max(safeMinC, Math.min(safeMaxC, c));

    // Keep all fairness rules: vertical step never exceeds maxFairStep
    if (Math.abs(c - lastC) > maxFairStep) {
      c = lastC + Math.sign(c - lastC) * maxFairStep;
    }
    lastC = c;
  }

  const top = isOpen ? -300 : (c - gap / 2);
  const bot = isOpen ? (H + 300) : (c + gap / 2);

  const segProg = (nextX - CAR_X) / LEVEL_LENGTH;
  const noSpikes = isOpen || (segProg >= 0.95) || (nextX >= TUNNEL_END_X);
  const { topSpikes, botSpikes } = makeSpikes(len, curLevel, top, bot, noSpikes, levelPRNG);

  segs.push({
    x: nextX,
    w: len,
    top,
    bot,
    curTop: top,
    curBot: bot,
    topSpikes,
    botSpikes,
    isOpen,
    moving,
    moveAmp,
    moveSpeed,
    movePhase
  });

  lastGap = gap;
  nextX += len;
}

// 4. SANITIZE LEVEL SEGMENTS (Requirement 4):
// Check every neighboring pair with the rules and fix if needed, so a level never has an impossible spot.
function sanitizeLevelSegments(segmentList) {
  const currentScrollSpeed = scrollSpeed();
  const carH = CAR_HITBOX_H;

  for (let i = 1; i < segmentList.length; i++) {
    const prev = segmentList[i - 1];
    const curr = segmentList[i];
    if (prev.isOpen || curr.isOpen) continue;

    const gapA = prev.bot - prev.top;
    const gapB = curr.bot - curr.top;
    const lenB = curr.w;

    // 1. Step limit: up steps 0.4 * MAX_UP_SPEED * segTime, down steps 0.35 * MAX_DOWN_SPEED * segTime
    const segTime = lenB / currentScrollSpeed;
    const maxUpStep = 0.4 * MAX_UP_SPEED * segTime;
    const maxDownStep = 0.35 * MAX_DOWN_SPEED * segTime;
    const fairStep = Math.min(0.5 * gapB, Math.max(maxUpStep, maxDownStep));

    // 2. Window overlap >= 2.0 * carH => |cB - cA| <= (gapA + gapB)/2 - 2.0 * carH
    const overlapStepLimit = Math.max(8, (gapA + gapB) / 2 - 2.0 * carH);
    const maxAllowedStep = Math.min(fairStep, overlapStepLimit);

    const cA = (prev.top + prev.bot) / 2;
    let cB = (curr.top + curr.bot) / 2;

    const diff = cB - cA;
    if (Math.abs(diff) > maxAllowedStep) {
      cB = cA + Math.sign(diff) * maxAllowedStep;
    }

    // Band clamp
    const bandMinC = Math.max(TUNNEL_CENTER_MIN * H, gapB / 2 + 0.12 * H);
    const bandMaxC = Math.min(TUNNEL_CENTER_MAX * H, H * 0.80 - gapB / 2);
    const safeMinC = Math.min(bandMinC, bandMaxC);
    const safeMaxC = Math.max(bandMinC, bandMaxC);
    cB = Math.max(safeMinC, Math.min(safeMaxC, cB));

    // Ensure overlap >= 2.0 * carH
    const curOverlap = Math.min(prev.bot, cB + gapB / 2) - Math.max(prev.top, cB - gapB / 2);
    if (curOverlap < 2.0 * carH) {
      cB = (cB > cA) ? (prev.bot + gapB / 2 - 2.0 * carH) : (prev.top - gapB / 2 + 2.0 * carH);
      cB = Math.max(safeMinC, Math.min(safeMaxC, cB));
    }

    curr.top = cB - gapB / 2;
    curr.bot = cB + gapB / 2;
    curr.curTop = curr.top;
    curr.curBot = curr.bot;

    // Spikes clearance check
    if (curr.topSpikes && curr.botSpikes) {
      const maxSpikeSum = Math.max(0, (curr.bot - curr.top) - (carH + 20));
      for (let k = 0; k < curr.topSpikes.length; k++) {
        if (curr.topSpikes[k].h + curr.botSpikes[k].h > maxSpikeSum) {
          const excess = (curr.topSpikes[k].h + curr.botSpikes[k].h) - maxSpikeSum;
          if (curr.topSpikes[k].h >= curr.botSpikes[k].h) {
            curr.topSpikes[k].h = Math.max(10, curr.topSpikes[k].h - excess);
          } else {
            curr.botSpikes[k].h = Math.max(10, curr.botSpikes[k].h - excess);
          }
        }
      }
    }
  }
}

function startLevel(lvl) {
  curLevel = lvl;

  const newStage = getStageNumber(lvl);
  if (newStage !== currentBgStage) {
    prevBgStage = currentBgStage;
    currentBgStage = newStage;
    bgCrossFadeTimer = 0.6;
  }
  updateSpeedPhysics();

  cam = 0;
  vy = 0;
  thrust = 0;
  cy = CAR_REST_Y;
  lastC = ROAD_TOP - 20;
  lastGap = 380;
  parts = [];
  stopping = false;
  stopTimer = 0;
  autoLanding = false;
  landingStartY = CAR_REST_Y;
  safetyLanding = false;
  safetyLandingTimer = 0;
  hasTouchedDown = false;
  finishRunStage = 'none';
  finishRunTimer = 0;
  landingScrollSpeed = 0;
  scrollStopTimer = 0;
  camEaseStart = 0;
  camEaseDist = 0;
  carDriveTimer = 0;
  thumbsUpTimer = 0;
  confettiStarted = false;
  levelCompleted = false;
  carDrawX = CAR_X;
  levelCompleteTimer = 0;
  levelJustCleared = 0;
  confettis = [];
  tunnelSegCount = 0;
  camSamples = [];
  realSpeedWPerSec = 0;
  realSpeedPxPerSec = 0;

  TUNNEL_LENGTH = getTunnelLength(lvl);
  TUNNEL_END_X = TUNNEL_START_X + TUNNEL_LENGTH;
  FINISH_ROAD_X = TUNNEL_END_X + CALM_OPEN_GAP;
  FINISH_ROAD_END = FINISH_ROAD_X + FINISH_ROAD_LENGTH;
  FINISH_LINE_X = FINISH_ROAD_X + FINISH_ROAD_LENGTH * FINISH_LINE_AT;
  LEVEL_LENGTH = FINISH_LINE_X - CAR_X;
  playLaunchSpinSound();

  const cfg = getLevelConfig(lvl);
  curConfig = cfg;
  prerenderSpikes(cfg);

  levelPRNG = mulberry32(hashInt(lvl * 55555 + 12345));

  const twists = ['tight_corridor', 'quick_stairs', 'smooth_corridor'];
  levelSeedTwist = twists[Math.floor(levelPRNG() * twists.length)];
  gameTime = 0;

  const initW = TUNNEL_START_X - START_ROAD_START;
  const { topSpikes, botSpikes } = makeSpikes(initW, curLevel, -300, H + 300, true, levelPRNG);
  segs = [{ x: START_ROAD_START, w: initW, top: -300, bot: H + 300, curTop: -300, curBot: H + 300, topSpikes, botSpikes, isOpen: true, moving: false }];
  nextX = TUNNEL_START_X;

  while (nextX < TUNNEL_END_X) {
    addSeg(false);
  }

  // Requirement 4: Sanitize all neighboring segment pairs
  sanitizeLevelSegments(segs);

  // Generate collectible coins and rare blue gem for the level
  generateLevelCoins(lvl, segs);

  const postW = (FINISH_ROAD_END + 500) - TUNNEL_END_X;
  const endSpikes = makeSpikes(postW, curLevel, -300, H + 300, true, levelPRNG);
  segs.push({ x: TUNNEL_END_X, w: postW, top: -300, bot: H + 300, curTop: -300, curBot: H + 300, topSpikes: endSpikes.topSpikes, botSpikes: endSpikes.botSpikes, isOpen: true, moving: false });
  nextX = TUNNEL_END_X + postW;
}

function advanceToNextLevel() {
  const nextLvl = (levelJustCleared ? levelJustCleared + 1 : curLevel + 1);
  curLevel = nextLvl;
  saveProgress(curLevel, Math.max(highestLevel, curLevel), best);
  startLevel(curLevel);
  st = 'transition';
  transitionTimer = 0;
  hold = false;
  thrust = 0;
}

function resetGame() {
  curLevel = 1;
  cam = 0;
  startLevel(1);
}

function initConfetti() {
  confettis = [];
  const colors = ['#22c55e', '#facc15', '#38bdf8', '#f43f5e', '#a855f7', '#fb923c'];
  for (let i = 0; i < 75; i++) {
    confettis.push({
      x: rnd(10, W - 10),
      y: rnd(-80, H * 0.45),
      vx: rnd(-35, 35),
      vy: rnd(65, 160),
      size: rnd(4, 7),
      w: rnd(5, 9),
      rot: rnd(0, 6.28),
      vRot: rnd(-4, 4),
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateConfetti(dt) {
  for (const c of confettis) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.vRot * dt;
    if (c.y > H + 20) {
      c.y = rnd(-20, -5);
      c.x = rnd(10, W - 10);
      c.vy = rnd(65, 160);
    }
  }
}

function drawConfetti() {
  for (const c of confettis) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.size / 2, c.w * Math.abs(Math.cos(c.rot)), c.size);
    ctx.restore();
  }
}

function die() {
  st = 'dead';
  deadAt = performance.now();
  hold = false;
  thrust = 0;
  playCrashSound();
  const progress = getLevelProgress();
  const curScore = Math.floor(progress * 100);
  const currentTotal = 100 * (curLevel - 1) + curScore;
  if (currentTotal > best) {
    best = currentTotal;
    saveProgress(curLevel, highestLevel, best);
  }
}

function spawnTireDust() {
  const drawW = CAR_DRAW_W;
  const drawH = CAR_DRAW_H;
  const rearOx = -drawW / 2 + drawW * WHEEL_REAR_X;
  const frontOx = -drawW / 2 + drawW * WHEEL_FRONT_X;
  const wheelY = cy + drawH * (WHEEL_Y - 0.5) + (drawW * WHEEL_RADIUS) * 0.9;
  for (const ox of [rearOx, frontOx]) {
    parts.push({
      x: carDrawX + ox + rnd(-3, 3),
      y: wheelY + rnd(-1, 2),
      vx: rnd(-45, -15),
      vy: rnd(-5, 0),
      l: 0,
      m: rnd(0.2, 0.35),
      size: rnd(2.5, 4.5),
      color: 'rgba(255, 255, 255, 0.65)'
    });
  }
}

  ctx.fill();

  ctx.lineTo(charX - 4, baseY - 34);

  ctx.fill();

  ctx.moveTo(charX + 9, baseY - 42);
  ctx.lineTo(charX + 4, baseY - 34);
  ctx.lineTo(charX + 6, baseY - 34);
  ctx.closePath();

  // 10. "YES!" speech bubble pops up above him for 1.5 seconds when car has stopped

}

// 3-layer cartoon road platform with red deck edge and soft shadow
function drawRoadPlatform(startX, endX, roadTop, isFinish = false) {
  const w = endX - startX;
  if (w <= 0) return;
  const x = startX - cam;
  if (x + w < -60 || x > W + 60) return;

  const bandH = 36; // 36 px tall asphalt band
  const roadCenterY = roadTop + bandH / 2; // middle: roadTop + 18
  const roadBottom = roadTop + bandH; // roadTop + 36
  const trussBottom = roadBottom + 20;

  ctx.save();
  // Soft drop shadow under platform
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;

  ctx.beginPath();
  ctx.moveTo(x - 20, roadTop - 4);
  ctx.lineTo(x + w, roadTop - 4);
  ctx.lineTo(x + w - 12, trussBottom + 2);
  ctx.lineTo(x - 20, trussBottom + 2);
  ctx.closePath();
  ctx.clip();

  // 1. Asphalt Road Surface (frames car in the middle of the road, 36px tall band)
  ctx.fillStyle = '#26282c';
  ctx.fillRect(x, roadTop, w, bandH);

  // 2. Upper Red Deck Edge / Barrier (symmetrical border)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadTop - 2, w, 3);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadTop - 2, w, 1);

  // 3. Yellow Dashed Center Lane Markings (runs right through middle of road at wheel-hub height)
  ctx.fillStyle = '#fde047';
  const startDash = Math.floor(startX / 48) * 48;
  for (let wx = startDash; wx < endX + 48; wx += 48) {
    const dx = wx - cam;
    ctx.fillRect(dx, roadCenterY - 1.5, 22, 3);
  }

  // 4. Lower Red Deck Edge (front edge of the road, below tires at roadBottom - 2 = roadTop + 34)
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(x, roadBottom - 2, w, 4);
  ctx.fillStyle = '#f87171';
  ctx.fillRect(x, roadBottom - 2, w, 1.2);

  // 5. Steel Truss structure underneath (below tires)
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(x, roadBottom + 2, w, 18);

  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  const startTruss = Math.floor(startX / 40) * 40;
  for (let wx = startTruss; wx < endX + 40; wx += 40) {
    const p1 = wx - cam, p2 = wx + 40 - cam;
    ctx.moveTo(p1, roadBottom + 3); ctx.lineTo(p2, roadBottom + 19);
    ctx.moveTo(p2, roadBottom + 3); ctx.lineTo(p1, roadBottom + 19);
  }
  ctx.stroke();

  ctx.restore();

  if (isFinish) {
    ctx.save();
    const cfg = curConfig;
    const finishLineWx = FINISH_LINE_X;
    const characterWx = FINISH_LINE_X + 50;
    const flX = finishLineWx - cam;
    const charX = characterWx - cam;

    // 1. Checkered Finish Line Strip across the asphalt road
    if (flX > -40 && flX < W + 40) {
      const stripW = 16;
      const cols = 2;
      const rows = 4;
      const cellW = stripW / cols;
      const cellH = bandH / rows;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 4;
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          ctx.fillStyle = ((c + r) % 2 === 0) ? '#ffffff' : '#0f172a';
          ctx.fillRect(flX - stripW / 2 + c * cellW, roadTop + r * cellH, cellW, cellH);
        }
      }
      ctx.fillStyle = '#facc15';
      ctx.fillRect(flX - stripW / 2 - 1.5, roadTop, 1.5, bandH);
      ctx.fillRect(flX + stripW / 2, roadTop, 1.5, bandH);
      ctx.restore();

      // 2. Two Finish Flags placed on sides of the finish line
      for (const side of [-1, 1]) {
        const poleX = flX + side * 15;
        const poleBaseY = roadTop + 2;
        const poleTopY = roadTop - 50;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.ellipse(poleX + 1, poleBaseY, 5, 2, 0, 0, 6.28);
        ctx.fill();

        // Silver pole
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(poleX - 1.5, poleTopY, 3, poleBaseY - poleTopY);

        // Gold finial sphere
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(poleX, poleTopY, 4, 0, 6.28);
        ctx.fill();

        // Waving checkered flag
        const flagW = 22 * side;
        const flagTop = poleTopY + 2;
        const flagH = 22;
        const fRows = 3, fCols = 3;
        const fSqW = flagW / fCols;
        const fSqH = flagH / fRows;
        for (let fc = 0; fc < fCols; fc++) {
          for (let fr = 0; fr < fRows; fr++) {
            const wave = Math.sin(fc * 0.8 + gameTime * 6) * 2;
            ctx.fillStyle = ((fc + fr) % 2 === 0) ? '#ffffff' : '#0f172a';
            ctx.fillRect(poleX + fc * fSqW, flagTop + fr * fSqH + wave, fSqW, fSqH);
          }
        }
      }
    }

    // 3. Safety rail at the end of the road
    const railScreenX = endX - cam;
    if (railScreenX > -40 && railScreenX < W + 40) {
      const rx = railScreenX - 8;
      // Heavy steel posts
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(rx - 3, roadTop - 26, 6, bandH + 26);
      ctx.fillRect(rx + 4, roadTop - 26, 6, bandH + 26);

      // Crash barrier body
      const barrierW = 16;
      ctx.fillStyle = '#475569';
      ctx.fillRect(rx - 4, roadTop - 22, barrierW, 14);

      // Red and white hazard warning stripes
      ctx.save();
      ctx.beginPath();
      ctx.rect(rx - 4, roadTop - 22, barrierW, 14);
      ctx.clip();
      for (let sx = -12; sx < barrierW + 12; sx += 6) {
        ctx.fillStyle = (Math.floor(sx / 6) % 2 === 0) ? '#ef4444' : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(rx - 4 + sx, roadTop - 8);
        ctx.lineTo(rx - 4 + sx + 6, roadTop - 8);
        ctx.lineTo(rx - 4 + sx + 12, roadTop - 22);
        ctx.lineTo(rx - 4 + sx + 6, roadTop - 22);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Red reflector caps
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(rx - 4, roadTop - 28, 7, 3);
      ctx.fillRect(rx + 3, roadTop - 28, 7, 3);
    }

    // 4. Cheering friendly character standing on the road at characterWx
    drawFinishCharacter(charX, roadTop);

    ctx.restore();
  }
}

// Thin studded rails with rivets, end caps and soft shadow for high contrast on bright sky
function drawWall(s, x) {
  const cfg = curConfig;
  const w = s.w + 1;
  const top = (s.curTop !== undefined) ? s.curTop : s.top;
  const bot = (s.curBot !== undefined) ? s.curBot : s.bot;
  drawRailSegment(x, top - 28, w, true, cfg);
  drawRailSegment(x, bot + 18, w, false, cfg);
}

function drawRailSegment(x, y, w, isCeiling, cfg) {
  ctx.save();
  // Soft shadow so rails stand out clearly against bright sky picture
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = isCeiling ? -2 : 3;

  const railGrad = ctx.createLinearGradient(0, y, 0, y + 10);
  railGrad.addColorStop(0, '#ffffff');
  railGrad.addColorStop(0.25, cfg.railColor || '#64748b');
  railGrad.addColorStop(0.8, cfg.railColor || '#64748b');
  railGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = railGrad;
  ctx.fillRect(x, y, w, 10);

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(x, y, w, 1.5);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  ctx.fillRect(x, y + 8.5, w, 1.5);

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x - 1, y - 1, 3, 12);
  ctx.fillRect(x + w - 2, y - 1, 3, 12);

  const centerY = y + 5;
  const startRivet = Math.floor(x / 16) * 16;
  for (let rx = startRivet; rx <= x + w + 16; rx += 16) {
    if (rx < x + 3 || rx > x + w - 3) continue;
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(rx, centerY, 2.2, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(rx - 0.6, centerY - 0.6, 1, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawVerticalRailConnector(x, y1, y2, cfg) {
  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2) + 10;
  const h = maxY - minY;
  if (h <= 10) return;

  ctx.save();
  ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;

  const railGrad = ctx.createLinearGradient(x - 5, 0, x + 5, 0);
  railGrad.addColorStop(0, '#ffffff');
  railGrad.addColorStop(0.25, cfg.railColor || '#64748b');
  railGrad.addColorStop(0.8, cfg.railColor || '#64748b');
  railGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = railGrad;
  ctx.fillRect(x - 5, minY, 10, h);

  ctx.shadowColor = 'transparent';

  // Highlight and dark outlines
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fillRect(x - 5, minY, 1.5, h);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
  ctx.fillRect(x + 3.5, minY, 1.5, h);

  // End caps
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(x - 6, minY - 1, 12, 3);
  ctx.fillRect(x - 6, maxY - 2, 12, 3);

  // Rivets spaced every 16px along the vertical connector
  const centerX = x;
  const startRivetY = Math.floor(minY / 16) * 16;
  for (let ry = startRivetY; ry <= maxY + 16; ry += 16) {
    if (ry < minY + 4 || ry > maxY - 4) continue;
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(centerX, ry, 2.2, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(centerX - 0.6, ry - 0.6, 1, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawSpike(x, baseY, isTop, sp) {
  if (!sp || !sp.h || sp.h <= 0) return;
  const key = `${sp.size}_${isTop ? 'top' : 'bot'}`;
  const spr = spikeCanvases[key];
  if (spr) {
    ctx.save();
    // Soft shadow behind spike so it pops from bright sky picture
    ctx.shadowColor = 'rgba(15, 23, 42, 0.35)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = isTop ? 2 : -2;
    if (isTop) {
      ctx.drawImage(spr, x + 6 - 18, baseY - 2);
    } else {
      ctx.drawImage(spr, x + 6 - 18, baseY - 46);
    }
    ctx.restore();
  }
}

// High-performance sports car wheel with realistic rubber tyre, stationary brake caliper & rotating chrome twin-spoke alloy rim
function drawSportsWheel(cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);

  // 1. Solid Tyre (Deep matte black rubber with realistic sidewall contour)
  ctx.fillStyle = '#0f1115';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Tyre outer edge definition
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath();
  ctx.arc(0, 0, r - ctx.lineWidth / 2, 0, Math.PI * 2);
  ctx.stroke();

  // Subtle tyre sidewall highlight band
  ctx.strokeStyle = '#262a33';
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
  ctx.stroke();

  // Inner tyre bead line
  ctx.strokeStyle = '#090a0d';
  ctx.lineWidth = Math.max(0.8, r * 0.04);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.77, 0, Math.PI * 2);
  ctx.stroke();

  // 2. Wheel Cavity / Rim Barrel (Dark interior background behind spokes)
  ctx.fillStyle = '#14161a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.73, 0, Math.PI * 2);
  ctx.fill();

  // 3. Stationary Brake Assembly (Realistic: Caliper and Rotor do NOT spin with wheel)
  // Brake disc rotor (brushed steel)
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.56, 0, Math.PI * 2);
  ctx.fill();

  // Brake rotor groove ring
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.035);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.44, 0, Math.PI * 2);
  ctx.stroke();

  // High-performance Red Sports Brake Caliper (stationary at top quadrant)
  ctx.save();
  ctx.rotate(-0.58);
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  const calW = r * 0.22;
  const calH = r * 0.38;
  const calX = r * 0.36;
  const calY = -calH / 2;
  if (ctx.roundRect) {
    ctx.roundRect(calX, calY, calW, calH, r * 0.05);
  } else {
    ctx.rect(calX, calY, calW, calH);
  }
  ctx.fill();
  // Caliper highlight bolt
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(calX + calW / 2, 0, Math.max(0.8, r * 0.035), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 4. Rotating Alloy Rim Lip & Spokes
  ctx.save();
  ctx.rotate(angle);

  // Outer chrome rim lip
  ctx.strokeStyle = '#f1f5f9';
  ctx.lineWidth = Math.max(1.2, r * 0.065);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.71, 0, Math.PI * 2);
  ctx.stroke();

  // Inner chrome bevel
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = Math.max(0.8, r * 0.03);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.67, 0, Math.PI * 2);
  ctx.stroke();

  // 5 Twin-Spoke High Performance Alloy Wheels (10 blades)
  const numPairs = 5;
  const innerR = r * 0.19;
  const outerR = r * 0.67;
  const spokeWidth = Math.max(1.2, r * 0.055);
  const splitOffset = 0.13;

  ctx.lineWidth = spokeWidth;
  ctx.lineCap = 'round';

  for (let i = 0; i < numPairs; i++) {
    const baseAng = (i * Math.PI * 2) / numPairs;

    for (const sign of [-1, 1]) {
      const spkAng = baseAng + sign * splitOffset;
      const cosA = Math.cos(spkAng);
      const sinA = Math.sin(spkAng);

      // Shaded metallic side
      ctx.strokeStyle = '#64748b';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR + sign * 0.4, sinA * innerR);
      ctx.lineTo(cosA * outerR + sign * 0.4, sinA * outerR);
      ctx.stroke();

      // Bright polished chrome face
      ctx.strokeStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(cosA * innerR, sinA * innerR);
      ctx.lineTo(cosA * outerR, sinA * outerR);
      ctx.stroke();
    }
  }

  // 5. Central Wheel Hub & Lug Nuts
  // Chrome outer hub
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = Math.max(0.6, r * 0.03);
  ctx.stroke();

  // Center cap badge
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(0.7, r * 0.04), 0, Math.PI * 2);
  ctx.fill();

  // 5 Chrome Lug Nuts
  ctx.fillStyle = '#f8fafc';
  for (let l = 0; l < 5; l++) {
    const lugAng = (l * Math.PI * 2) / 5 + 0.31;
    const lx = Math.cos(lugAng) * (r * 0.175);
    const ly = Math.sin(lugAng) * (r * 0.175);
    ctx.beginPath();
    ctx.arc(lx, ly, Math.max(0.6, r * 0.026), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore(); // Restore wheel rotation
  ctx.restore(); // Restore wheel translation
}

function car(drawX = CAR_X) {
  const drawW = CAR_DRAW_W;
  const drawH = CAR_DRAW_H;

  // Soft dark ground shadow under the car tires
  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
  ctx.beginPath();
  ctx.ellipse(drawX, cy + drawH / 2 - 2, drawW * 0.42, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Draw car always horizontal (perfectly straight, no rotation or tilt)
  ctx.save();
  ctx.translate(drawX, cy);

  // Short soft cyan trail behind the car while thrust is held
  if (hold && st === 'play' && finishRunStage === 'none' && !stopping) {
    ctx.save();
    const trailLen = drawW * 0.55;
    const trailGrad = ctx.createLinearGradient(-drawW / 2 - trailLen, 0, -drawW / 2 + 6, 0);
    trailGrad.addColorStop(0, 'rgba(6, 182, 212, 0)');
    trailGrad.addColorStop(0.65, 'rgba(34, 211, 238, 0.32)');
    trailGrad.addColorStop(1, 'rgba(165, 243, 252, 0.70)');
    ctx.fillStyle = trailGrad;
    ctx.beginPath();
    ctx.moveTo(-drawW / 2 + 6, -drawH * 0.12);
    ctx.lineTo(-drawW / 2 - trailLen, -2);
    ctx.lineTo(-drawW / 2 - trailLen, 2);
    ctx.lineTo(-drawW / 2 + 6, drawH * 0.20);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  if (trimmedCarCanvas) {
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.drawImage(trimmedCarCanvas, -drawW / 2, -drawH / 2, drawW, drawH);

    // Dynamic rotating sports wheels built from the car image
    if (wheelSpritesReady && rearWheelSprite && frontWheelSprite) {
      try {
        const rearX = -drawW / 2 + drawW * WHEEL_REAR_X;
        const frontX = -drawW / 2 + drawW * WHEEL_FRONT_X;
        const wheelY = -drawH / 2 + drawH * WHEEL_Y;
        const rimR = drawW * WHEEL_SPIN_RADIUS;
        const rimD = rimR * 2;

        // Clean dark wheel cavity behind rim
        ctx.save();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(rearX, wheelY, rimR + 0.8, 0, Math.PI * 2);
        ctx.arc(frontX, wheelY, rimR + 0.8, 0, Math.PI * 2);
        ctx.fill();

        // Performance red brake caliper (stays static behind spinning spokes)
        for (const wx of [rearX, frontX]) {
          ctx.save();
          ctx.translate(wx, wheelY);
          const calAngle = -Math.PI * 0.62;
          ctx.rotate(calAngle);
          ctx.translate(rimR * 0.72, 0);
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-rimR * 0.22, -rimR * 0.16, rimR * 0.44, rimR * 0.32);
          ctx.fillStyle = '#f87171';
          ctx.fillRect(-rimR * 0.22, -rimR * 0.16, rimR * 0.44, rimR * 0.08);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-rimR * 0.10, -rimR * 0.04, rimR * 0.20, rimR * 0.08);
          ctx.restore();
        }
        ctx.restore();

        // Draw rear rim sprite concentric to axle (spins only the rim; tire & body arch stay static)
        ctx.save();
        ctx.translate(rearX, wheelY);
        ctx.rotate(wheelAngle);
        ctx.drawImage(rearWheelSprite, -rimR, -rimR, rimD, rimD);
        ctx.restore();

        // Draw front rim sprite concentric to axle (spins only the rim; tire & body arch stay static)
        ctx.save();
        ctx.translate(frontX, wheelY);
        ctx.rotate(wheelAngle);
        ctx.drawImage(frontWheelSprite, -rimR, -rimR, rimD, rimD);
        ctx.restore();

        // Motion blur at high spin speed: draw wheel a second time rotated by a small extra angle with alpha 0.35
        const isHighSpin = (Math.abs(currentAngularSpeed) > 12) || (thrustSpinMultiplier > 1.25);
        if (isHighSpin) {
          const blurOffset = 0.08 * (currentAngularSpeed >= 0 ? 1 : -1);
          ctx.save();
          ctx.globalAlpha = 0.35;
          ctx.translate(rearX, wheelY);
          ctx.rotate(wheelAngle - blurOffset);
          ctx.drawImage(rearWheelSprite, -rimR, -rimR, rimD, rimD);
          ctx.restore();

          ctx.save();
          ctx.globalAlpha = 0.35;
          ctx.translate(frontX, wheelY);
          ctx.rotate(wheelAngle - blurOffset);
          ctx.drawImage(frontWheelSprite, -rimR, -rimR, rimD, rimD);
          ctx.restore();
        }

        // Debug green circles at wheel positions (false by default)
        if (SHOW_WHEEL_DEBUG) {
          ctx.save();
          ctx.lineWidth = 1.2;
          // Green: spinning rim boundary
          ctx.strokeStyle = '#00ff00';
          ctx.beginPath();
          ctx.arc(rearX, wheelY, rimR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(frontX, wheelY, rimR, 0, Math.PI * 2);
          ctx.stroke();
          // Yellow: outer tire boundary
          const tireR = drawW * WHEEL_RADIUS;
          ctx.strokeStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(rearX, wheelY, tireR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(frontX, wheelY, tireR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      } catch (err) {
        // Fallback to static car image (already drawn via trimmedCarCanvas above)
        console.warn('Failed to render wheel sprites:', err);
      }
    }
  } else {
    // Fallback to drawn car if image fails to load
    ctx.scale(CAR_SCALE, CAR_SCALE);
    renderCarBody(wheelRot);
  }
  ctx.restore();
}

// Background drawing: clean cinematic background with 3 parallax silhouettes, haze, particles, tunnel dark gradient and vignette
function drawParallaxLayer(layerCanv, rate) {
  if (!layerCanv) return;
  const unitW = layerCanv.width;
  const scrollX = cam * rate;
  const relX = -((scrollX % unitW + unitW) % unitW);
  ctx.drawImage(layerCanv, relX, 0);
  if (relX + unitW < W) {
    ctx.drawImage(layerCanv, relX + unitW, 0);
  }
  if (relX > 0) {
    ctx.drawImage(layerCanv, relX - unitW, 0);
  }
}

function drawPreRenderedStage(bgData) {
  if (bgData.gradient) {
    ctx.drawImage(bgData.gradient, 0, 0);
  }
  drawParallaxLayer(bgData.far, 0.08);
  drawParallaxLayer(bgData.mid, 0.14);
  drawParallaxLayer(bgData.near, 0.22);
}

function drawStageScene(stageNum, alpha = 1) {
  const stageIdx = (stageNum - 1) % STAGES.length;
  const stage = STAGES[stageIdx];
  const bgData = stageBgCanvases[stageIdx];

  ctx.save();
  ctx.globalAlpha = alpha;

  if (stage.backgroundPicture && stage.backgroundPicture.length > 0) {
    const pic = getLevelPicture(curLevel);
    if (pic && pic.seamlessCanvas) {
      const unitW = pic.unitW;
      const scrollX = cam * 0.15;
      const relX = -((scrollX % unitW + unitW) % unitW);
      ctx.drawImage(pic.seamlessCanvas, relX, 0);
      if (relX + unitW < W) ctx.drawImage(pic.seamlessCanvas, relX + unitW, 0);
      if (relX > 0) ctx.drawImage(pic.seamlessCanvas, relX - unitW, 0);
    } else if (bgData) {
      drawPreRenderedStage(bgData);
    }
  } else if (bgData) {
    drawPreRenderedStage(bgData);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, stage.gradientTop);
    grad.addColorStop(1, stage.gradientBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  drawStageParticles(stage, alpha);
  ctx.restore();
}

function drawBackground() {
  if (bgCrossFadeTimer > 0 && prevBgStage !== currentBgStage) {
    const fade = 1 - Math.max(0, Math.min(1, bgCrossFadeTimer / 0.6));
    drawStageScene(prevBgStage, 1);
    drawStageScene(currentBgStage, fade);
  } else {
    drawStageScene(currentBgStage, 1);
  }

  // Slight dark gradient behind the tunnel area (about 25 percent black, soft edges)
  const tunnelGrad = ctx.createLinearGradient(0, H * 0.12, 0, H * 0.88);
  tunnelGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  tunnelGrad.addColorStop(0.25, 'rgba(0, 0, 0, 0.25)');
  tunnelGrad.addColorStop(0.75, 'rgba(0, 0, 0, 0.25)');
  tunnelGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = tunnelGrad;
  ctx.fillRect(0, H * 0.12, W, H * 0.76);

  // Soft vignette on the screen edges
  if (vignetteCanvas) {
    ctx.drawImage(vignetteCanvas, 0, 0);
  }
}


// ==========================================
// GAME LOOP (STEP & DRAW)
// ==========================================
function step(dt) {
  const sp = speed();
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) toastMsg = null;
  }

  if (st === 'loading') {
    loadingTimer += dt;
    loadingWheelRot += dt * 14;

    // Hard timeout check: after 6 seconds, stop waiting and continue with fallbacks
    if (loadingTimer >= 6.0 && !assetsFinished) {
      console.warn('Hard timeout reached (6s); continuing with fallback visuals');
      assetsFinished = true;
    }

    if (!assetsFinished) {
      // 1. LOADING PROGRESS: progress = max(realProgress, timeProgress)
      // realProgress = (number of finished assets) / (total assets)
      // timeProgress = elapsedSeconds / 2.5, capped at 0.95
      const realProgress = totalAssets > 0 ? (finishedAssetsCount / totalAssets) : 1;
      const timeProgress = Math.min(0.95, loadingTimer / 2.5);
      const targetProgress = Math.max(realProgress, timeProgress);

      // Animate displayed value toward target, never jump backwards
      visualLoadProgress = Math.max(visualLoadProgress, Math.min(targetProgress, visualLoadProgress + dt * 0.8));
      progressAtFinish = visualLoadProgress;
    } else {
      // 4. FINISH: When all assets are finished (or after timeout), fill the bar smoothly to 100% in about 0.4s
      finishFillTimer += dt;
      const fillT = Math.min(1, finishFillTimer / 0.4);
      visualLoadProgress = Math.max(visualLoadProgress, progressAtFinish + (1 - progressAtFinish) * fillT);

      // Show "100%", hold for 0.3 seconds, then fade out into main menu
      if (visualLoadProgress >= 0.999) {
        visualLoadProgress = 1;
        holdTimer += dt;
        if (holdTimer >= 0.3) {
          loadingFade += dt / 0.4;
          if (loadingFade >= 1) {
            st = 'ready';
            menuFadeTimer = 0;
          }
        }
      }
    }
    return;
  }

  if (bgCrossFadeTimer > 0) {
    bgCrossFadeTimer = Math.max(0, bgCrossFadeTimer - dt);
  }
  const curStageIdx = (currentBgStage - 1) % STAGES.length;
  updateStageParticles(dt, STAGES[curStageIdx]);
  updateWindSound(dt, sp);

  // Coin combo reset & counter bump decay
  if (coinComboTimer > 0) {
    coinComboTimer -= dt;
    if (coinComboTimer <= 0) coinCombo = 0;
  }
  if (coinCounterBump > 1.0) {
    coinCounterBump = Math.max(1.0, coinCounterBump - dt * 2.5);
  }

  // Update flying coins
  for (let i = flyingCoins.length - 1; i >= 0; i--) {
    const fc = flyingCoins[i];
    fc.t += dt / fc.dur;
    if (fc.t >= 1.0) {
      flyingCoins.splice(i, 1);
      coinCounterBump = 1.35;
    } else if (fc.t > 0) {
      const t = fc.t;
      const ease = t * t * (3 - 2 * t);
      fc.curX = fc.startX + (fc.endX - fc.startX) * ease;
      fc.curY = fc.startY + (fc.endY - fc.startY) * ease;
    } else {
      fc.curX = fc.startX;
      fc.curY = fc.startY;
    }
  }

  // Update coin sparkles
  for (let i = coinSparkles.length - 1; i >= 0; i--) {
    const spk = coinSparkles[i];
    spk.x += spk.vx * dt;
    spk.y += spk.vy * dt;
    spk.vy += 220 * dt;
    spk.life -= dt;
    if (spk.life <= 0) coinSparkles.splice(i, 1);
  }

  // Update floating +1 / +5 texts
  for (let i = coinFloatTexts.length - 1; i >= 0; i--) {
    const ft = coinFloatTexts[i];
    ft.y -= 38 * dt;
    ft.timer -= dt;
    if (ft.timer <= 0) coinFloatTexts.splice(i, 1);
  }

  // Update collected coins pop animation
  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.collected && c.popTimer > 0) {
      c.popTimer = Math.max(0, c.popTimer - dt);
    }
  }

  // Coin collision detection during play
  if (st === 'play' && !stopping) {
    const carCX = cam + carDrawX;
    const carCY = cy;

    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.collected) continue;

      const dx = c.x - carCX;
      if (dx < -PICKUP_RADIUS || dx > PICKUP_RADIUS) continue;

      const dy = c.y - carCY;
      if (Math.hypot(dx, dy) <= PICKUP_RADIUS) {
        c.collected = true;
        c.popTimer = 0.22;
        const val = c.val || (c.type === 'gem' ? GEM_VALUE : ((c.type === 'gold') ? GOLD_VALUE : ((c.type === 'silver') ? SILVER_VALUE : BRONZE_VALUE)));
        levelCoinsCollected += val;
        wallet += val;
        saveWallet();
        playCoinPickupSound(c.type);

        const screenX = c.x - cam;
        const screenY = c.y;

        // Sparkle color matches coin metal
        const spkColor = (c.type === 'gem') ? '#38bdf8' : ((c.type === 'silver') ? '#e2e8f0' : '#fde047');
        for (let s = 0; s < 6; s++) {
          const spkAng = (s / 6) * Math.PI * 2 + (Math.random() * 0.4);
          const spkSpeed = rnd(40, 110);
          coinSparkles.push({
            x: screenX,
            y: screenY,
            vx: Math.cos(spkAng) * spkSpeed,
            vy: Math.sin(spkAng) * spkSpeed - 30,
            life: 0.32,
            maxLife: 0.32,
            size: rnd(2.0, 3.8),
            color: spkColor
          });
        }

        // Flying coin animation to HUD
        flyingCoins.push({
          startX: screenX,
          startY: screenY,
          curX: screenX,
          curY: screenY,
          endX: W - 55,
          endY: 50 + topInset,
          t: 0,
          dur: 0.35,
          type: c.type
        });

        // Floating real value text (clean numbers: +5, +10, +50):
        if (c.type === 'bronze' || !c.type || c.type === 'coin') {
          bronzeCoinsPicked++;
          if (bronzeCoinsPicked % 3 === 0) {
            coinFloatTexts.push({
              text: '+5',
              x: carDrawX,
              y: cy - 24,
              timer: 0.65,
              color: '#fde047'
            });
          }
        } else if (c.type === 'silver') {
          coinFloatTexts.push({
            text: '+10',
            x: carDrawX,
            y: cy - 24,
            timer: 0.65,
            color: '#e2e8f0'
          });
        } else if (c.type === 'gold') {
          coinFloatTexts.push({
            text: '+10',
            x: carDrawX,
            y: cy - 24,
            timer: 0.65,
            color: '#fde047'
          });
        } else if (c.type === 'gem') {
          coinFloatTexts.push({
            text: '+50',
            x: carDrawX,
            y: cy - 24,
            timer: 0.65,
            color: '#38bdf8'
          });
        }
      }
    }
  }

  if (st === 'ready') {
    cy = CAR_REST_Y;
    vy = 0;
    thrust = 0;
    cam = 0;
    menuFadeTimer += dt;
  } else if (st === 'transition') {
    transitionTimer += dt;
    cy = CAR_REST_Y;
    vy = 0;
    thrust = 0;
    cam = 0;
    const wheelRadiusPx = CAR_DRAW_W * WHEEL_RADIUS;
    if (wheelRadiusPx > 0) {
      currentAngularSpeed = sp / wheelRadiusPx;
      wheelAngle += currentAngularSpeed * dt;
      wheelRot = wheelAngle;
    }
    if (transitionTimer >= TITLE_CARD_DURATION) {
      st = 'play';
      hold = false;
      thrust = 0;
    }
  } else if (st === 'play') {
    const wx = cam + CAR_X;
    const progress = getLevelProgress();

    // Auto Landing: autopilot takes over smoothly as soon as last spike has passed
    if (wx >= TUNNEL_END_X && !autoLanding) {
      autoLanding = true;
      landingStartY = cy;
    }
    if (autoLanding || stopping) {
      hold = false;
      thrust = 0;
    }
    if (autoLanding) {
      if (wx < FINISH_ROAD_X) {
        // Ease smoothly in and out toward CAR_REST_Y over CALM_OPEN_GAP (300px)
        const landT = Math.max(0, Math.min(1.0, (wx - TUNNEL_END_X) / CALM_OPEN_GAP));
        const easeT = landT * landT * (3 - 2 * landT);
        cy = landingStartY + (CAR_REST_Y - landingStartY) * easeT;
        vy = 0;
      } else {
        // Tires touch asphalt exactly when car is above finish road
        cy = CAR_REST_Y;
        vy = 0;
      }
    } else if (!stopping) {
      if (hold) {
        thrust = Math.min(1, thrust + dt / THRUST_RISE_TIME);
      } else {
        thrust = Math.max(0, thrust - dt / THRUST_FALL_TIME);
      }
      const vertAccel = -LIFT_ACCEL * thrust + GRAVITY * (1 - thrust);
      vy += vertAccel * dt;
      vy *= Math.exp(-AIR_DRAG * dt);
      vy = Math.max(-MAX_UP_SPEED, Math.min(MAX_DOWN_SPEED, vy));
      cy += vy * dt;
      const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
      const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
      const onRoadPlatform = onStartPlatform || onFinishPlatform;
      if (onRoadPlatform) {
        if (!hold && cy >= CAR_REST_Y) {
          cy = CAR_REST_Y;
          vy = 0;
          thrust = 0;
        } else if (cy > CAR_REST_Y) {
          cy = CAR_REST_Y;
          if (vy > 0) vy = 0;
        }
      }
      if (cy < 16) { cy = 16; vy = 0; }
      if (cy > H - 16) { cy = H - 16; vy = 0; }
    }

    // Finish Line: when finish line reaches car's x position on asphalt, level is complete
    // Confetti starts, score shows 100, scroll speed eases down to 0 in STOP_TIME (1.2s)
    // One second after car stopped (STOP_TIME + 1.0s = 2.2s), show "Level N Clear!" popup
    if (wx >= FINISH_LINE_X && !stopping && cy >= CAR_REST_Y - 2) {
      stopping = true;
      stopTimer = 0;
      playWinSound();
      initConfetti();
    }

    let ease = 1;
    if (stopping) {
      stopTimer += dt;
      if (stopTimer <= STOP_TIME) {
        ease = Math.max(0, 1 - stopTimer / STOP_TIME);
      } else {
        ease = 0;
      }
      cy = CAR_REST_Y;
      vy = 0;
      hold = false;
      thrust = 0;
      if (stopTimer >= STOP_TIME + 1.0) {
        st = 'level_complete';
        stopping = false;
        autoLanding = false;
        hold = false;
        vy = 0;
        cy = CAR_REST_Y;
        levelCompleteTimer = 0;
        levelJustCleared = curLevel;

        const ratio = levelCoinsTotal > 0 ? (levelCoinsCollected / levelCoinsTotal) : 1;
        earnedStars = 1;
        if (ratio >= 0.60) earnedStars = 2;
        if (ratio >= 0.90) earnedStars = 3;
        isPerfect = (levelCoinsTotal > 0 && levelCoinsCollected >= levelCoinsTotal);
        perfectBonusGiven = false;
        starSoundsPlayed = [false, false, false];

        saveStars(curLevel, earnedStars);

        const nextLvl = curLevel + 1;
        const clearScore = 100 * curLevel;
        if (clearScore > best) best = clearScore;
        saveProgress(curLevel, Math.max(highestLevel, nextLvl), best);
      }
    }

    const curScrollSpeed = sp * ease;
    cam += curScrollSpeed * dt;
    carDrawX = CAR_X;

    const wheelRadiusPx = CAR_DRAW_W * WHEEL_RADIUS;
    if (wheelRadiusPx > 0 && curScrollSpeed > 0) {
      const targetSpinMult = (hold && !autoLanding && !stopping) ? 2.2 : 1.0;
      if (thrustSpinMultiplier < targetSpinMult) {
        thrustSpinMultiplier = Math.min(targetSpinMult, thrustSpinMultiplier + (1.2 / 0.08) * dt);
      } else if (thrustSpinMultiplier > targetSpinMult) {
        thrustSpinMultiplier = Math.max(targetSpinMult, thrustSpinMultiplier - (1.2 / 0.30) * dt);
      }
      currentAngularSpeed = (curScrollSpeed / wheelRadiusPx) * thrustSpinMultiplier;
      wheelAngle += currentAngularSpeed * dt;
      wheelRot = wheelAngle;
    }

    // Flying sound & thruster smoke
    const onStartPlatform = (wx >= START_ROAD_START && wx <= START_ROAD_END);
    const onFinishPlatform = (wx >= FINISH_ROAD_X && wx <= FINISH_ROAD_END);
    const onRoadPlatform = onStartPlatform || onFinishPlatform;
    const isCarOnRoad = onRoadPlatform && (cy >= CAR_REST_Y - 2);
    const isCarInAir = !isCarOnRoad;

    const isFlying = (hold && isCarInAir && st === 'play' && !autoLanding && !stopping);
    if (isFlying) {
      if (!isFlySoundPlaying) {
        startFlySound();
      }
    } else {
      if (isFlySoundPlaying) {
        stopFlySound();
      }
    }

    // Wheel thruster smoke during normal flight (no smoke during landing or driving on road)
    if (hold && isCarInAir && st === 'play' && !autoLanding && !stopping) {
      const drawW = CAR_DRAW_W;
      const drawH = CAR_DRAW_H;
      const rearWheelOx = -drawW / 2 + drawW * WHEEL_REAR_X;
      const frontWheelOx = -drawW / 2 + drawW * WHEEL_FRONT_X;
      const smokeY = cy + drawH / 2;
      for (const ox of [rearWheelOx, frontWheelOx]) {
        parts.push({
          x: CAR_X + ox,
          y: smokeY,
          vx: rnd(-3, 3) - sp * 0.15,
          vy: rnd(140, 230),
          l: 0,
          m: rnd(0.3, 0.45),
          size: rnd(4, 7) * (CAR_SCALE * 0.6)
        });
      }
    }
    gameTime += dt;
    for (const s of segs) {
      if (s.moving) {
        const moveY = Math.sin(gameTime * s.moveSpeed + s.movePhase) * s.moveAmp;
        s.curTop = s.top + moveY;
        s.curBot = s.bot + moveY;
      } else {
        s.curTop = s.top;
        s.curBot = s.bot;
      }
    }

    for (const s of segs) {
      // Crash cannot happen after the last spike or during finish run
      if (stopping || autoLanding || wx >= TUNNEL_END_X) break;
      const curTop = (s.curTop !== undefined) ? s.curTop : s.top;
      const curBot = (s.curBot !== undefined) ? s.curBot : s.bot;
      if (wx + HITBOX_HALF_W > s.x && wx - HITBOX_HALF_W < s.x + s.w && !s.isOpen) {
        if (cy - HITBOX_TOP_OFFSET < curTop - 18 || cy + HITBOX_BOT_OFFSET > curBot + 18) { die(); break; }
        let hit = false;
        const count = s.topSpikes ? s.topSpikes.length : 0;
        for (let i = 0; i < count; i++) {
          const spX = s.x + i * 12;
          if (wx + HITBOX_HALF_W > spX && wx - HITBOX_HALF_W < spX + 12) {
            const topTip = (curTop - 18) + s.topSpikes[i].h;
            const botTip = (curBot + 18) - s.botSpikes[i].h;
            if ((cy - HITBOX_TOP_OFFSET) < topTip - 6 || (cy + HITBOX_BOT_OFFSET) > botTip + 6) {
              hit = true;
              break;
            }
          }
        }
        if (hit) { die(); break; }
      }
    }
    if (stopping) {
      updateConfetti(dt);
    }
  } else if (st === 'level_complete') {
    levelCompleteTimer += dt;
    cy = CAR_REST_Y;
    vy = 0;
    updateConfetti(dt);
  }

  updateThrustAudio(dt);

  for (const p of parts) { p.l += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.l < p.m);
}

function drawLoadingScreen() {
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#38bdf8');
  bgGrad.addColorStop(1, '#0284c7');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawFluffyClouds(ctx, 180, 160, 1.4, 0.85);

  const carCenterX = W / 2;
  const bounceY = Math.sin(loadingTimer * 4.5) * 5.5;
  const carCenterY = H * 0.38 + bounceY;

  // Car centered at about 60 percent of screen width
  const loadW = Math.round(W * 0.60);
  const loadH = trimmedCarCanvas
    ? Math.round(loadW * (trimmedCarCanvas.height / trimmedCarCanvas.width))
    : Math.round(loadW * 0.42);
  const carScale = (W * 0.60) / 72;

  const carReady = (trimmedCarCanvas != null);
  const useFallback = !carReady && (carImgFailed || loadingTimer >= 1.5);

  if (carReady || useFallback) {
    ctx.save();
    ctx.globalAlpha = 1;

    // Soft dark-blue shadow under the car
    ctx.save();
    const shadowW = loadW * 0.44;
    const shadowH = 7.5;
    const shadowY = carCenterY + loadH * 0.45;
    const shadowGrad = ctx.createRadialGradient(carCenterX, shadowY, 2, carCenterX, shadowY, shadowW);
    shadowGrad.addColorStop(0, 'rgba(15, 23, 62, 0.45)');
    shadowGrad.addColorStop(0.55, 'rgba(15, 23, 62, 0.2)');
    shadowGrad.addColorStop(1, 'rgba(15, 23, 62, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(carCenterX, shadowY, shadowW, shadowH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.translate(carCenterX, carCenterY);

    // Very soft warm yellow glow behind the car
    ctx.save();
    const glowR = loadW * 0.54;
    const glowGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, glowR);
    glowGrad.addColorStop(0, 'rgba(253, 224, 71, 0.38)');
    glowGrad.addColorStop(0.5, 'rgba(250, 204, 21, 0.16)');
    glowGrad.addColorStop(1, 'rgba(250, 204, 21, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Thin animated speed lines behind the car
    ctx.save();
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const lineY = -loadH * 0.22 + i * (loadH * 0.16);
      const phase = (loadingTimer * 3.2 + i * 1.6) % 1;
      const startX = -loadW * 0.42 - phase * 55;
      const len = 22 + (i % 3) * 14;
      const lineAlpha = (0.25 + 0.4 * Math.sin(phase * Math.PI)).toFixed(2);
      const lineGrad = ctx.createLinearGradient(startX - len, 0, startX, 0);
      lineGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      lineGrad.addColorStop(1, `rgba(255, 255, 255, ${lineAlpha})`);
      ctx.strokeStyle = lineGrad;
      ctx.beginPath();
      ctx.moveTo(startX - len, lineY);
      ctx.lineTo(startX, lineY);
      ctx.stroke();
    }
    ctx.restore();

    // Yellow sports car image
    if (trimmedCarCanvas) {
      ctx.shadowColor = 'rgba(15, 23, 62, 0.35)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(trimmedCarCanvas, -loadW / 2, -loadH / 2, loadW, loadH);

      // Rotating sports wheels on loading screen
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      if (wheelSpritesReady && rearWheelSprite && frontWheelSprite) {
        const loadRearX = -loadW / 2 + loadW * WHEEL_REAR_X;
        const loadFrontX = -loadW / 2 + loadW * WHEEL_FRONT_X;
        const loadWheelY = -loadH / 2 + loadH * WHEEL_Y;
        const loadWheelR = loadW * WHEEL_RADIUS;
        const loadWheelD = loadWheelR * 2;

        ctx.save();
        ctx.translate(loadRearX, loadWheelY);
        ctx.rotate(loadingWheelRot);
        ctx.drawImage(rearWheelSprite, -loadWheelR, -loadWheelR, loadWheelD, loadWheelD);
        ctx.restore();

        ctx.save();
        ctx.translate(loadFrontX, loadWheelY);
        ctx.rotate(loadingWheelRot);
        ctx.drawImage(frontWheelSprite, -loadWheelR, -loadWheelR, loadWheelD, loadWheelD);
        ctx.restore();
      } else {
        const loadRearX = -loadW / 2 + loadW * 0.1843;
        const loadFrontX = -loadW / 2 + loadW * 0.8190;
        const loadWheelY = -loadH / 2 + loadH * 0.7026;
        const loadWheelR = loadH * 0.2908;

        drawSportsWheel(loadRearX, loadWheelY, loadWheelR, loadingWheelRot);
        drawSportsWheel(loadFrontX, loadWheelY, loadWheelR, loadingWheelRot);
      }
    } else {
      ctx.scale(carScale, carScale);
      renderCarBody(loadingWheelRot);
    }

    ctx.restore();
  }

  // Game name under the car
  const titleY = carCenterY + loadH / 2 + 50;
  drawGlossyText('THORN RUSH', W / 2, titleY, 44, 'center', '#ffffff', '#0f172a', 7);

  // Loading bar and "Loading..." at the bottom
  const barW = W * 0.70;
  const barH = 18;
  const barX = W / 2 - barW / 2;
  const barY = H * 0.74;

  const pct = Math.min(100, Math.floor(visualLoadProgress * 100));
  drawGlossyText(`Loading... ${pct}%`, W / 2, barY - 14, 16, 'center', '#ffffff', '#0f172a', 4);

  // Background track
  ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
  roundRect(ctx, barX, barY, barW, barH, barH / 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  roundRect(ctx, barX, barY, barW, barH, barH / 2);
  ctx.stroke();

  // Progress follows real loading progress with car matching yellow-to-orange gradient
  const fillW = Math.max(barH, barW * visualLoadProgress);
  const fillGrad = ctx.createLinearGradient(0, barY, 0, barY + barH);
  fillGrad.addColorStop(0, '#fef08a');
  fillGrad.addColorStop(0.45, '#facc15');
  fillGrad.addColorStop(1, '#ea580c');
  ctx.fillStyle = fillGrad;
  roundRect(ctx, barX, barY, fillW, barH, barH / 2);
  ctx.fill();

  // Glossy highlight on loading bar
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, barX, barY, fillW, barH, barH / 2);
  ctx.clip();
  const glossGrad = ctx.createLinearGradient(0, barY, 0, barY + barH * 0.55);
  glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
  glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0.12)');
  ctx.fillStyle = glossGrad;
  ctx.fillRect(barX, barY, fillW, barH * 0.5);
  ctx.restore();

  // Tiny gray debug error message in corner if any error occurred
  if (loadingErrorMsg) {
    ctx.save();
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(100, 116, 139, 0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(String(loadingErrorMsg).slice(0, 48), 8, H - 8);
    ctx.restore();
  }
}

// ==========================================
// REAL CAMERA SPEED MEASUREMENT & DEBUG OVERLAY
// ==========================================
let camSamples = [];
let realSpeedWPerSec = 0;
let realSpeedPxPerSec = 0;

function updateRealSpeedMeasurement(nowSec) {
  camSamples.push({ t: nowSec, cam: cam });
  while (camSamples.length > 2 && camSamples[0].t < nowSec - 1.0) {
    camSamples.shift();
  }
  if (camSamples.length >= 2) {
    const oldest = camSamples[0];
    const newest = camSamples[camSamples.length - 1];
    const dtWindow = newest.t - oldest.t;
    if (dtWindow >= 0.08) {
      const dCam = newest.cam - oldest.cam;
      realSpeedPxPerSec = Math.max(0, dCam / dtWindow);
      realSpeedWPerSec = realSpeedPxPerSec / W;
    }
  }
}

  drawRoundGlossyButton(cx + cw - 12, cy + 12, 17, BUTTON_THEMES.red, 'close', isXPressed);

  // Play star sound when each star appears
  const starDelays = [0.35, 0.70, 1.05];
  for (let i = 0; i < 3; i++) {
    if (earnedStars >= (i + 1) && levelCompleteTimer >= starDelays[i] && !starSoundsPlayed[i]) {
      starSoundsPlayed[i] = true;
      playStarSound(i + 1);
    }
  }

  // Draw 3 stars with sequential pop animation
  const starCoords = [
    { x: W / 2 - 50, y: cy + 54, r: 19 },
    { x: W / 2,      y: cy + 42, r: 25 },
    { x: W / 2 + 50, y: cy + 54, r: 19 }
  ];

  for (let i = 0; i < 3; i++) {
    const sc = starCoords[i];
    const delay = starDelays[i];
    if (earnedStars >= (i + 1)) {
      if (levelCompleteTimer < delay) {
        drawEmptyStar(sc.x, sc.y, sc.r);
      } else {
        const t = (levelCompleteTimer - delay) / 0.22;
        let scale = 1.0;
        if (t < 1.0) {
          scale = 1.0 + 0.35 * Math.sin(t * Math.PI);
        }
        drawGoldStar(sc.x, sc.y, sc.r, scale);
      }
    } else {
      drawEmptyStar(sc.x, sc.y, sc.r);
    }
  }

  // PERFECT bonus: if 100% coins collected
  if (isPerf) {
    drawGoldenPerfectRibbon(W / 2, cy + 86, 210, 30);

    if (levelCompleteTimer >= 1.25 && !perfectBonusGiven) {

          curY: ribY,
          endX: wX,
          endY: wY,
          t: -k * 0.045,
          dur: 0.52,
          type: 'coin'
        });
      }
    }
  }

  // Quick count-up for "Coins: collected / total" with gold coin icon
  const countT = Math.min(1.0, levelCompleteTimer / 0.65);

    ctx.drawImage(spr, coinCX - (spr.width * s) / 2, coinCY - (spr.height * s) / 2, spr.width * s, spr.height * s);
  } else {

    ctx.beginPath();
    ctx.arc(coinCX, coinCY, coinR * 0.85, 0, Math.PI * 2);

    ctx.fill();

  // Draw Flying Coins above popup
  for (let i = 0; i < flyingCoins.length; i++) {
    const fc = flyingCoins[i];

    const spr = getCoinSprite(fc.type, curAnimFrame);
    if (spr) {

  let shakeX = 0, shakeY = 0;
  if (speedMode === 'turbo' && st === 'play' && finishRunStage === 'none' && !stopping) {
    shakeX = (Math.random() * 2 - 1) * 1.0;
    shakeY = (Math.random() * 2 - 1) * 1.0;
    ctx.save();
    ctx.translate(shakeX, shakeY);
  }

  // 1. Picture background (or fallback procedural)
  drawBackground();

  // 2. Wheel thruster smoke (behind road and car; never drawn on top of road or truss)
  const sRoadX1 = START_ROAD_START - cam - 20;
  const sRoadX2 = START_ROAD_END - cam + 20;
  const fRoadX1 = FINISH_ROAD_X - cam - 20;
  const fRoadX2 = FINISH_ROAD_END - cam + 20;

  for (const p of parts) {
    const k = 1 - p.l / p.m;
    if (k <= 0) continue;
    const r = p.size * (1 + 0.3 * (1 - k));

    // Exclude any smoke from being drawn on top of the road or truss
    const overRoad = (p.x + r >= sRoadX1 && p.x - r <= sRoadX2) || (p.x + r >= fRoadX1 && p.x - r <= fRoadX2);
    if (overRoad && p.y + r >= ROAD_TOP - 2) {
      if (p.y - r >= ROAD_TOP - 2) continue;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, ROAD_TOP - 2);
      ctx.clip();
      ctx.globalAlpha = 0.7 * k;
      ctx.fillStyle = p.color || '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.28);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.globalAlpha = 0.7 * k;
      ctx.fillStyle = p.color || '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.28);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // 3. Starting Road Platform
  drawRoadPlatform(START_ROAD_START, START_ROAD_END, ROAD_TOP);

  // 4. Finish Road Platform
  drawRoadPlatform(FINISH_ROAD_X, FINISH_ROAD_END, ROAD_TOP, true);

  // 5. Spikes & Studded Rails with continuous connected rail pieces
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    const x = s.x - cam;
    if (!s.isOpen) drawWall(s, x);

    const curTop = (s.curTop !== undefined) ? s.curTop : s.top;
    const curBot = (s.curBot !== undefined) ? s.curBot : s.bot;

    // Connected Rails between neighboring segments (visual only, no collision)
    if (i < segs.length - 1) {
      const sNext = segs[i + 1];
      if (!s.isOpen && !sNext.isOpen) {
        const nextTop = (sNext.curTop !== undefined) ? sNext.curTop : sNext.top;
        const nextBot = (sNext.curBot !== undefined) ? sNext.curBot : sNext.bot;
        const seamX = (s.x + s.w) - cam;
        if (Math.abs(curTop - nextTop) > 1) {
          drawVerticalRailConnector(seamX, curTop - 28, nextTop - 28, cfg);
        }
        if (Math.abs(curBot - nextBot) > 1) {
          drawVerticalRailConnector(seamX, curBot + 18, nextBot + 18, cfg);
        }
      }
    }

    if (s.topSpikes) {
      const count = s.topSpikes.length;
      for (let j = 0; j < count; j++) {
        drawSpike(x + j * 12, curTop - 18, true, s.topSpikes[j]);
      }
    }
    if (s.botSpikes) {
      const count = s.botSpikes.length;
      for (let j = 0; j < count; j++) {
        drawSpike(x + j * 12, curBot + 18, false, s.botSpikes[j]);
      }
    }
  }

  // 5b. Collectible Coins and Gems
  const animFrame = Math.floor((gameTime * 10) % 8);

  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    const screenX = c.x - cam;
    if (screenX < -50 || screenX > W + 50) continue;

    if (!c.collected) {
      const f = Math.floor((gameTime * 10 + c.phase) % 8);
      const spr = getCoinSprite(c.type, f);
      if (spr) {
        if (c.type === 'gold') {
          ctx.save();
          ctx.shadowColor = 'rgba(250, 204, 21, 0.7)';
          ctx.shadowBlur = 10;
          ctx.drawImage(spr, screenX - spr.width / 2, c.y - spr.height / 2);
          ctx.restore();
        } else {
          ctx.drawImage(spr, screenX - spr.width / 2, c.y - spr.height / 2);
        }
      }
    } else if (c.popTimer > 0) {
      const popK = c.popTimer / 0.22;
      const popScale = 1.0 + (1 - popK) * 0.6;
      const spr = getCoinSprite(c.type, 0);
      if (spr) {
        ctx.save();
        ctx.globalAlpha = popK;
        ctx.translate(screenX, c.y);
        ctx.scale(popScale, popScale);
        ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
        ctx.restore();
      }
    }
  }

  // Draw Coin Sparkles
  for (let i = 0; i < coinSparkles.length; i++) {
    const spk = coinSparkles[i];
    const alpha = Math.max(0, spk.life / spk.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = spk.color;
    ctx.shadowColor = spk.color;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw Flying Coins
  for (let i = 0; i < flyingCoins.length; i++) {
    const fc = flyingCoins[i];
    if (fc.t < 0) continue;
    const spr = getCoinSprite(fc.type, animFrame);
    if (spr) {
      ctx.save();
      const glow = (fc.type === 'gem') ? '#38bdf8' : ((fc.type === 'gold') ? '#fde047' : ((fc.type === 'silver') ? '#cbd5e1' : '#fb923c'));
      ctx.shadowColor = glow;
      ctx.shadowBlur = 6;
      ctx.drawImage(spr, fc.curX - spr.width / 2, fc.curY - spr.height / 2);
      ctx.restore();
    }
  }

  // Draw Floating Texts (+1, +5)
  for (let i = 0; i < coinFloatTexts.length; i++) {
    const ft = coinFloatTexts[i];
    const alpha = Math.min(1, ft.timer / 0.3);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawGlossyText(ft.text, ft.x, ft.y, 16, 'center', ft.color, '#0f172a', 3.8);
    ctx.restore();
  }

  // 6. Sky Car (thin dark outline + soft shadow)
  if (st === 'ready') {
    const menuAlpha = Math.min(1, menuFadeTimer / 0.3);
    ctx.save();
    ctx.globalAlpha = menuAlpha;
    car(carDrawX);
    ctx.restore();
  } else {
    car(carDrawX);
  }

  // Thin horizontal speed lines in the stage's accent color
  const curStage = getStage(curLevel);
  updateAndDrawSpeedLines(dt, speed(), curStage);

  if (shakeX !== 0 || shakeY !== 0) {
    ctx.restore();
  }

  // 7. UI and Screens (all HUD text in white with dark outline)
  if (st === 'play') {
    if (stopping || confettiStarted) {
      drawConfetti();
    }
    drawHUD();
    if (SHOW_DEBUG) {
      drawDebugOverlay();
    }

  } else if (st === 'transition') {
    drawHUD();
    let cardAlpha = 1;
    if (transitionTimer < 0.35) cardAlpha = transitionTimer / 0.35;
    else if (transitionTimer > 1.35) cardAlpha = Math.max(0, 1 - (transitionTimer - 1.35) / 0.4);

    ctx.save();
    ctx.globalAlpha = cardAlpha;
    const cardText = getLevelTitleCardText(curLevel);
    const ribbonW = 270;
    drawRibbonHeader(W / 2, 210 + topInset * 0.5, ribbonW, 48, cardText, BUTTON_THEMES.blue, 2);
    ctx.restore();

    if (transitionTimer < 0.25) {
      ctx.save();
      ctx.fillStyle = `rgba(0, 0, 0, ${Math.max(0, 1 - transitionTimer / 0.25)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

  } else if (st === 'ready') {
    const menuAlpha = Math.min(1, menuFadeTimer / 0.3);
    ctx.save();
    ctx.globalAlpha = menuAlpha;

    // Top Right: Best score pill with gold star badge and Wallet Coin pill with gold coin
    drawScorePill(W - 110, 16 + topInset, 98, 26, best, true);
    drawWalletCoinPill(W - 110, 48 + topInset, 98, 26, wallet);

    // Title Logo
    drawGlossyText('THORN RUSH', W / 2, 120 + topInset * 0.6, 46, 'center', '#ffffff', '#0f172a', 8);
    const menuStageText = getStageMenuText(curLevel);
    drawGlossyText(menuStageText, W / 2, 165 + topInset * 0.6, 18, 'center', '#ffffff', '#0f172a', 4.5);

    // Bottom Row: moved up by botInset
    const btnY = H - 70 - botInset;
    const playY = H - 98 - botInset;

    const isSetPressed = (activePress === 'open_settings');
    drawRoundGlossyButton(52, btnY, 26, BUTTON_THEMES.blue, 'gear', isSetPressed);

    const isLevelPressed = (activePress === 'start_level');
    drawGlossyButton(96, playY, 168, 56, BUTTON_THEMES.green, `LEVEL ${curLevel}`, null, isLevelPressed, 28);

    const isCarPressed = (activePress === 'car_garage');
    drawRoundGlossyButton(308, btnY, 26, BUTTON_THEMES.purple, 'wheel', isCarPressed);

    ctx.restore();

  } else if (st === 'level_complete') {
    drawLevelCompletePopup();

  } else if (st === 'dead') {
    drawCrashPopup();
  }

  if (settingsOpen) {
    drawSettingsPopup();
  }

  if (toastMsg && toastTimer > 0) {
    ctx.save();
    const tw = 180, th = 38;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#1e1b4b';
    roundRect(ctx, W / 2 - tw / 2, 230, tw, th, 19);
    ctx.fill();
    ctx.strokeStyle = '#c084fc';
    ctx.lineWidth = 2;
    roundRect(ctx, W / 2 - tw / 2, 230, tw, th, 19);
    ctx.stroke();
    drawGlossyText(toastMsg, W / 2, 249, 16, 'center', '#ffffff', '#3b0764', 3.8);
    ctx.restore();
  }
}

function draw(dt = 0.016) {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  if (st === 'loading') {
    const loadingAlpha = Math.max(0, 1 - loadingFade);
    if (loadingAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = loadingAlpha;
      drawLoadingScreen();
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  drawGameContent(dt);
  ctx.restore();
}

function loop(t) {
  if (!last) last = t;
  const rawDt = (t - last) / 1000;
  last = t;
  const dt = Math.max(0.001, Math.min(0.1, rawDt || 0.016));
  step(dt);
  draw(dt);
  requestAnimationFrame(loop);
}

// ==========================================
// TOUCH & POINTER CONTROLS
// ==========================================
function getCanvasCoords(e) {
  const rect = cv.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function inBox(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}

function inCircle(px, py, cx, cy, r) {
  const dx = px - cx, dy = py - cy;
  return dx * dx + dy * dy <= r * r;
}

function handlePointerDown(e) {
  initAudio();
  const { x, y } = getCanvasCoords(e);

  if (st === 'loading') return;

  if (settingsOpen) {
    const cw = 290, ch = 440;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 10;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_settings';
      return;
    }
    const btnSz = 86;
    const soundBtnX = cx + 24, soundBtnY = cy + 40;
    if (inBox(x, y, soundBtnX, soundBtnY, btnSz, btnSz)) {
      activePress = 'toggle_sound';
      return;
    }
    const vibBtnX = cx + cw - 24 - btnSz, vibBtnY = cy + 40;
    if (inBox(x, y, vibBtnX, vibBtnY, btnSz, btnSz)) {
      activePress = 'toggle_vibrate';
      return;
    }

    // SPEED BUTTONS: Normal, Fast, Turbo
    const speedCardX = cx + 18, speedCardY = cy + 138, speedCardW = cw - 36, speedCardH = 64;
    const spBtnW = 74, spBtnH = 32, spBtnY = speedCardY + 24;
    const sp1X = speedCardX + 8;
    const sp2X = sp1X + 82;
    const sp3X = sp2X + 82;

    if (inBox(x, y, sp1X, spBtnY, spBtnW, spBtnH)) {
      activePress = 'set_speed_normal';
      return;
    }
    if (inBox(x, y, sp2X, spBtnY, spBtnW, spBtnH)) {
      activePress = 'set_speed_fast';
      return;
    }
    if (inBox(x, y, sp3X, spBtnY, spBtnW, spBtnH)) {
      activePress = 'set_speed_turbo';
      return;
    }

    // Stepper minus & plus buttons
    const stepCardX = cx + 18, stepCardY = cy + 212, stepCardW = cw - 36, stepCardH = 50;
    if (inBox(x, y, stepCardX + 2, stepCardY + 2, 46, 46)) {
      if (curLevel > 1) {
        activePress = 'dec_start_level';
        return;
      }
    }
    if (inBox(x, y, stepCardX + stepCardW - 48, stepCardY + 2, 46, 46)) {
      if (curLevel < highestLevel) {
        activePress = 'inc_start_level';
        return;
      }
    }

    // Alloy Rim customizer card
    const rimCardX = cx + 18, rimCardY = cy + 270, rimCardW = cw - 36, rimCardH = 50;
    if (inBox(x, y, rimCardX, rimCardY, rimCardW, rimCardH)) {
      activePress = 'cycle_rim_style';
      return;
    }

    if (!resetConfirming) {
      const rBtnW = 168, rBtnH = 32;
      const rBtnX = cx + (cw - rBtnW) / 2, rBtnY = cy + 332;
      if (inBox(x, y, rBtnX, rBtnY, rBtnW, rBtnH)) {
        activePress = 'ask_reset_progress';
        return;
      }
    } else {
      const confH = 32;
      const yesW = 98, yesX = cx + 32, yesY = cy + 352;
      if (inBox(x, y, yesX, yesY, yesW, confH)) {
        activePress = 'confirm_reset_progress';
        return;
      }
      const noW = 98, noX = cx + cw - 32 - noW, noY = cy + 352;
      if (inBox(x, y, noX, noY, noW, confH)) {
        activePress = 'cancel_reset_progress';
        return;
      }
    }

    if (!inBox(x, y, cx, cy, cw, ch)) {
      settingsOpen = false;
      resetConfirming = false;
      playClickSound();
    }
    return;
  }

  if (st === 'ready') {
    const btnY = H - 70 - botInset;
    if (inCircle(x, y, 52, btnY, 32)) {
      activePress = 'open_settings';
      return;
    }
    if (inCircle(x, y, 308, btnY, 32)) {
      activePress = 'car_garage';
      return;
    }
    startLevel(curLevel);
    st = 'play';
    hold = true;
    activePress = 'start_level';
    playClickSound();
    return;
  }

  if (st === 'transition') {
    return;
  }

  if (st === 'level_complete') {
    const cw = 290, ch = 270;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 20;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_complete';
      return;
    }
    const btnW = 210, btnH = 54;
    if (inBox(x, y, W / 2 - btnW / 2, cy + ch - 72, btnW, btnH)) {
      activePress = 'next_level';
      return;
    }
    if (levelCompleteTimer >= 0.8) {
      activePress = 'next_level';
    }
    return;
  }

  if (st === 'dead') {
    const cw = 290, ch = 270;
    const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 - 20;

    if (inCircle(x, y, cx + cw - 12, cy + 12, 24)) {
      activePress = 'close_dead';
      return;
    }
    const btnW = 210, btnH = 54;
    if (inBox(x, y, W / 2 - btnW / 2, cy + ch - 72, btnW, btnH)) {
      activePress = 'try_again';
      return;
    }
    if (performance.now() - deadAt >= 350) {
      activePress = 'try_again';
    }
    return;
  }

  if (st === 'play') {
    if (!stopping && finishRunStage === 'none') {
      hold = true;
    }
  }
}

function handlePointerUp(e) {
  hold = false;

  if (activePress) {
    playClickSound();

    if (activePress === 'close_settings') {
      settingsOpen = false;
      resetConfirming = false;
    } else if (activePress === 'toggle_sound') {
      setSound(!soundEnabled);
      triggerVibrate(30);
    } else if (activePress === 'toggle_vibrate') {
      setVibrate(!vibrateEnabled);
      if (vibrateEnabled) triggerVibrate(40);
    } else if (activePress === 'set_speed_normal') {
      setSpeedMode('normal');
      triggerVibrate(30);
      showToast('Speed: NORMAL (1.0x)');
    } else if (activePress === 'set_speed_fast') {
      setSpeedMode('fast');
      triggerVibrate(30);
      showToast('Speed: FAST (1.7x)');
    } else if (activePress === 'set_speed_turbo') {
      setSpeedMode('turbo');
      triggerVibrate(40);
      showToast('Speed: TURBO (2.3x)');
    } else if (activePress === 'ask_reset_progress') {
      resetConfirming = true;
    } else if (activePress === 'cancel_reset_progress') {
      resetConfirming = false;
    } else if (activePress === 'confirm_reset_progress') {
      resetConfirming = false;
      curLevel = 1;
      highestLevel = 1;
      saveProgress(1, 1, best);
      startLevel(1);
      showToast('Progress reset to Level 1');
    } else if (activePress === 'open_settings') {
      settingsOpen = true;
      resetConfirming = false;
    } else if (activePress === 'dec_start_level') {
      if (curLevel > 1) {
        curLevel--;
        saveProgress(curLevel, highestLevel, best);
        startLevel(curLevel);
        triggerVibrate(25);
        showToast('Level ' + curLevel);
      }
    } else if (activePress === 'inc_start_level') {
      if (curLevel < highestLevel) {
        curLevel++;
        saveProgress(curLevel, highestLevel, best);
        startLevel(curLevel);
        triggerVibrate(25);
        showToast('Level ' + curLevel);
      }
    } else if (activePress === 'start_level') {
      // Game already started on pointerdown
    } else if (activePress === 'car_garage' || activePress === 'cycle_rim_style') {
      cycleAlloyRimStyle();
    } else if (activePress === 'next_level') {
      advanceToNextLevel();
    } else if (activePress === 'close_complete') {
      const nextLvl = (levelJustCleared ? levelJustCleared + 1 : curLevel + 1);
      curLevel = nextLvl;
      saveProgress(curLevel, Math.max(highestLevel, curLevel), best);
      startLevel(curLevel);
      st = 'ready';
      hold = false;
    } else if (activePress === 'try_again') {
      const restartLvl = RETRY_FROM_LEVEL_START ? curLevel : 1;
      curLevel = restartLvl;
      startLevel(curLevel);
      st = 'play';
      hold = false;
    } else if (activePress === 'close_dead') {
      const restartLvl = RETRY_FROM_LEVEL_START ? curLevel : 1;
      curLevel = restartLvl;
      startLevel(curLevel);
      st = 'ready';
      hold = false;
    }

    activePress = null;
  }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudioContext(); handlePointerDown(e); });
window.addEventListener('pointerup', e => { e.preventDefault(); handlePointerUp(e); });
window.addEventListener('pointercancel', () => { hold = false; activePress = null; });
window.addEventListener('blur', () => { hold = false; activePress = null; });
document.addEventListener('visibilitychange', () => { hold = false; activePress = null; });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    ensureAudioContext();
    if (!e.repeat) {
      if (st === 'ready') { startLevel(curLevel); st = 'play'; hold = true; }
      else if (st === 'play') {
        if (!stopping && finishRunStage === 'none') {
          hold = true;
        }
      }
      else if (st === 'dead' && performance.now() - deadAt > 350) { startLevel(curLevel); st = 'play'; }
      else if (st === 'level_complete' && levelCompleteTimer >= 0.8) {
        advanceToNextLevel();
      }
    }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { hold = false; }
});
window.addEventListener('resize', () => {
  resizeCanvas();
  prerenderVignette();
  prerenderStageBackgrounds();
  prerenderCoinFrames();
  initSpeedLines();
  initStageParticles();
  if (curConfig) {
    prerenderSpikes(curConfig);
    preloadedPictures.forEach(pic => {
      if (pic.loaded) updatePictureSeamlessCanvas(pic);
    });
  }
});

loadSpeedSetting();
updateSpeedPhysics();
loadProgress();
loadWallet();
loadStars();
currentBgStage = getStageNumber(curLevel);
prevBgStage = currentBgStage;
bgCrossFadeTimer = 0;
prerenderVignette();
prerenderStageBackgrounds();
prerenderCoinFrames();
initSpeedLines();
initStageParticles();
startLevel(curLevel);
step(0);
draw();
requestAnimationFrame(loop);
})();
</script>
